[package]
name = "clawbound-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "22"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = { version = "0.28", optional = true }
snapclone-theme = { path = "../../shared/uikit/crates/snapclone-theme", optional = true }
egui-winit = { version = "0.28", optional = true, default-features = false }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
winit = { version = "0.29", optional = true }
env_logger = { version = "0.11", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "Window", "Element", "HtmlCanvasElement"] }

[features]
# Native playable window (winit + wgpu surface). Run: cargo run --features app -- --play
app = ["dep:winit", "dep:env_logger", "dep:egui", "dep:egui-winit", "dep:snapclone-theme"]
# Web build (wasm32 + WebGPU/WebGL canvas). Build on a machine with the wasm target.
web = ["app", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook", "dep:console_log", "dep:web-sys"]

[profile.dev]
opt-level = 1
