[package]
name = "clawbound-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
math-kit = { path = "../../shared/math-kit" }
netcode = { path = "../shared/netcode" }
# The parts-web reader/packer, shared with blackstar. `zstd` pulls ruzstd —
# pure Rust, no build script, no cc: this crate cross-compiles to ARM handsets.
bsweb = { path = "../shared/bsweb", features = ["zstd"] }
wgpu = "22"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
egui = { version = "0.28", optional = true }
egui-winit = { version = "0.28", optional = true, default-features = false }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
winit = { version = "0.29", optional = true }
env_logger = { version = "0.11", optional = true }
web-time = { version = "1", optional = true }
snapclone-theme = { path = "../../shared/uikit/crates/snapclone-theme", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "Window", "Element", "HtmlCanvasElement"] }

# Synthesized sound through cpal (needs ALSA headers on Linux: libasound2-dev). Native only:
# the web build gets the silent `audio::Audio` whatever features it carries.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.15", optional = true }

[features]
# Native playable window (winit + wgpu surface). Run: cargo run --features app -- --play
app = ["dep:winit", "dep:env_logger", "dep:egui", "dep:egui-winit", "dep:web-time", "sound"]
# The cpal stream behind `audio::Audio`; off, the handle is the silent one. Part of `app`.
sound = ["dep:cpal"]
# Web build (wasm32 + WebGPU/WebGL canvas). Build on a machine with the wasm target.
web = ["app", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook", "dep:console_log", "dep:web-sys"]

[profile.dev]
opt-level = 1

[dev-dependencies]
# WGSL validation at test time: cargo check does not compile shaders, so a
# malformed one otherwise waits for the first frame that dispatches it.
# Pinned to the version wgpu 22 already resolves, so it adds no new build.
naga = { version = "22", features = ["wgsl-in"] }
