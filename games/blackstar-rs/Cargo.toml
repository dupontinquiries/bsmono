[package]
name = "blackstar"
version = "1.117.0"
edition = "2021"
# examples/shim.rs is an include! fragment, not a binary — declare the two
# harnesses by hand so cargo does not try to build it as one.
autoexamples = false
description = "Blackstar: transforming vehicles in an open world. Rust + wgpu, SDF-generated shapes, generated (not imported) assets."

[features]
default = ["audio", "analog"]
# Procedural sound + music via cpal (needs ALSA headers on Linux: libasound2-dev).
# Build with --no-default-features for a silent binary with zero extra system deps.
audio = ["dep:cpal"]
# Controller support via gilrs (needs libudev-dev on Linux).
gamepad = ["dep:gilrs", "shellkit/gamepad"]
# Wooting analog keyboard input: loads the installed Wooting Analog SDK
# runtime at launch (falls back to digital keys if it isn't there).
analog = ["dep:libloading", "shellkit/analog"]

[dependencies]
# THE RIG (src/rigmotion.rs): the robot-form motion core -- walk/run by Froude
# number, jumps from leg force and gravity, IK that keeps feet planted and
# knees from bending back, aimed arms, weapon hands, ranged fire. A shared
# crate like the others here, with no dependencies of its own.
boneforge = { path = "../shared/boneforge" }
# handheld detection, shared with the other game (games/shared/handheld-detect).
# Detection only -- this game keeps its own Profile::apply tuning.
handheld-detect = { path = "../shared/handheld-detect" }
# voice bank: ids, screenplay parsing, scripts, size budget (games/shared/linebank)
linebank = { path = "../shared/linebank" }
# THE FORGE'S MOUTH (src/raidforge.rs): aperture's completion engine, which is
# logscope-fan's dependency-free ollama client grown a Provider trait — raw
# TcpStream HTTP/1.1, std-only, zero transitive deps, blocking by design so it
# lives on a plain worker thread with no runtime in the tree. Path dep into
# the monorepo's own apps; the game asks it for llama3 completions and parses
# the answer leniently.
aperture-complete = { path = "../../apps/aperture/crates/aperture-complete" }
# Inflate for bots.pack (see src/botpack.rs). Already in Cargo.lock via flate2's
# tree, so declaring it directly costs no new download — and miniz_oxide rather
# than flate2 because this only ever DECOMPRESSES, and flate2 pulls a C zlib
# backend by default.
miniz_oxide = "0.8"
# zstd inflate for v4 packs (src/botpack.rs). Pure Rust for the same reason as
# miniz_oxide: decode-only, and no C toolchain in the cross builds. Pinned to
# 0.7: 0.8 moves StreamingDecoder into ruzstd::decoding and requires cargo
# resolver 3 (rustc >= 1.85-era tooling) — upgrade both together.
ruzstd = "0.7"
# Same proven combo as the reference repo's games (clawbound/soldier): wgpu 22 + winit 0.29.
wgpu = "22"
winit = "0.29"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1", default-features = false, features = ["utils", "names"] }
log = "0.4"
env_logger = "0.11"
# The fleet's control plane, vendored from the logscope-c4-273 monorepo:
# netcode (profiles/sessions/handoff) over the snapcore DHT store.
netcode = { path = "../shared/netcode" }
touchkit = { path = "../../shared/touchkit" }
shellkit = { path = "../shared/shellkit" }
# THE SEAM: what the game asks of a world. Implemented by world::World
# here and by unendlich's chunk manager next (games/shared/worldhost).
worldhost = { path = "../shared/worldhost" }
cpal = { version = "0.15", optional = true }
gilrs = { version = "0.11", optional = true }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
# Offline WGSL validation so shader errors are caught by `cargo test`, not at runtime.
naga = { version = "22", features = ["wgsl-in"] }

[profile.dev]
opt-level = 2          # physics + png decode are unusable at opt 0
# line tables only: readable backtraces at a fraction of the disk cost
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"

[[example]]
name = "botcheck"
path = "examples/botcheck.rs"

[[example]]
name = "botshot"
path = "examples/botshot.rs"

[[example]]
name = "rigpose"
path = "examples/rigpose.rs"

[[example]]
name = "stripcheck"
path = "examples/stripcheck.rs"

[[example]]
name = "refusal_audit"
path = "examples/refusal_audit.rs"

[[example]]
name = "sample_density_check"
path = "examples/sample_density_check.rs"

[[example]]
name = "silhouette_audit"
path = "examples/silhouette_audit.rs"

[[example]]
name = "trace_compact"
path = "examples/trace_compact.rs"

[[example]]
name = "fold_audit"
path = "examples/fold_audit.rs"

[[example]]
name = "check_treads"
path = "examples/check_treads.rs"
