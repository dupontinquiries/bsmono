[package]
name = "linebank"
version = "0.1.0"
edition = "2021"
description = """
The recording side of voice: addressable line ids, a script to hand an actor,
takes mapped back to ids, and the selection policy that makes a small bank
sound varied. Detection borrows audio-kit's millisecond envelope; nothing here
implements DSP.
"""

[dependencies]
audio-kit = { path = "../../../shared/audio-kit" }
