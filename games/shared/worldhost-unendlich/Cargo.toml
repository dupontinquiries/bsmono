[package]
name = "worldhost-unendlich"
version = "0.2.0"
edition = "2021"
description = """
The unendlich half of the seam: `worldhost::WorldHost` for a streamed voxel
world. The geometry is engine-free and tested; the `engine` feature adds the
one impl that knows `ChunkManager`. Deliberately outside both workspaces so
nobody's build depends on it until the engine half has been built once.
"""

[dependencies]
glam = "0.28"
worldhost = { path = "../worldhost" }
unendlich-engine = { path = "../../unendlich/crates/unendlich-engine", default-features = false, optional = true }

[features]
# OFF by default. The pure geometry — cell mapping, surface convention,
# clearance step, the unloaded policy — needs no engine and tests in
# milliseconds. Turning this on pulls a 326k-line Vulkan engine into the build.
default = []
engine = ["dep:unendlich-engine"]
