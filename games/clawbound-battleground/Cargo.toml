[package]
name = "clawbound-battleground"
version = "0.1.0"
edition = "2021"
description = "Clawbound — Battleground: the thirteen legendary ancestors in a microvoxel 5v5 arena, Rust + wgpu"
license = "MIT"
# Two binaries (the game and lanbot): plain `cargo run` runs the game.
default-run = "clawbound-battleground"

[lib]
name = "clawbound"
path = "src/lib.rs"

[[bin]]
name = "clawbound-battleground"
path = "src/main.rs"

[dependencies]
# unendlich's AI authoring layer: Completer, TurnControl, reply hygiene. Pure
# std. mapgen drives ITS completers rather than keeping a look-alike trait.
voxel-tools = { path = "../unendlich/crates/voxel-tools" }
# LAN discovery (and, later, the fleet's friend-id join). std-only.
netcode = { path = "../shared/netcode" }
wgpu = "0.19"
winit = "0.29"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
glam = "0.27"
# Per-part creature posing, extracted verbatim from unendlich-engine (see that
# crate's Cargo.toml). `anim.rs` here supplies only the species layer on top —
# which gait, how hard — because a bison that never bounds is a fact about
# animals, not about posing boxes.
creature-rig = { path = "../shared/creature-rig" }
# Sensing and terrain extracted from unendlich: scent, perception, wind, fog,
# path cost, river flow -- and `stamina`, which is what the gait selector needs
# to know a cat is spent. See games/shared/wildkit.
wildkit = { path = "../shared/wildkit" }
bytemuck = { version = "1.15", features = ["derive"] }
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
# Loaded audio (music, sfx, character voices): a pure-Rust Opus decoder --
# no C, no FFI, cross-compiles for ARM like the rest -- and a realtime-safe
# ring buffer for commands into the audio callback. Headless and always on:
# the bank and mixer are tested without an audio device.
opus-pure = "0.2"
rtrb = "0.4"
cpal = { version = "0.15", optional = true }
gilrs = { version = "0.11", optional = true }

[features]
# Procedural wind/rain/thunder ambience through cpal. On by default; build
# with `--no-default-features` on machines without ALSA/CoreAudio headers
# (the DSP core in src/audio.rs compiles and is tested either way).
default = ["audio"]
audio = ["cpal"]
# Controller support via gilrs (needs libudev-dev on Linux).
gamepad = ["gilrs"]

[profile.release]
opt-level = 3
lto = "thin"

# Optimize dependencies in debug builds so the sim + software Vulkan stay usable
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
naga = { version = "0.19", features = ["wgsl-in"] }
