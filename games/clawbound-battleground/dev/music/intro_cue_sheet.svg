<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#141319"/><text x="60" y="56" font-size="34" font-weight="bold" fill="#fbf6ea">Intro score -- cue sheet</text><text x="60" y="90" font-size="18" fill="#cfc7b6">Full intro (first match of a session): 61.4 s -- file music/intro_full.opus.   Short intro (every later match): 17.4 s, the part after the prologue -- file music/intro.opus.</text><text x="60" y="116" font-size="16" fill="#9e98a8">Times in seconds from the intro's start. Bar grid at 90 BPM, 4/4 (2.67 s a bar). The camera moves between sections over ~1 s (0.9-1.6 s), not cuts.</text><line x1="60" y1="150" x2="60" y2="370" stroke="#3a3843" stroke-width="1"/><text x="63" y="382" font-size="11" fill="#5e5a68">bar 1</text><line x1="132.96417" y1="150" x2="132.96417" y2="370" stroke="#24232b" stroke-width="1"/><line x1="205.92833" y1="150" x2="205.92833" y2="370" stroke="#24232b" stroke-width="1"/><line x1="278.89252" y1="150" x2="278.89252" y2="370" stroke="#24232b" stroke-width="1"/><line x1="351.85666" y1="150" x2="351.85666" y2="370" stroke="#3a3843" stroke-width="1"/><text x="354.85666" y="382" font-size="11" fill="#5e5a68">bar 5</text><line x1="424.82086" y1="150" x2="424.82086" y2="370" stroke="#24232b" stroke-width="1"/><line x1="497.785" y1="150" x2="497.785" y2="370" stroke="#24232b" stroke-width="1"/><line x1="570.74915" y1="150" x2="570.74915" y2="370" stroke="#24232b" stroke-width="1"/><line x1="643.71326" y1="150" x2="643.71326" y2="370" stroke="#3a3843" stroke-width="1"/><text x="646.71326" y="382" font-size="11" fill="#5e5a68">bar 9</text><line x1="716.6774" y1="150" x2="716.6774" y2="370" stroke="#24232b" stroke-width="1"/><line x1="789.6416" y1="150" x2="789.6416" y2="370" stroke="#24232b" stroke-width="1"/><line x1="862.6058" y1="150" x2="862.6058" y2="370" stroke="#24232b" stroke-width="1"/><line x1="935.5699" y1="150" x2="935.5699" y2="370" stroke="#3a3843" stroke-width="1"/><text x="938.5699" y="382" font-size="11" fill="#5e5a68">bar 13</text><line x1="1008.5341" y1="150" x2="1008.5341" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1081.4983" y1="150" x2="1081.4983" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1154.4625" y1="150" x2="1154.4625" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1227.4266" y1="150" x2="1227.4266" y2="370" stroke="#3a3843" stroke-width="1"/><text x="1230.4266" y="382" font-size="11" fill="#5e5a68">bar 17</text><line x1="1300.391" y1="150" x2="1300.391" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1373.3551" y1="150" x2="1373.3551" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1446.3193" y1="150" x2="1446.3193" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1519.2834" y1="150" x2="1519.2834" y2="370" stroke="#3a3843" stroke-width="1"/><text x="1522.2834" y="382" font-size="11" fill="#5e5a68">bar 21</text><line x1="1592.2478" y1="150" x2="1592.2478" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1665.2119" y1="150" x2="1665.2119" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1738.1761" y1="150" x2="1738.1761" y2="370" stroke="#24232b" stroke-width="1"/><rect x="60" y="160" width="1203.9088" height="56" fill="#5a4a36" stroke="#141319" stroke-width="2"/><text x="65" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">PROLOGUE</text><text x="65" y="202" font-size="12" fill="#e0d8c8">0.0s</text><rect x="1263.9088" y="160" width="109.44617" height="56" fill="#3c4a5e" stroke="#141319" stroke-width="2"/><text x="1268.9088" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">PAN</text><text x="1268.9088" y="202" font-size="12" fill="#e0d8c8">44.0s</text><rect x="1373.355" y="160" width="43.778564" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="1378.355" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">TOP</text><text x="1378.355" y="202" font-size="12" fill="#e0d8c8">48.0s</text><rect x="1417.1335" y="160" width="43.77832" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="1422.1335" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">MID</text><text x="1422.1335" y="202" font-size="12" fill="#e0d8c8">49.6s</text><rect x="1460.9119" y="160" width="43.778564" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="1465.9119" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">BOT</text><text x="1465.9119" y="202" font-size="12" fill="#e0d8c8">51.2s</text><rect x="1504.6904" y="160" width="49.250732" height="56" fill="#35607f" stroke="#141319" stroke-width="2"/><text x="1509.6904" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">FROSTFANG</text><text x="1509.6904" y="202" font-size="12" fill="#e0d8c8">52.8s</text><rect x="1553.9412" y="160" width="49.250854" height="56" fill="#8a4028" stroke="#141319" stroke-width="2"/><text x="1558.9412" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">EMBERCLAW</text><text x="1558.9412" y="202" font-size="12" fill="#e0d8c8">54.6s</text><rect x="1603.192" y="160" width="98.501465" height="56" fill="#6e5a24" stroke="#141319" stroke-width="2"/><text x="1608.192" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">VERSUS</text><text x="1608.192" y="202" font-size="12" fill="#e0d8c8">56.4s</text><rect x="1701.6935" y="160" width="38.306396" height="56" fill="#3a3844" stroke="#141319" stroke-width="2"/><text x="1706.6935" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">SETTLE</text><text x="1706.6935" y="202" font-size="12" fill="#e0d8c8">60.0s</text><text x="60" y="144" font-size="13" fill="#8f8a98">camera</text><text x="60" y="238" font-size="13" fill="#8f8a98">narrator (narrator/prologue1..8.opus) -- the score ducks under it</text><rect x="101.04234" y="250" width="3" height="54" fill="#d8b878"/><text x="107.04234" y="266" font-size="12" fill="#f0e6cc">1. Before any word was written, the</text><text x="107.04234" y="282" font-size="12" fill="#f0e6cc">world belonged to the clans.</text><text x="107.04234" y="298" font-size="11" fill="#8f8a98">1.5s</text><rect x="229.6417" y="312" width="3" height="54" fill="#d8b878"/><text x="235.6417" y="328" font-size="12" fill="#f0e6cc">2. No hand raised a wall. No</text><text x="235.6417" y="344" font-size="12" fill="#f0e6cc">fire burned but the lightning's.</text><text x="235.6417" y="360" font-size="11" fill="#8f8a98">6.2s</text><rect x="350.03256" y="250" width="3" height="54" fill="#d8b878"/><text x="356.03256" y="266" font-size="12" fill="#f0e6cc">3. From the frozen long-ago to the endless</text><text x="356.03256" y="282" font-size="12" fill="#f0e6cc">dunes, the great cats kept it.</text><text x="356.03256" y="298" font-size="11" fill="#8f8a98">10.6s</text><rect x="495.04886" y="312" width="3" height="54" fill="#d8b878"/><text x="501.04886" y="328" font-size="12" fill="#f0e6cc">4. Lions of the golden plains. Tigers of</text><text x="501.04886" y="344" font-size="12" fill="#f0e6cc">the dusk. Sabre-fangs of the elder dawn.</text><text x="501.04886" y="360" font-size="11" fill="#8f8a98">15.9s</text><rect x="656.48206" y="250" width="3" height="54" fill="#d8b878"/><text x="662.48206" y="266" font-size="12" fill="#f0e6cc">5. Their bones are ice and sand</text><text x="662.48206" y="282" font-size="12" fill="#f0e6cc">now. Their stories never were.</text><text x="662.48206" y="298" font-size="11" fill="#8f8a98">21.8s</text><rect x="776.8729" y="312" width="3" height="54" fill="#d8b878"/><text x="782.8729" y="328" font-size="12" fill="#f0e6cc">6. When a thing cannot be divided, and must not</text><text x="782.8729" y="344" font-size="12" fill="#f0e6cc">be warred over, the clans hold the Gathering.</text><text x="782.8729" y="360" font-size="11" fill="#8f8a98">26.2s</text><rect x="957.4593" y="250" width="3" height="54" fill="#d8b878"/><text x="963.4593" y="266" font-size="12" fill="#f0e6cc">7. They split by lot -- Frostfang and</text><text x="963.4593" y="282" font-size="12" fill="#f0e6cc">Emberclaw -- and call their ancestors home.</text><text x="963.4593" y="298" font-size="11" fill="#8f8a98">32.8s</text><rect x="1116.1563" y="312" width="3" height="54" fill="#d8b878"/><text x="1122.1563" y="328" font-size="12" fill="#f0e6cc">8. Beasts of power. Beasts of</text><text x="1122.1563" y="344" font-size="12" fill="#f0e6cc">glory. Let the ages meet.</text><text x="1122.1563" y="360" font-size="11" fill="#8f8a98">38.6s</text><polygon points="53,218 67,218 60,230" fill="#e8a040"/><text x="60" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">1</text><polygon points="1256.9088,218 1270.9088,218 1263.9088,230" fill="#e8a040"/><text x="1263.9088" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">2</text><polygon points="1507.2671,218 1521.2671,218 1514.2671,230" fill="#e8a040"/><text x="1514.2671" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">3</text><polygon points="1556.5177,218 1570.5177,218 1563.5177,230" fill="#e8a040"/><text x="1563.5177" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">4</text><polygon points="1596.1921,218 1610.1921,218 1603.1921,230" fill="#e8a040"/><text x="1603.1921" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">5</text><polygon points="1697.4299,218 1711.4299,218 1704.4299,230" fill="#e8a040"/><text x="1704.4299" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">6</text><polygon points="1733,218 1747,218 1740,230" fill="#e8a040"/><text x="1740" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">7</text><text x="60" y="398" font-size="13" fill="#8f8a98">the match intro, zoomed -- every match plays this (music/intro.opus): times as (in the full intro / in the short one)</text><rect x="60" y="410" width="386.2069" height="56" fill="#3c4a5e" stroke="#141319" stroke-width="2"/><text x="66" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">PAN</text><text x="66" y="452" font-size="12" fill="#e0d8c8">44.0s / 0.0s</text><rect x="446.2069" y="410" width="154.4826" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="452.2069" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">TOP</text><text x="452.2069" y="452" font-size="12" fill="#e0d8c8">48.0s / 4.0s</text><rect x="600.6895" y="410" width="154.4826" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="606.6895" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">MID</text><text x="606.6895" y="452" font-size="12" fill="#e0d8c8">49.6s / 5.6s</text><rect x="755.1721" y="410" width="154.4826" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="761.1721" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">BOT</text><text x="761.1721" y="452" font-size="12" fill="#e0d8c8">51.2s / 7.2s</text><rect x="909.6547" y="410" width="173.79303" height="56" fill="#35607f" stroke="#141319" stroke-width="2"/><text x="915.6547" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">FROSTFANG</text><text x="915.6547" y="452" font-size="12" fill="#e0d8c8">52.8s / 8.8s</text><rect x="1083.4478" y="410" width="173.79309" height="56" fill="#8a4028" stroke="#141319" stroke-width="2"/><text x="1089.4478" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">EMBERCLAW</text><text x="1089.4478" y="452" font-size="12" fill="#e0d8c8">54.6s / 10.6s</text><rect x="1257.2408" y="410" width="347.58594" height="56" fill="#6e5a24" stroke="#141319" stroke-width="2"/><text x="1263.2408" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">VERSUS</text><text x="1263.2408" y="452" font-size="12" fill="#e0d8c8">56.4s / 12.4s</text><rect x="1604.8268" y="410" width="135.17273" height="56" fill="#3a3844" stroke="#141319" stroke-width="2"/><text x="1610.8268" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">SETTLE</text><text x="1610.8268" y="452" font-size="12" fill="#e0d8c8">60.0s / 16.0s</text><polygon points="53,468 67,468 60,480" fill="#e8a040"/><text x="60" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">2</text><polygon points="936.44806,468 950.44806,468 943.44806,480" fill="#e8a040"/><text x="943.44806" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">3</text><polygon points="1110.2411,468 1124.2411,468 1117.2411,480" fill="#e8a040"/><text x="1117.2411" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">4</text><polygon points="1250.2412,468 1264.2412,468 1257.2412,480" fill="#e8a040"/><text x="1257.2412" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">5</text><polygon points="1607.4827,468 1621.4827,468 1614.4827,480" fill="#e8a040"/><text x="1614.4827" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">6</text><polygon points="1733.0001,468 1747.0001,468 1740.0001,480" fill="#e8a040"/><text x="1740.0001" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">7</text><text x="60" y="510" font-size="22" font-weight="bold" fill="#fbf6ea">Sync points -- land a hit here</text><text x="60" y="540" font-size="15" fill="#e8a040" font-weight="bold">1</text><text x="90" y="540" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace">  0.0 s     --  </text><text x="310" y="540" font-size="15" fill="#d8d2c4">score begins (music/intro_full)</text><text x="60" y="564" font-size="15" fill="#e8a040" font-weight="bold">2</text><text x="90" y="564" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 44.0 s    0.0 s</text><text x="310" y="564" font-size="15" fill="#d8d2c4">the world comes into view: the pan -- the short intro (music/intro) starts here</text><text x="60" y="588" font-size="15" fill="#e8a040" font-weight="bold">3</text><text x="90" y="588" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 53.1 s    9.1 s</text><text x="310" y="588" font-size="15" fill="#d8d2c4">FIRST CATS APPEAR in starry mist (Frostfang)</text><text x="60" y="612" font-size="15" fill="#e8a040" font-weight="bold">4</text><text x="90" y="612" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 54.9 s   10.9 s</text><text x="310" y="612" font-size="15" fill="#d8d2c4">Emberclaw appear</text><text x="60" y="636" font-size="15" fill="#e8a040" font-weight="bold">5</text><text x="90" y="636" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 56.4 s   12.4 s</text><text x="310" y="636" font-size="15" fill="#d8d2c4">the VS card slams in</text><text x="60" y="660" font-size="15" fill="#e8a040" font-weight="bold">6</text><text x="90" y="660" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 60.1 s   16.1 s</text><text x="310" y="660" font-size="15" fill="#d8d2c4">'BEGIN' -- the camera descends to the player</text><text x="60" y="684" font-size="15" fill="#e8a040" font-weight="bold">7</text><text x="90" y="684" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 61.4 s   17.4 s</text><text x="310" y="684" font-size="15" fill="#d8d2c4">PLAY: the announcer calls 'The clans are loosed!'; the map's own music loop takes over</text><text x="90" y="714" font-size="12" fill="#8f8a98">columns: time in music/intro_full, time in music/intro</text><text x="60" y="758" font-size="22" font-weight="bold" fill="#fbf6ea">Direction</text><text x="60" y="792" font-size="15" font-weight="bold" fill="#e8c888">PROLOGUE</text><text x="210" y="792" font-size="15" fill="#d8d2c4">Nature first: wind over ice, grass, rain, far thunder. Wood and bone enter under the narrator -- bone flute (Oldroar), kora (Goldenmane), bansuri</text><text x="210" y="813" font-size="15" fill="#d8d2c4">(Duskstripe), guqin (Stillsmoke) -- a world of clans, one at a time. Build slowly; hold the brass back until line 7 (Frostfang, Emberclaw) and let it</text><text x="210" y="834" font-size="15" fill="#d8d2c4">rise under line 8.</text><text x="60" y="868" font-size="15" font-weight="bold" fill="#e8c888">PAN + LANES</text><text x="210" y="868" font-size="15" fill="#d8d2c4">The brass arrives in full as the world comes into view. The three lane runs are a driving pulse: frame drums and log drums, a bar and a half each.</text><text x="60" y="902" font-size="15" font-weight="bold" fill="#e8c888">FROSTFANG</text><text x="210" y="902" font-size="15" fill="#d8d2c4">The cold half: hardanger fiddle and nyckelharpa, kulning, long mountain horns, singing bowls. The first hit lands with the first starry burst.</text><text x="60" y="936" font-size="15" font-weight="bold" fill="#e8c888">EMBERCLAW</text><text x="210" y="936" font-size="15" fill="#d8d2c4">The warm half answers: kora and balafon, ney and darbuka, talking drum, udu. Hot wind, cicadas.</text><text x="60" y="970" font-size="15" font-weight="bold" fill="#e8c888">VERSUS</text><text x="210" y="970" font-size="15" fill="#d8d2c4">Both halves at once under full brass: the Gathering. The peak of the piece.</text><text x="60" y="1004" font-size="15" font-weight="bold" fill="#e8c888">SETTLE</text><text x="210" y="1004" font-size="15" fill="#d8d2c4">Resolve and hand over: a last chord ringing into the match, where the map's own loop begins.</text><text x="60" y="1354" font-size="14" fill="#8f8a98">Export: 48 kHz, stereo or mono, Opus. Loops for each map: music/jungle.opus, music/pass.opus (they start when play begins). See dev/LORE.md for each clan's instruments.</text></svg>