<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#141319"/><text x="60" y="56" font-size="34" font-weight="bold" fill="#fbf6ea">Intro score -- cue sheet</text><text x="60" y="90" font-size="18" fill="#cfc7b6">Full intro (first match of a session): 66.0 s -- file music/intro_full.opus.   Short intro (every later match): 22.0 s, the part after the prologue -- file music/intro.opus.</text><text x="60" y="116" font-size="16" fill="#9e98a8">Times in seconds from the intro's start. Bar grid at 90 BPM, 4/4 (2.67 s a bar). The camera moves between sections over ~1 s (0.9-1.6 s), not cuts.</text><line x1="60" y1="150" x2="60" y2="370" stroke="#3a3843" stroke-width="1"/><text x="63" y="382" font-size="11" fill="#5e5a68">bar 1</text><line x1="127.878784" y1="150" x2="127.878784" y2="370" stroke="#24232b" stroke-width="1"/><line x1="195.75757" y1="150" x2="195.75757" y2="370" stroke="#24232b" stroke-width="1"/><line x1="263.63635" y1="150" x2="263.63635" y2="370" stroke="#24232b" stroke-width="1"/><line x1="331.51514" y1="150" x2="331.51514" y2="370" stroke="#3a3843" stroke-width="1"/><text x="334.51514" y="382" font-size="11" fill="#5e5a68">bar 5</text><line x1="399.39398" y1="150" x2="399.39398" y2="370" stroke="#24232b" stroke-width="1"/><line x1="467.27274" y1="150" x2="467.27274" y2="370" stroke="#24232b" stroke-width="1"/><line x1="535.1515" y1="150" x2="535.1515" y2="370" stroke="#24232b" stroke-width="1"/><line x1="603.0303" y1="150" x2="603.0303" y2="370" stroke="#3a3843" stroke-width="1"/><text x="606.0303" y="382" font-size="11" fill="#5e5a68">bar 9</text><line x1="670.90906" y1="150" x2="670.90906" y2="370" stroke="#24232b" stroke-width="1"/><line x1="738.78784" y1="150" x2="738.78784" y2="370" stroke="#24232b" stroke-width="1"/><line x1="806.6666" y1="150" x2="806.6666" y2="370" stroke="#24232b" stroke-width="1"/><line x1="874.54535" y1="150" x2="874.54535" y2="370" stroke="#3a3843" stroke-width="1"/><text x="877.54535" y="382" font-size="11" fill="#5e5a68">bar 13</text><line x1="942.4242" y1="150" x2="942.4242" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1010.303" y1="150" x2="1010.303" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1078.1819" y1="150" x2="1078.1819" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1146.0605" y1="150" x2="1146.0605" y2="370" stroke="#3a3843" stroke-width="1"/><text x="1149.0605" y="382" font-size="11" fill="#5e5a68">bar 17</text><line x1="1213.9395" y1="150" x2="1213.9395" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1281.8184" y1="150" x2="1281.8184" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1349.6971" y1="150" x2="1349.6971" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1417.5759" y1="150" x2="1417.5759" y2="370" stroke="#3a3843" stroke-width="1"/><text x="1420.5759" y="382" font-size="11" fill="#5e5a68">bar 21</text><line x1="1485.4548" y1="150" x2="1485.4548" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1553.3336" y1="150" x2="1553.3336" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1621.2124" y1="150" x2="1621.2124" y2="370" stroke="#24232b" stroke-width="1"/><line x1="1689.0912" y1="150" x2="1689.0912" y2="370" stroke="#3a3843" stroke-width="1"/><text x="1692.0912" y="382" font-size="11" fill="#5e5a68">bar 25</text><rect x="60" y="160" width="1120" height="56" fill="#5a4a36" stroke="#141319" stroke-width="2"/><text x="65" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">PROLOGUE</text><text x="65" y="202" font-size="12" fill="#e0d8c8">0.0s</text><rect x="1180" y="160" width="101.81824" height="56" fill="#3c4a5e" stroke="#141319" stroke-width="2"/><text x="1185" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">PAN</text><text x="1185" y="202" font-size="12" fill="#e0d8c8">44.0s</text><rect x="1281.8182" y="160" width="61.09082" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="1286.8182" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">TOP</text><text x="1286.8182" y="202" font-size="12" fill="#e0d8c8">48.0s</text><rect x="1342.909" y="160" width="61.091064" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="1347.909" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">MID</text><text x="1347.909" y="202" font-size="12" fill="#e0d8c8">50.4s</text><rect x="1404.0001" y="160" width="61.090942" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="1409.0001" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">BOT</text><text x="1409.0001" y="202" font-size="12" fill="#e0d8c8">52.8s</text><rect x="1465.0911" y="160" width="66.18176" height="56" fill="#35607f" stroke="#141319" stroke-width="2"/><text x="1470.0911" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">FROSTFANG</text><text x="1470.0911" y="202" font-size="12" fill="#e0d8c8">55.2s</text><rect x="1531.2728" y="160" width="66.18176" height="56" fill="#8a4028" stroke="#141319" stroke-width="2"/><text x="1536.2728" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">EMBERCLAW</text><text x="1536.2728" y="202" font-size="12" fill="#e0d8c8">57.8s</text><rect x="1597.4546" y="160" width="91.63635" height="56" fill="#6e5a24" stroke="#141319" stroke-width="2"/><text x="1602.4546" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">VERSUS</text><text x="1602.4546" y="202" font-size="12" fill="#e0d8c8">60.4s</text><rect x="1689.091" y="160" width="50.909058" height="56" fill="#3a3844" stroke="#141319" stroke-width="2"/><text x="1694.091" y="182" font-size="14" font-weight="bold" fill="#fbf6ea">SETTLE</text><text x="1694.091" y="202" font-size="12" fill="#e0d8c8">64.0s</text><text x="60" y="144" font-size="13" fill="#8f8a98">camera</text><text x="60" y="238" font-size="13" fill="#8f8a98">narrator (narrator/prologue1..8.opus) -- the score ducks under it</text><rect x="98.18182" y="250" width="3" height="54" fill="#d8b878"/><text x="104.18182" y="266" font-size="12" fill="#f0e6cc">1. Before any word was written, the</text><text x="104.18182" y="282" font-size="12" fill="#f0e6cc">world belonged to the clans.</text><text x="104.18182" y="298" font-size="11" fill="#8f8a98">1.5s</text><rect x="217.81818" y="312" width="3" height="54" fill="#d8b878"/><text x="223.81818" y="328" font-size="12" fill="#f0e6cc">2. No hand raised a wall. No</text><text x="223.81818" y="344" font-size="12" fill="#f0e6cc">fire burned but the lightning's.</text><text x="223.81818" y="360" font-size="11" fill="#8f8a98">6.2s</text><rect x="329.81818" y="250" width="3" height="54" fill="#d8b878"/><text x="335.81818" y="266" font-size="12" fill="#f0e6cc">3. From the frozen long-ago to the endless</text><text x="335.81818" y="282" font-size="12" fill="#f0e6cc">dunes, the great cats kept it.</text><text x="335.81818" y="298" font-size="11" fill="#8f8a98">10.6s</text><rect x="464.72726" y="312" width="3" height="54" fill="#d8b878"/><text x="470.72726" y="328" font-size="12" fill="#f0e6cc">4. Lions of the golden plains. Tigers of</text><text x="470.72726" y="344" font-size="12" fill="#f0e6cc">the dusk. Sabre-fangs of the elder dawn.</text><text x="470.72726" y="360" font-size="11" fill="#8f8a98">15.9s</text><rect x="614.9091" y="250" width="3" height="54" fill="#d8b878"/><text x="620.9091" y="266" font-size="12" fill="#f0e6cc">5. Their bones are ice and sand</text><text x="620.9091" y="282" font-size="12" fill="#f0e6cc">now. Their stories never were.</text><text x="620.9091" y="298" font-size="11" fill="#8f8a98">21.8s</text><rect x="726.9091" y="312" width="3" height="54" fill="#d8b878"/><text x="732.9091" y="328" font-size="12" fill="#f0e6cc">6. When a thing cannot be divided, and must not</text><text x="732.9091" y="344" font-size="12" fill="#f0e6cc">be warred over, the clans hold the Gathering.</text><text x="732.9091" y="360" font-size="11" fill="#8f8a98">26.2s</text><rect x="894.9091" y="250" width="3" height="54" fill="#d8b878"/><text x="900.9091" y="266" font-size="12" fill="#f0e6cc">7. They split by lot -- Frostfang and</text><text x="900.9091" y="282" font-size="12" fill="#f0e6cc">Emberclaw -- and call their ancestors home.</text><text x="900.9091" y="298" font-size="11" fill="#8f8a98">32.8s</text><rect x="1042.5454" y="312" width="3" height="54" fill="#d8b878"/><text x="1048.5454" y="328" font-size="12" fill="#f0e6cc">8. Beasts of power. Beasts of</text><text x="1048.5454" y="344" font-size="12" fill="#f0e6cc">glory. Let the ages meet.</text><text x="1048.5454" y="360" font-size="11" fill="#8f8a98">38.6s</text><polygon points="53,218 67,218 60,230" fill="#e8a040"/><text x="60" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">1</text><polygon points="1173,218 1187,218 1180,230" fill="#e8a040"/><text x="1180" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">2</text><polygon points="1467,218 1481,218 1474,230" fill="#e8a040"/><text x="1474" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">3</text><polygon points="1533.1818,218 1547.1818,218 1540.1818,230" fill="#e8a040"/><text x="1540.1818" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">4</text><polygon points="1590.4546,218 1604.4546,218 1597.4546,230" fill="#e8a040"/><text x="1597.4546" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">5</text><polygon points="1684.6364,218 1698.6364,218 1691.6364,230" fill="#e8a040"/><text x="1691.6364" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">6</text><polygon points="1733,218 1747,218 1740,230" fill="#e8a040"/><text x="1740" y="215" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">7</text><text x="60" y="398" font-size="13" fill="#8f8a98">the match intro, zoomed -- every match plays this (music/intro.opus): times as (in the full intro / in the short one)</text><rect x="60" y="410" width="305.45453" height="56" fill="#3c4a5e" stroke="#141319" stroke-width="2"/><text x="66" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">PAN</text><text x="66" y="452" font-size="12" fill="#e0d8c8">44.0s / 0.0s</text><rect x="365.45453" y="410" width="183.27283" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="371.45453" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">TOP</text><text x="371.45453" y="452" font-size="12" fill="#e0d8c8">48.0s / 4.0s</text><rect x="548.72736" y="410" width="183.27283" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="554.72736" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">MID</text><text x="554.72736" y="452" font-size="12" fill="#e0d8c8">50.4s / 6.4s</text><rect x="732.0002" y="410" width="183.27283" height="56" fill="#3f5a4a" stroke="#141319" stroke-width="2"/><text x="738.0002" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">BOT</text><text x="738.0002" y="452" font-size="12" fill="#e0d8c8">52.8s / 8.8s</text><rect x="915.273" y="410" width="198.54535" height="56" fill="#35607f" stroke="#141319" stroke-width="2"/><text x="921.273" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">FROSTFANG</text><text x="921.273" y="452" font-size="12" fill="#e0d8c8">55.2s / 11.2s</text><rect x="1113.8184" y="410" width="198.54529" height="56" fill="#8a4028" stroke="#141319" stroke-width="2"/><text x="1119.8184" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">EMBERCLAW</text><text x="1119.8184" y="452" font-size="12" fill="#e0d8c8">57.8s / 13.8s</text><rect x="1312.3636" y="410" width="274.90894" height="56" fill="#6e5a24" stroke="#141319" stroke-width="2"/><text x="1318.3636" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">VERSUS</text><text x="1318.3636" y="452" font-size="12" fill="#e0d8c8">60.4s / 16.4s</text><rect x="1587.2726" y="410" width="152.7273" height="56" fill="#3a3844" stroke="#141319" stroke-width="2"/><text x="1593.2726" y="432" font-size="14" font-weight="bold" fill="#fbf6ea">SETTLE</text><text x="1593.2726" y="452" font-size="12" fill="#e0d8c8">64.0s / 20.0s</text><polygon points="53,468 67,468 60,480" fill="#e8a040"/><text x="60" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">2</text><polygon points="934.9998,468 948.9998,468 941.9998,480" fill="#e8a040"/><text x="941.9998" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">3</text><polygon points="1133.5452,468 1147.5452,468 1140.5452,480" fill="#e8a040"/><text x="1140.5452" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">4</text><polygon points="1305.3636,468 1319.3636,468 1312.3636,480" fill="#e8a040"/><text x="1312.3636" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">5</text><polygon points="1587.9088,468 1601.9088,468 1594.9088,480" fill="#e8a040"/><text x="1594.9088" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">6</text><polygon points="1732.9999,468 1746.9999,468 1739.9999,480" fill="#e8a040"/><text x="1739.9999" y="465" font-size="11" font-weight="bold" fill="#e8a040" text-anchor="middle">7</text><text x="60" y="510" font-size="22" font-weight="bold" fill="#fbf6ea">Sync points -- land a hit here</text><text x="60" y="540" font-size="15" fill="#e8a040" font-weight="bold">1</text><text x="90" y="540" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace">  0.0 s     --  </text><text x="310" y="540" font-size="15" fill="#d8d2c4">score begins (music/intro_full)</text><text x="60" y="564" font-size="15" fill="#e8a040" font-weight="bold">2</text><text x="90" y="564" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 44.0 s    0.0 s</text><text x="310" y="564" font-size="15" fill="#d8d2c4">the world comes into view: the pan -- the short intro (music/intro) starts here</text><text x="60" y="588" font-size="15" fill="#e8a040" font-weight="bold">3</text><text x="90" y="588" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 55.5 s   11.5 s</text><text x="310" y="588" font-size="15" fill="#d8d2c4">FIRST CATS APPEAR in starry mist (Frostfang)</text><text x="60" y="612" font-size="15" fill="#e8a040" font-weight="bold">4</text><text x="90" y="612" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 58.1 s   14.1 s</text><text x="310" y="612" font-size="15" fill="#d8d2c4">Emberclaw appear</text><text x="60" y="636" font-size="15" fill="#e8a040" font-weight="bold">5</text><text x="90" y="636" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 60.4 s   16.4 s</text><text x="310" y="636" font-size="15" fill="#d8d2c4">the VS card slams in</text><text x="60" y="660" font-size="15" fill="#e8a040" font-weight="bold">6</text><text x="90" y="660" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 64.1 s   20.1 s</text><text x="310" y="660" font-size="15" fill="#d8d2c4">'BEGIN' -- the camera descends to the player</text><text x="60" y="684" font-size="15" fill="#e8a040" font-weight="bold">7</text><text x="90" y="684" font-size="15" fill="#f3d9a8" font-family="DejaVu Sans Mono, monospace"> 66.0 s   22.0 s</text><text x="310" y="684" font-size="15" fill="#d8d2c4">PLAY: the announcer calls 'The clans are loosed!'; the map's own music loop takes over</text><text x="90" y="714" font-size="12" fill="#8f8a98">columns: time in music/intro_full, time in music/intro</text><text x="60" y="758" font-size="22" font-weight="bold" fill="#fbf6ea">Direction</text><text x="60" y="792" font-size="15" font-weight="bold" fill="#e8c888">PROLOGUE</text><text x="210" y="792" font-size="15" fill="#d8d2c4">Nature first: wind over ice, grass, rain, far thunder. Wood and bone enter under the narrator -- bone flute (Oldroar), kora (Goldenmane), bansuri</text><text x="210" y="813" font-size="15" fill="#d8d2c4">(Duskstripe), guqin (Stillsmoke) -- a world of clans, one at a time. Build slowly; hold the brass back until line 7 (Frostfang, Emberclaw) and let it</text><text x="210" y="834" font-size="15" fill="#d8d2c4">rise under line 8.</text><text x="60" y="868" font-size="15" font-weight="bold" fill="#e8c888">PAN + LANES</text><text x="210" y="868" font-size="15" fill="#d8d2c4">The brass arrives in full as the world comes into view. The three lane runs are a driving pulse: frame drums and log drums, a bar and a half each.</text><text x="60" y="902" font-size="15" font-weight="bold" fill="#e8c888">FROSTFANG</text><text x="210" y="902" font-size="15" fill="#d8d2c4">The cold half: hardanger fiddle and nyckelharpa, kulning, long mountain horns, singing bowls. The first hit lands with the first starry burst.</text><text x="60" y="936" font-size="15" font-weight="bold" fill="#e8c888">EMBERCLAW</text><text x="210" y="936" font-size="15" fill="#d8d2c4">The warm half answers: kora and balafon, ney and darbuka, talking drum, udu. Hot wind, cicadas.</text><text x="60" y="970" font-size="15" font-weight="bold" fill="#e8c888">VERSUS</text><text x="210" y="970" font-size="15" fill="#d8d2c4">Both halves at once under full brass: the Gathering. The peak of the piece.</text><text x="60" y="1004" font-size="15" font-weight="bold" fill="#e8c888">SETTLE</text><text x="210" y="1004" font-size="15" fill="#d8d2c4">Resolve and hand over: a last chord ringing into the match, where the map's own loop begins.</text><text x="60" y="1354" font-size="14" fill="#8f8a98">Export: 48 kHz, stereo or mono, Opus. Loops for each map: music/jungle.opus, music/pass.opus (they start when play begins). See dev/LORE.md for each clan's instruments.</text></svg>