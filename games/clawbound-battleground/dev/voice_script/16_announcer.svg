<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2764" viewBox="0 0 1000 2764" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f48"/><stop offset="1" stop-color="#0d0f17"/></linearGradient></defs><rect width="1000" height="2764" fill="#141319"/><rect width="1000" height="302" fill="url(#hd)"/><rect y="296" width="1000" height="6" fill="#f2c65b"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">The Announcer</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the voice of the battleground</text><text x="50" y="176" font-size="22" font-style="italic" fill="#f2c65b">Frostfang and Emberclaw, and everything between them.</text><text x="50" y="218" font-size="19" fill="#d8d2c4">The voice of the battleground: big, warm, theatrical, like a sports caller who</text><text x="50" y="244" font-size="19" fill="#d8d2c4">loves these cats. Leave half a second of silence before and after every line.</text><rect x="0" y="308" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="360" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="352" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="344" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="336" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="328" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="356" font-size="38" font-weight="bold" fill="#fbf6ea">The clans are loosed!</text><text x="140" y="386" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/match_start.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">the opening bell</tspan></text><text x="140" y="408" font-size="14" fill="#77727f">plays when: the intro ends and play begins</text><rect x="50" y="472" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="464" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="456" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="448" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="440" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="468" font-size="38" font-weight="bold" fill="#fbf6ea">First blood!</text><text x="140" y="498" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/first_blood.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">electric</tspan></text><text x="140" y="520" font-size="14" fill="#77727f">plays when: the first ancestor falls</text><rect x="0" y="532" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="584" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="576" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="568" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="560" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="552" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="580" font-size="38" font-weight="bold" fill="#fbf6ea">An ancestor has fallen!</text><text x="140" y="610" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/kill.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">dramatic</tspan></text><text x="140" y="632" font-size="14" fill="#77727f">plays when: any other kill (when nothing bigger applies)</text><rect x="50" y="696" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="688" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="680" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="672" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="664" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="692" font-size="38" font-weight="bold" fill="#fbf6ea">Double kill!</text><text x="140" y="722" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/double_kill.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">rising</tspan></text><text x="140" y="744" font-size="14" fill="#77727f">plays when: two kills in quick succession</text><rect x="0" y="756" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="808" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="800" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="792" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="784" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="776" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="804" font-size="38" font-weight="bold" fill="#fbf6ea">Triple kill!</text><text x="140" y="834" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/triple_kill.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">higher still</tspan></text><text x="140" y="856" font-size="14" fill="#77727f">plays when: three in quick succession</text><rect x="50" y="920" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="912" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="904" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="896" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="888" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="916" font-size="38" font-weight="bold" fill="#fbf6ea">RAMPAGE!</text><text x="140" y="946" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/rampage.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">lose control a little</tspan></text><text x="140" y="968" font-size="14" fill="#77727f">plays when: four or more in quick succession</text><rect x="0" y="980" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1032" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1024" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1016" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1008" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1000" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1028" font-size="38" font-weight="bold" fill="#fbf6ea">On the prowl!</text><text x="140" y="1058" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/spree.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">impressed</tspan></text><text x="140" y="1080" font-size="14" fill="#77727f">plays when: three kills without dying</text><rect x="50" y="1144" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1136" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1128" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1120" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1112" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="1140" font-size="38" font-weight="bold" fill="#fbf6ea">Unstoppable!</text><text x="140" y="1170" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/unstoppable.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">awed</tspan></text><text x="140" y="1192" font-size="14" fill="#77727f">plays when: six kills without dying</text><rect x="0" y="1204" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1256" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1248" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1240" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1232" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1224" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1252" font-size="38" font-weight="bold" fill="#fbf6ea">Shut down!</text><text x="140" y="1282" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/shutdown.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a hard stop</tspan></text><text x="140" y="1304" font-size="14" fill="#77727f">plays when: a cat on a spree is taken down</text><rect x="50" y="1368" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1360" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1352" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1344" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1336" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="1364" font-size="34" font-weight="bold" fill="#fbf6ea">Ace! The whole clan has fallen!</text><text x="140" y="1394" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/ace.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">the crowd goes wild</tspan></text><text x="140" y="1416" font-size="14" fill="#77727f">plays when: every cat of one team is dead at once</text><rect x="0" y="1428" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1480" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1472" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1464" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1456" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1448" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1476" font-size="38" font-weight="bold" fill="#fbf6ea">A Frostfang tower falls!</text><text x="140" y="1506" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/tower_down_frostfang.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">news of the front</tspan></text><text x="140" y="1528" font-size="14" fill="#77727f">plays when: a Frostfang (blue) tower is destroyed</text><rect x="50" y="1592" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1584" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1576" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1568" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1560" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1588" font-size="38" font-weight="bold" fill="#fbf6ea">An Emberclaw tower falls!</text><text x="140" y="1618" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/tower_down_emberclaw.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">news of the front</tspan></text><text x="140" y="1640" font-size="14" fill="#77727f">plays when: an Emberclaw (red) tower is destroyed</text><rect x="0" y="1652" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1704" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1696" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1688" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1680" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1672" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="1700" font-size="31" font-weight="bold" fill="#fbf6ea">The Frostfang Elder stands unshielded!</text><text x="140" y="1730" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/titan_frostfang.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">urgent</tspan></text><text x="140" y="1752" font-size="14" fill="#77727f">plays when: the blue Elder can be struck</text><rect x="50" y="1816" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1808" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1800" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1792" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="1784" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="1812" font-size="31" font-weight="bold" fill="#fbf6ea">The Emberclaw Elder stands unshielded!</text><text x="140" y="1842" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/titan_emberclaw.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">urgent</tspan></text><text x="140" y="1864" font-size="14" fill="#77727f">plays when: the red Elder can be struck</text><rect x="0" y="1876" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1928" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="1920" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="1912" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="1904" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1896" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1924" font-size="34" font-weight="bold" fill="#fbf6ea">Something stirs in the deep...</text><text x="140" y="1954" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/boss_spawn.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">hushed suspense</tspan></text><text x="140" y="1976" font-size="14" fill="#77727f">plays when: a great beast appears</text><rect x="50" y="2040" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="2032" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="2024" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="2016" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="2008" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="2036" font-size="38" font-weight="bold" fill="#fbf6ea">The great beast is slain!</text><text x="140" y="2066" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/boss_down.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">triumphant</tspan></text><text x="140" y="2088" font-size="14" fill="#77727f">plays when: a great beast is killed</text><rect x="0" y="2100" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="2152" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="2144" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="2136" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="2128" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="2120" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="2148" font-size="31" font-weight="bold" fill="#fbf6ea">The land turns against you -- take cover!</text><text x="140" y="2178" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/disaster.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">alarm</tspan></text><text x="140" y="2200" font-size="14" fill="#77727f">plays when: a disaster is about to strike</text><rect x="50" y="2264" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="2256" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="2248" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="2240" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="2232" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="2260" font-size="38" font-weight="bold" fill="#fbf6ea">Victory!</text><text x="140" y="2290" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/victory.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">pure joy</tspan></text><text x="140" y="2312" font-size="14" fill="#77727f">plays when: your team wins</text><rect x="0" y="2324" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="2376" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="2368" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="2360" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="2352" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="2344" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="2372" font-size="38" font-weight="bold" fill="#fbf6ea">Defeat.</text><text x="140" y="2402" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/defeat.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">sombre, respectful</tspan></text><text x="140" y="2424" font-size="14" fill="#77727f">plays when: your team loses</text><rect x="50" y="2488" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="2480" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="2472" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="2464" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="2456" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="2484" font-size="38" font-weight="bold" fill="#fbf6ea">Frostfang are victorious!</text><text x="140" y="2514" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/frostfang_win.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">the big finish</tspan></text><text x="140" y="2536" font-size="14" fill="#77727f">plays when: Frostfang win (spectating)</text><rect x="0" y="2548" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="2600" width="11" height="10" rx="2" fill="#f2c65b"/><rect x="65" y="2592" width="11" height="18" rx="2" fill="#f2c65b"/><rect x="80" y="2584" width="11" height="26" rx="2" fill="#f2c65b"/><rect x="95" y="2576" width="11" height="34" rx="2" fill="#f2c65b"/><rect x="110" y="2568" width="11" height="42" rx="2" fill="#f2c65b"/><text x="138" y="2596" font-size="38" font-weight="bold" fill="#fbf6ea">Emberclaw are victorious!</text><text x="140" y="2626" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#dab352">announcer/emberclaw_win.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">the big finish</tspan></text><text x="140" y="2648" font-size="14" fill="#77727f">plays when: Emberclaw win (spectating)</text><rect y="2700" width="1000" height="64" fill="#0f0e13"/><text x="50" y="2728" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="2750" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>