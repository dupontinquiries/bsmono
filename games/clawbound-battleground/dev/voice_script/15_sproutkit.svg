<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1476" viewBox="0 0 1000 1476" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#857051"/><stop offset="1" stop-color="#2b241a"/></linearGradient></defs><rect width="1000" height="1476" fill="#141319"/><rect width="1000" height="358" fill="url(#hd)"/><rect y="352" width="1000" height="6" fill="#8cea6b"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Sproutkit</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the ever-young, kit of the first spring, god of every life that is still growing</text><text x="50" y="176" font-size="22" font-style="italic" fill="#8cea6b">“Everything that lives was small once. Everything small is still growing.”</text><text x="50" y="218" font-size="18" font-weight="bold" fill="#f3ead4">a kitten -- of no one clan, and so of every clan · every spring · wherever something is being born · he/him</text><text x="50" y="248" font-size="19" fill="#d8d2c4">A kitten's voice: bright, high, fearless and giggly -- a baby god who thinks</text><text x="50" y="274" font-size="19" fill="#d8d2c4">the whole war is a game. Laughter bubbles up between the words. Never</text><text x="50" y="300" font-size="19" fill="#d8d2c4">menacing, even on a kill.</text><rect x="0" y="364" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="416" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="408" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="400" width="11" height="26" rx="2" fill="#8cea6b"/><rect x="95" y="392" width="11" height="34" rx="2" fill="#8cea6b"/><rect x="110" y="384" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="412" font-size="38" font-weight="bold" fill="#fbf6ea">Let's play!</text><text x="140" y="442" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">bouncing, delighted</tspan></text><text x="140" y="464" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="528" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="520" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="512" width="11" height="26" rx="2" fill="#8cea6b"/><rect x="95" y="504" width="11" height="34" rx="2" fill="#8cea6b"/><rect x="110" y="496" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="524" font-size="38" font-weight="bold" fill="#fbf6ea">Everybody, go!</text><text x="140" y="554" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">calling the litter out, a bounce on 'go'</tspan></text><text x="140" y="576" font-size="14" fill="#77727f">plays when: winds up Litter</text><rect x="0" y="588" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="640" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="632" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="624" width="11" height="26" rx="2" fill="#8cea6b"/><rect x="95" y="616" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="608" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="636" font-size="38" font-weight="bold" fill="#fbf6ea">Hee hee hee!</text><text x="140" y="666" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a giggle fit that won't stop</tspan></text><text x="140" y="688" font-size="14" fill="#77727f">plays when: winds up Giggle Fit</text><rect x="50" y="752" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="744" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="736" width="11" height="26" rx="2" fill="#8cea6b"/><rect x="95" y="728" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="720" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="748" font-size="38" font-weight="bold" fill="#fbf6ea">Grow, grow!</text><text x="140" y="778" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">soft, sing-song</tspan></text><text x="140" y="800" font-size="14" fill="#77727f">plays when: winds up First Spring</text><rect x="0" y="812" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="864" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="856" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="848" width="11" height="26" rx="2" fill="#8cea6b"/><rect x="95" y="840" width="11" height="34" rx="2" fill="#8cea6b"/><rect x="110" y="832" width="11" height="42" rx="2" fill="#8cea6b"/><text x="138" y="860" font-size="38" font-weight="bold" fill="#fbf6ea">DANCE PARTY!</text><text x="140" y="890" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a squeal of pure joy</tspan></text><text x="140" y="912" font-size="14" fill="#77727f">plays when: winds up Dance Party</text><rect x="50" y="976" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="968" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="960" width="11" height="26" rx="2" fill="#8cea6b"/><rect x="95" y="952" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="944" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="972" font-size="38" font-weight="bold" fill="#fbf6ea">Tag, you're out!</text><text x="140" y="1002" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">teasing</tspan></text><text x="140" y="1024" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="1036" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1088" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="1080" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="1072" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1064" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1056" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1084" font-size="38" font-weight="bold" fill="#fbf6ea">Nap time!</text><text x="140" y="1114" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a yawn in it</tspan></text><text x="140" y="1136" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1200" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="1192" width="11" height="18" rx="2" fill="#8cea6b"/><rect x="80" y="1184" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1176" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1168" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1196" font-size="38" font-weight="bold" fill="#fbf6ea">Not... fair...</text><text x="140" y="1226" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a pout</tspan></text><text x="140" y="1248" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1260" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1312" width="11" height="10" rx="2" fill="#8cea6b"/><rect x="65" y="1304" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1296" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1288" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1280" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1308" font-size="38" font-weight="bold" fill="#fbf6ea">I'll grow... back...</text><text x="140" y="1338" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7ed360">voice/sproutkit/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">sleepy, sure of it</tspan></text><text x="140" y="1360" font-size="14" fill="#77727f">plays when: falls</text><rect y="1412" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1440" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1462" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>