<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1530" viewBox="0 0 1000 1530" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c5851"/><stop offset="1" stop-color="#1e1c1a"/></linearGradient></defs><rect width="1000" height="1530" fill="#141319"/><rect width="1000" height="412" fill="url(#hd)"/><rect y="406" width="1000" height="6" fill="#8cc6db"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Oremantle</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the mountain's grandmother, whose coat is whatever the mountain is</text><text x="50" y="162" font-size="24" fill="#e8dcc0">made of</text><text x="50" y="206" font-size="22" font-style="italic" fill="#8cc6db">“I do not go to the fight. I become what the fight is standing on.”</text><text x="50" y="248" font-size="18" font-weight="bold" fill="#f3ead4">a Sentinel -- a snow leopard of stone and ore, half as big again as any cat living, built</text><text x="50" y="272" font-size="18" font-weight="bold" fill="#f3ead4">by the Geartooth clan · the first winters · the roots of the high crags · she/her</text><text x="50" y="302" font-size="19" fill="#d8d2c4">A very old, very big grandmother: low, slow and unbothered, every word set</text><text x="50" y="328" font-size="19" fill="#d8d2c4">down like a stone. She is never in a hurry and never unkind. Chest voice, room</text><text x="50" y="354" font-size="19" fill="#d8d2c4">left between words. Only the ultimate rises -- from a rumble to a roar.</text><rect x="0" y="418" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="470" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="462" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="454" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="446" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="438" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="466" font-size="38" font-weight="bold" fill="#fbf6ea">The mountain is here.</text><text x="140" y="496" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">slow, settling in</tspan></text><text x="140" y="518" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="582" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="574" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="566" width="11" height="26" rx="2" fill="#8cc6db"/><rect x="95" y="558" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="550" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="578" font-size="38" font-weight="bold" fill="#fbf6ea">Stand behind me.</text><text x="140" y="608" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">firm, protective</tspan></text><text x="140" y="630" font-size="14" fill="#77727f">plays when: shifts to Granite</text><rect x="0" y="642" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="694" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="686" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="678" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="670" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="662" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="690" font-size="38" font-weight="bold" fill="#fbf6ea">Cold, now.</text><text x="140" y="720" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">quiet, breath misting</tspan></text><text x="140" y="742" font-size="14" fill="#77727f">plays when: shifts to Rime</text><rect x="50" y="806" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="798" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="790" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="782" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="774" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="802" font-size="38" font-weight="bold" fill="#fbf6ea">Come here, child.</text><text x="140" y="832" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">patient, drawing someone in</tspan></text><text x="140" y="854" font-size="14" fill="#77727f">plays when: shifts to Lodestone</text><rect x="0" y="866" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="918" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="910" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="902" width="11" height="26" rx="2" fill="#8cc6db"/><rect x="95" y="894" width="11" height="34" rx="2" fill="#8cc6db"/><rect x="110" y="886" width="11" height="42" rx="2" fill="#8cc6db"/><text x="138" y="914" font-size="38" font-weight="bold" fill="#fbf6ea">The mountain has a HEART!</text><text x="140" y="944" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">from a rumble to a roar on 'heart'</tspan></text><text x="140" y="966" font-size="14" fill="#77727f">plays when: shifts to The Mountain's Heart</text><rect x="50" y="1030" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1022" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="1014" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1006" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="998" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1026" font-size="38" font-weight="bold" fill="#fbf6ea">Rest now.</text><text x="140" y="1056" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">grandmotherly, almost kind</tspan></text><text x="140" y="1078" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="1090" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1142" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1134" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="1126" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1118" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1110" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1138" font-size="38" font-weight="bold" fill="#fbf6ea">Stone outlasts.</text><text x="140" y="1168" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">flat, certain</tspan></text><text x="140" y="1190" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1254" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1246" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1238" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1230" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1222" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1250" font-size="38" font-weight="bold" fill="#fbf6ea">Even mountains... fall...</text><text x="140" y="1280" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">surprised, slow</tspan></text><text x="140" y="1302" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1314" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1366" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1358" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1350" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1342" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1334" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1362" font-size="38" font-weight="bold" fill="#fbf6ea">Back... to the rock...</text><text x="140" y="1392" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">content, going home</tspan></text><text x="140" y="1414" font-size="14" fill="#77727f">plays when: falls</text><rect y="1466" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1494" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1516" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>