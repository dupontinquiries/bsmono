<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1608" viewBox="0 0 1000 1608" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c5851"/><stop offset="1" stop-color="#1e1c1a"/></linearGradient></defs><rect width="1000" height="1608" fill="#141319"/><rect width="1000" height="490" fill="url(#hd)"/><rect y="484" width="1000" height="6" fill="#8cc6db"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Oremantle</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the mountain's grandmother, whose coat is whatever the mountain is</text><text x="50" y="162" font-size="24" fill="#e8dcc0">made of</text><text x="50" y="206" font-size="22" font-style="italic" fill="#8cc6db">“I do not go to the fight. I become what the fight is standing on.”</text><text x="50" y="248" font-size="18" font-weight="bold" fill="#f3ead4">a Sentinel -- a snow leopard of stone and ore, half as big again as any cat living, built</text><text x="50" y="272" font-size="18" font-weight="bold" fill="#f3ead4">by the Geartooth clan · the first winters · the roots of the high crags · she/her</text><text x="50" y="302" font-size="19" fill="#d8d2c4">A Sentinel speaking the Geartooth tongue (`geartooth`) in the grandmother's</text><text x="50" y="328" font-size="19" fill="#d8d2c4">voice the engineers gave her: low, slow and unbothered, every word set down</text><text x="50" y="354" font-size="19" fill="#d8d2c4">like a stone. Clicks (! a pop, | a tsk) are sharp and dry, made with the</text><text x="50" y="380" font-size="19" fill="#d8d2c4">tongue alone; the vowels are the tongue's own (a e i o u ä ö ü y). Only the</text><text x="50" y="406" font-size="19" fill="#d8d2c4">ultimate rises -- from a rumble to a roar. Each direction gives the line's</text><text x="50" y="432" font-size="19" fill="#d8d2c4">meaning in brackets.</text><rect x="0" y="496" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="548" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="540" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="532" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="524" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="516" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="544" font-size="38" font-weight="bold" fill="#fbf6ea">Tharu hy.</text><text x="140" y="574" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">slow, settling in [the mountain is here]</tspan></text><text x="140" y="596" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="660" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="652" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="644" width="11" height="26" rx="2" fill="#8cc6db"/><rect x="95" y="636" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="628" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="656" font-size="38" font-weight="bold" fill="#fbf6ea">|Ö, hy!</text><text x="140" y="686" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">firm, protective [kin, here -- behind me]</tspan></text><text x="140" y="708" font-size="14" fill="#77727f">plays when: shifts to Granite</text><rect x="0" y="720" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="772" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="764" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="756" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="748" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="740" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="768" font-size="38" font-weight="bold" fill="#fbf6ea">Yla tam.</text><text x="140" y="798" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">quiet, breath misting [the water shuts -- cold now]</tspan></text><text x="140" y="820" font-size="14" fill="#77727f">plays when: shifts to Rime</text><rect x="50" y="884" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="876" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="868" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="860" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="852" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="880" font-size="38" font-weight="bold" fill="#fbf6ea">Mi, hy.</text><text x="140" y="910" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">patient, drawing someone in [little one, here]</tspan></text><text x="140" y="932" font-size="14" fill="#77727f">plays when: shifts to Lodestone</text><rect x="0" y="944" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="996" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="988" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="980" width="11" height="26" rx="2" fill="#8cc6db"/><rect x="95" y="972" width="11" height="34" rx="2" fill="#8cc6db"/><rect x="110" y="964" width="11" height="42" rx="2" fill="#8cc6db"/><text x="138" y="992" font-size="38" font-weight="bold" fill="#fbf6ea">Tharu-a !ÖN!</text><text x="140" y="1022" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">from a rumble to a roar on the click [the mountain's HEART]</tspan></text><text x="140" y="1044" font-size="14" fill="#77727f">plays when: shifts to The Mountain's Heart</text><rect x="50" y="1108" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1100" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="1092" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1084" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1076" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1104" font-size="38" font-weight="bold" fill="#fbf6ea">Luu.</text><text x="140" y="1134" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">grandmotherly, almost kind [go down; rest]</tspan></text><text x="140" y="1156" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="1168" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1220" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1212" width="11" height="18" rx="2" fill="#8cc6db"/><rect x="80" y="1204" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1196" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1188" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1216" font-size="38" font-weight="bold" fill="#fbf6ea">Doru ol.</text><text x="140" y="1246" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">flat, certain [stone, always]</tspan></text><text x="140" y="1268" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1332" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1324" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1316" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1308" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1300" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1328" font-size="38" font-weight="bold" fill="#fbf6ea">Tharu... !luu...</text><text x="140" y="1358" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">surprised, slow [the mountain... went down...]</tspan></text><text x="140" y="1380" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1392" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1444" width="11" height="10" rx="2" fill="#8cc6db"/><rect x="65" y="1436" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1428" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1420" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1412" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1440" font-size="38" font-weight="bold" fill="#fbf6ea">Doru... |kör...</text><text x="140" y="1470" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eb3c5">voice/oremantle/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">content, going home [the stone... will turn again...]</tspan></text><text x="140" y="1492" font-size="14" fill="#77727f">plays when: falls</text><rect y="1544" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1572" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1594" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>