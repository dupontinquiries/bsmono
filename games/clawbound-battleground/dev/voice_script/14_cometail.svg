<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161c3a"/><stop offset="1" stop-color="#070913"/></linearGradient></defs><rect width="1000" height="1500" fill="#141319"/><rect width="1000" height="382" fill="url(#hd)"/><rect y="376" width="1000" height="6" fill="#ffdb75"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Cometail</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the star-fallen, who came down with the comet over the glacier</text><text x="50" y="176" font-size="22" font-style="italic" fill="#ffdb75">“What falls from the sky does not ask where it may land.”</text><text x="50" y="218" font-size="18" font-weight="bold" fill="#f3ead4">caracal · the elder dawn · the glacier-sky above the cloud sea, where the Starwell is ·</text><text x="50" y="242" font-size="18" font-weight="bold" fill="#f3ead4">he/him</text><text x="50" y="272" font-size="19" fill="#d8d2c4">Bright, quick tenor with a spark of laughter under it: a young daredevil who</text><text x="50" y="298" font-size="19" fill="#d8d2c4">has already jumped. Fast in, fast out -- then one huge call for the falling</text><text x="50" y="324" font-size="19" fill="#d8d2c4">star.</text><rect x="0" y="388" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="440" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="432" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="424" width="11" height="26" rx="2" fill="#ffdb75"/><rect x="95" y="416" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="408" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="436" font-size="34" font-weight="bold" fill="#fbf6ea">Look up. I'm already falling.</text><text x="140" y="466" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">grinning, a little breathless</tspan></text><text x="140" y="488" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="552" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="544" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="536" width="11" height="26" rx="2" fill="#ffdb75"/><rect x="95" y="528" width="11" height="34" rx="2" fill="#ffdb75"/><rect x="110" y="520" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="548" font-size="38" font-weight="bold" fill="#fbf6ea">Starshot!</text><text x="140" y="578" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a flick of the paw, sharp</tspan></text><text x="140" y="600" font-size="14" fill="#77727f">plays when: winds up Starshot</text><rect x="0" y="612" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="664" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="656" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="648" width="11" height="26" rx="2" fill="#ffdb75"/><rect x="95" y="640" width="11" height="34" rx="2" fill="#ffdb75"/><rect x="110" y="632" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="660" font-size="38" font-weight="bold" fill="#fbf6ea">Pounce!</text><text x="140" y="690" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a leap -- up on the vowel</tspan></text><text x="140" y="712" font-size="14" fill="#77727f">plays when: winds up Meteor Pounce</text><rect x="50" y="776" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="768" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="760" width="11" height="26" rx="2" fill="#ffdb75"/><rect x="95" y="752" width="11" height="34" rx="2" fill="#ffdb75"/><rect x="110" y="744" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="772" font-size="38" font-weight="bold" fill="#fbf6ea">Flare!</text><text x="140" y="802" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a bright burst, eyes shut</tspan></text><text x="140" y="824" font-size="14" fill="#77727f">plays when: winds up Flare</text><rect x="0" y="836" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="888" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="880" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="872" width="11" height="26" rx="2" fill="#ffdb75"/><rect x="95" y="864" width="11" height="34" rx="2" fill="#ffdb75"/><rect x="110" y="856" width="11" height="42" rx="2" fill="#ffdb75"/><text x="138" y="884" font-size="38" font-weight="bold" fill="#fbf6ea">Watch the SKY!</text><text x="140" y="914" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">from far above, rising to a shout</tspan></text><text x="140" y="936" font-size="14" fill="#77727f">plays when: winds up Falling Star</text><rect x="50" y="1000" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="992" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="984" width="11" height="26" rx="2" fill="#ffdb75"/><rect x="95" y="976" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="968" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="996" font-size="34" font-weight="bold" fill="#fbf6ea">Never saw me coming. Nobody does.</text><text x="140" y="1026" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">light, teasing</tspan></text><text x="140" y="1048" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="1060" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1112" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="1104" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="1096" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1088" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1080" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1108" font-size="38" font-weight="bold" fill="#fbf6ea">Burned out.</text><text x="140" y="1138" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">quiet, almost gentle</tspan></text><text x="140" y="1160" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1224" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="1216" width="11" height="18" rx="2" fill="#ffdb75"/><rect x="80" y="1208" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1200" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1192" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1220" font-size="38" font-weight="bold" fill="#fbf6ea">Just... a shooting star...</text><text x="140" y="1250" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">fading, wistful</tspan></text><text x="140" y="1272" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1284" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1336" width="11" height="10" rx="2" fill="#ffdb75"/><rect x="65" y="1328" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1320" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1312" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1304" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1332" font-size="38" font-weight="bold" fill="#fbf6ea">Back... to the sky...</text><text x="140" y="1362" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#e5c569">voice/cometail/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a last breath, looking up</tspan></text><text x="140" y="1384" font-size="14" fill="#77727f">plays when: falls</text><rect y="1436" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1464" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1486" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>