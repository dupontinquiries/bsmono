<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1424" viewBox="0 0 1000 1424" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#737377"/><stop offset="1" stop-color="#252527"/></linearGradient></defs><rect width="1000" height="1424" fill="#141319"/><rect width="1000" height="306" fill="url(#hd)"/><rect y="300" width="1000" height="6" fill="#cee5f2"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Snowhush</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the deep-snow lynxes of the white silence</text><text x="50" y="176" font-size="22" font-style="italic" fill="#cee5f2">“You need not be the strongest in the fight. Only the one who chooses where it happens.”</text><text x="50" y="218" font-size="18" font-weight="bold" fill="#f3ead4">lynx · the long winters · the white silence of the northern taiga · she/her</text><text x="50" y="248" font-size="19" fill="#d8d2c4">Quiet authority, cold and clear. A lynx who decides where the fight happens.</text><rect x="0" y="312" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="364" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="356" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="348" width="11" height="26" rx="2" fill="#cee5f2"/><rect x="95" y="340" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="332" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="360" font-size="34" font-weight="bold" fill="#fbf6ea">Here. The fight happens here.</text><text x="140" y="390" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">calm, absolute</tspan></text><text x="140" y="412" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="476" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="468" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="460" width="11" height="26" rx="2" fill="#cee5f2"/><rect x="95" y="452" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="444" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="472" font-size="38" font-weight="bold" fill="#fbf6ea">Snowbind.</text><text x="140" y="502" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">crisp</tspan></text><text x="140" y="524" font-size="14" fill="#77727f">plays when: winds up Snowbind</text><rect x="0" y="536" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="588" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="580" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="572" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="564" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="556" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="584" font-size="38" font-weight="bold" fill="#fbf6ea">Hush.</text><text x="140" y="614" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a command, not a request</tspan></text><text x="140" y="636" font-size="14" fill="#77727f">plays when: winds up White Silence</text><rect x="50" y="700" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="692" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="684" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="676" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="668" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="696" font-size="38" font-weight="bold" fill="#fbf6ea">Snow, cover us.</text><text x="140" y="726" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">protective</tspan></text><text x="140" y="748" font-size="14" fill="#77727f">plays when: winds up Hush of Snows</text><rect x="0" y="760" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="812" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="804" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="796" width="11" height="26" rx="2" fill="#cee5f2"/><rect x="95" y="788" width="11" height="34" rx="2" fill="#cee5f2"/><rect x="110" y="780" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="808" font-size="38" font-weight="bold" fill="#fbf6ea">The long winter comes.</text><text x="140" y="838" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">slow, spreading</tspan></text><text x="140" y="860" font-size="14" fill="#77727f">plays when: winds up The Long Winter</text><rect x="50" y="924" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="916" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="908" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="900" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="892" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="920" font-size="38" font-weight="bold" fill="#fbf6ea">Silence.</text><text x="140" y="950" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">satisfied</tspan></text><text x="140" y="972" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="984" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1036" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="1028" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="1020" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1012" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1004" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1032" font-size="38" font-weight="bold" fill="#fbf6ea">Snowed under.</text><text x="140" y="1062" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">dry humour</tspan></text><text x="140" y="1084" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1148" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="1140" width="11" height="18" rx="2" fill="#cee5f2"/><rect x="80" y="1132" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1124" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1116" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1144" font-size="38" font-weight="bold" fill="#fbf6ea">Cold... at last...</text><text x="140" y="1174" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">relief</tspan></text><text x="140" y="1196" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1208" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1260" width="11" height="10" rx="2" fill="#cee5f2"/><rect x="65" y="1252" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1244" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1236" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1228" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1256" font-size="38" font-weight="bold" fill="#fbf6ea">The snow... keeps me...</text><text x="140" y="1286" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b9ceda">voice/snowhush/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">drifting</tspan></text><text x="140" y="1308" font-size="14" fill="#77727f">plays when: falls</text><rect y="1360" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1388" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1410" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>