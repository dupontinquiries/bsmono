<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1424" viewBox="0 0 1000 1424" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#704d2c"/><stop offset="1" stop-color="#24190e"/></linearGradient></defs><rect width="1000" height="1424" fill="#141319"/><rect width="1000" height="306" fill="url(#hd)"/><rect y="300" width="1000" height="6" fill="#c98951"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Windclaw</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the wind-eared hunters of the dry plains</text><text x="50" y="176" font-size="22" font-style="italic" fill="#c98951">“The sky itself can be hunted.”</text><text x="50" y="218" font-size="18" font-weight="bold" fill="#f3ead4">caracal · the green ages · the dry plains · he/him</text><text x="50" y="248" font-size="19" fill="#d8d2c4">Bright, fast, a little wild. A plains hunter who thinks the sky is fair game.</text><rect x="0" y="312" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="364" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="356" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="348" width="11" height="26" rx="2" fill="#c98951"/><rect x="95" y="340" width="11" height="34" rx="2" fill="#c98951"/><rect x="110" y="332" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="360" font-size="38" font-weight="bold" fill="#fbf6ea">The sky is prey!</text><text x="140" y="390" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">exuberant, head thrown back</tspan></text><text x="140" y="412" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="476" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="468" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="460" width="11" height="26" rx="2" fill="#c98951"/><rect x="95" y="452" width="11" height="34" rx="2" fill="#c98951"/><rect x="110" y="444" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="472" font-size="38" font-weight="bold" fill="#fbf6ea">Snap!</text><text x="140" y="502" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a clipped bark</tspan></text><text x="140" y="524" font-size="14" fill="#77727f">plays when: winds up Sky Snap</text><rect x="0" y="536" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="588" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="580" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="572" width="11" height="26" rx="2" fill="#c98951"/><rect x="95" y="564" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="556" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="584" font-size="38" font-weight="bold" fill="#fbf6ea">Sand!</text><text x="140" y="614" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">spat out mid-sprint</tspan></text><text x="140" y="636" font-size="14" fill="#77727f">plays when: winds up Sand Dash</text><rect x="50" y="700" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="692" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="684" width="11" height="26" rx="2" fill="#c98951"/><rect x="95" y="676" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="668" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="696" font-size="38" font-weight="bold" fill="#fbf6ea">Up, up!</text><text x="140" y="726" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">eager, climbing</tspan></text><text x="140" y="748" font-size="14" fill="#77727f">plays when: winds up Skyward Hunger</text><rect x="0" y="760" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="812" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="804" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="796" width="11" height="26" rx="2" fill="#c98951"/><rect x="95" y="788" width="11" height="34" rx="2" fill="#c98951"/><rect x="110" y="780" width="11" height="42" rx="2" fill="#c98951"/><text x="138" y="808" font-size="38" font-weight="bold" fill="#fbf6ea">A hundred leaps!</text><text x="140" y="838" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">joyful frenzy</tspan></text><text x="140" y="860" font-size="14" fill="#77727f">plays when: winds up Hundred Leaps</text><rect x="50" y="924" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="916" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="908" width="11" height="26" rx="2" fill="#c98951"/><rect x="95" y="900" width="11" height="34" rx="2" fill="#c98951"/><rect x="110" y="892" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="920" font-size="38" font-weight="bold" fill="#fbf6ea">Caught on the wind!</text><text x="140" y="950" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">gleeful</tspan></text><text x="140" y="972" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="984" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1036" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="1028" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="1020" width="11" height="26" rx="2" fill="#c98951"/><rect x="95" y="1012" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1004" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1032" font-size="38" font-weight="bold" fill="#fbf6ea">Plucked!</text><text x="140" y="1062" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a laugh in it</tspan></text><text x="140" y="1084" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1148" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="1140" width="11" height="18" rx="2" fill="#c98951"/><rect x="80" y="1132" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1124" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1116" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1144" font-size="38" font-weight="bold" fill="#fbf6ea">The ground... again...</text><text x="140" y="1174" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">disgusted</tspan></text><text x="140" y="1196" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1208" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1260" width="11" height="10" rx="2" fill="#c98951"/><rect x="65" y="1252" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1244" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1236" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1228" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1256" font-size="38" font-weight="bold" fill="#fbf6ea">Grounded...</text><text x="140" y="1286" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#b57b49">voice/windclaw/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">deflated</tspan></text><text x="140" y="1308" font-size="14" fill="#77727f">plays when: falls</text><rect y="1360" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1388" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1410" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>