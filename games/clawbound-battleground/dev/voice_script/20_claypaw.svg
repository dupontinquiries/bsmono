<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1476" viewBox="0 0 1000 1476" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#643f2a"/><stop offset="1" stop-color="#21140d"/></linearGradient></defs><rect width="1000" height="1476" fill="#141319"/><rect width="1000" height="358" fill="url(#hd)"/><rect y="352" width="1000" height="6" fill="#8cbfcc"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Claypaw</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the potter of the river mud, who shapes himself anew</text><text x="50" y="176" font-size="22" font-style="italic" fill="#8cbfcc">“Anything that breaks can be made again. Anything that stands can be made to slide.”</text><text x="50" y="218" font-size="18" font-weight="bold" fill="#f3ead4">fishing cat · the flood years · the banks of the great river · he/him</text><text x="50" y="248" font-size="19" fill="#d8d2c4">A cheerful, earthy maker with his paws always in something: warm, practical, a</text><text x="50" y="274" font-size="19" fill="#d8d2c4">little rough, laughs easily. Wet consonants, a round open vowel. The ultimate</text><text x="50" y="300" font-size="19" fill="#d8d2c4">is a whoop, the bank giving way.</text><rect x="0" y="364" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="416" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="408" width="11" height="18" rx="2" fill="#8cbfcc"/><rect x="80" y="400" width="11" height="26" rx="2" fill="#8cbfcc"/><rect x="95" y="392" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="384" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="412" font-size="38" font-weight="bold" fill="#fbf6ea">Fresh from the riverbank!</text><text x="140" y="442" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">cheerful, rolling up his sleeves</tspan></text><text x="140" y="464" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="528" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="520" width="11" height="18" rx="2" fill="#8cbfcc"/><rect x="80" y="512" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="504" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="496" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="524" font-size="38" font-weight="bold" fill="#fbf6ea">Good as new.</text><text x="140" y="554" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">pressing a crack shut, satisfied</tspan></text><text x="140" y="576" font-size="14" fill="#77727f">plays when: winds up Remold</text><rect x="0" y="588" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="640" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="632" width="11" height="18" rx="2" fill="#8cbfcc"/><rect x="80" y="624" width="11" height="26" rx="2" fill="#8cbfcc"/><rect x="95" y="616" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="608" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="636" font-size="38" font-weight="bold" fill="#fbf6ea">Wet and quick!</text><text x="140" y="666" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a splash, bright</tspan></text><text x="140" y="688" font-size="14" fill="#77727f">plays when: winds up Quicken</text><rect x="50" y="752" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="744" width="11" height="18" rx="2" fill="#8cbfcc"/><rect x="80" y="736" width="11" height="26" rx="2" fill="#8cbfcc"/><rect x="95" y="728" width="11" height="34" rx="2" fill="#8cbfcc"/><rect x="110" y="720" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="748" font-size="38" font-weight="bold" fill="#fbf6ea">Round we go!</text><text x="140" y="778" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">spinning, gleeful</tspan></text><text x="140" y="800" font-size="14" fill="#77727f">plays when: winds up Spin</text><rect x="0" y="812" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="864" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="856" width="11" height="18" rx="2" fill="#8cbfcc"/><rect x="80" y="848" width="11" height="26" rx="2" fill="#8cbfcc"/><rect x="95" y="840" width="11" height="34" rx="2" fill="#8cbfcc"/><rect x="110" y="832" width="11" height="42" rx="2" fill="#8cbfcc"/><text x="138" y="860" font-size="38" font-weight="bold" fill="#fbf6ea">Here comes the BANK!</text><text x="140" y="890" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a whoop, rising on 'bank'</tspan></text><text x="140" y="912" font-size="14" fill="#77727f">plays when: winds up Mudslide</text><rect x="50" y="976" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="968" width="11" height="18" rx="2" fill="#8cbfcc"/><rect x="80" y="960" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="952" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="944" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="972" font-size="38" font-weight="bold" fill="#fbf6ea">Back to the mud.</text><text x="140" y="1002" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">matter-of-fact</tspan></text><text x="140" y="1024" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="1036" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1088" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="1080" width="11" height="18" rx="2" fill="#8cbfcc"/><rect x="80" y="1072" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1064" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1056" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1084" font-size="38" font-weight="bold" fill="#fbf6ea">I'll make another.</text><text x="140" y="1114" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">cheerful, already moving on</tspan></text><text x="140" y="1136" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1200" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="1192" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1184" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1176" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1168" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1196" font-size="38" font-weight="bold" fill="#fbf6ea">Just... cracked...</text><text x="140" y="1226" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">surprised, crumbling</tspan></text><text x="140" y="1248" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1260" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1312" width="11" height="10" rx="2" fill="#8cbfcc"/><rect x="65" y="1304" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1296" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1288" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1280" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1308" font-size="38" font-weight="bold" fill="#fbf6ea">I'll set... again...</text><text x="140" y="1338" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#7eacb7">voice/claypaw/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">unbothered, going soft</tspan></text><text x="140" y="1360" font-size="14" fill="#77727f">plays when: falls</text><rect y="1412" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1440" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1462" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>