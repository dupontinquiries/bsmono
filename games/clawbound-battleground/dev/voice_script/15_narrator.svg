<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1574" viewBox="0 0 1000 1574" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#271e16"/><stop offset="1" stop-color="#0c0a07"/></linearGradient></defs><rect width="1000" height="1574" fill="#141319"/><rect width="1000" height="328" fill="url(#hd)"/><rect y="322" width="1000" height="6" fill="#dbb77a"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">The Narrator</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the storyteller of the clans</text><text x="50" y="176" font-size="22" font-style="italic" fill="#dbb77a">The prologue of the first match: the world, the clans, the Gathering.</text><text x="50" y="218" font-size="19" fill="#d8d2c4">The storyteller of the clans, over the first match's prologue: unhurried,</text><text x="50" y="244" font-size="19" fill="#d8d2c4">weighty, a little in awe. Let each line breathe; the music leaves room between</text><text x="50" y="270" font-size="19" fill="#d8d2c4">them. Record each as its own file.</text><rect x="0" y="334" width="1000" height="142" fill="#1b1a22"/><rect x="50" y="386" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="378" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="370" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="362" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="354" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="380" font-size="28" font-weight="bold" fill="#fbf6ea">Before any word was written, the world belonged to</text><text x="138" y="413" font-size="28" font-weight="bold" fill="#fbf6ea">the clans.</text><text x="140" y="442" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">hushed, as if starting an old story</tspan></text><text x="140" y="464" font-size="14" fill="#77727f">plays when: the prologue opens, line 1 of 8 (first match of a session)</text><rect x="50" y="528" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="520" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="512" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="504" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="496" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="522" font-size="28" font-weight="bold" fill="#fbf6ea">No hand raised a wall. No fire burned but the</text><text x="138" y="555" font-size="28" font-weight="bold" fill="#fbf6ea">lightning's.</text><text x="140" y="584" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">slow, each sentence its own image</tspan></text><text x="140" y="606" font-size="14" fill="#77727f">plays when: the prologue, line 2 of 8</text><rect x="0" y="618" width="1000" height="142" fill="#1b1a22"/><rect x="50" y="670" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="662" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="654" width="11" height="26" rx="2" fill="#dbb77a"/><rect x="95" y="646" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="638" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="664" font-size="28" font-weight="bold" fill="#fbf6ea">From the frozen long-ago to the endless dunes, the</text><text x="138" y="697" font-size="28" font-weight="bold" fill="#fbf6ea">great cats kept it.</text><text x="140" y="726" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">growing, sweeping</tspan></text><text x="140" y="748" font-size="14" fill="#77727f">plays when: the prologue, line 3 of 8</text><rect x="50" y="812" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="804" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="796" width="11" height="26" rx="2" fill="#dbb77a"/><rect x="95" y="788" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="780" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="806" font-size="28" font-weight="bold" fill="#fbf6ea">Lions of the golden plains. Tigers of the dusk.</text><text x="138" y="839" font-size="28" font-weight="bold" fill="#fbf6ea">Sabre-fangs of the elder dawn.</text><text x="140" y="868" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a roll-call, each name a beat</tspan></text><text x="140" y="890" font-size="14" fill="#77727f">plays when: the prologue, line 4 of 8</text><rect x="0" y="902" width="1000" height="142" fill="#1b1a22"/><rect x="50" y="954" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="946" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="938" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="930" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="922" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="948" font-size="28" font-weight="bold" fill="#fbf6ea">Their bones are ice and sand now. Their stories</text><text x="138" y="981" font-size="28" font-weight="bold" fill="#fbf6ea">never were.</text><text x="140" y="1010" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue5.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">quiet, then warm on the last phrase</tspan></text><text x="140" y="1032" font-size="14" fill="#77727f">plays when: the prologue, line 5 of 8</text><rect x="50" y="1096" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="1088" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="1080" width="11" height="26" rx="2" fill="#dbb77a"/><rect x="95" y="1072" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1064" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1090" font-size="28" font-weight="bold" fill="#fbf6ea">When a thing cannot be divided, and must not be</text><text x="138" y="1123" font-size="28" font-weight="bold" fill="#fbf6ea">warred over, the clans hold the Gathering.</text><text x="140" y="1152" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue6.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">measured, the law of the clans</tspan></text><text x="140" y="1174" font-size="14" fill="#77727f">plays when: the prologue, line 6 of 8</text><rect x="0" y="1186" width="1000" height="142" fill="#1b1a22"/><rect x="50" y="1238" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="1230" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="1222" width="11" height="26" rx="2" fill="#dbb77a"/><rect x="95" y="1214" width="11" height="34" rx="2" fill="#dbb77a"/><rect x="110" y="1206" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1232" font-size="28" font-weight="bold" fill="#fbf6ea">They split by lot -- Frostfang and Emberclaw --</text><text x="138" y="1265" font-size="28" font-weight="bold" fill="#fbf6ea">and call their ancestors home.</text><text x="140" y="1294" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue7.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">rising, naming the two halves with weight</tspan></text><text x="140" y="1316" font-size="14" fill="#77727f">plays when: the prologue, line 7 of 8</text><rect x="50" y="1380" width="11" height="10" rx="2" fill="#dbb77a"/><rect x="65" y="1372" width="11" height="18" rx="2" fill="#dbb77a"/><rect x="80" y="1364" width="11" height="26" rx="2" fill="#dbb77a"/><rect x="95" y="1356" width="11" height="34" rx="2" fill="#dbb77a"/><rect x="110" y="1348" width="11" height="42" rx="2" fill="#dbb77a"/><text x="138" y="1374" font-size="28" font-weight="bold" fill="#fbf6ea">Beasts of power. Beasts of glory. Let the ages</text><text x="138" y="1407" font-size="28" font-weight="bold" fill="#fbf6ea">meet.</text><text x="140" y="1436" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#c5a56e">narrator/prologue8.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">the peak: full voice on the last four words</tspan></text><text x="140" y="1458" font-size="14" fill="#77727f">plays when: line 8 of 8: the prologue ends, the world comes into view</text><rect y="1510" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1538" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1560" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>