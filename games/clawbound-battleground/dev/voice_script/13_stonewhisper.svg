<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#544d43"/><stop offset="1" stop-color="#1b1916"/></linearGradient></defs><rect width="1000" height="1450" fill="#141319"/><rect width="1000" height="332" fill="url(#hd)"/><rect y="326" width="1000" height="6" fill="#a08260"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Stonewhisper</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the grey ghosts of the high crags</text><text x="50" y="176" font-size="22" font-style="italic" fill="#a08260">“The mountain does not hurry, and the mountain is never late.”</text><text x="50" y="218" font-size="18" font-weight="bold" fill="#f3ead4">snow leopard · the long winters · the high crags · she/her</text><text x="50" y="248" font-size="19" fill="#d8d2c4">A grey ghost of the crags: dry, sparse, never hurried. Every word placed like</text><text x="50" y="274" font-size="19" fill="#d8d2c4">a foothold.</text><rect x="0" y="338" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="390" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="382" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="374" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="366" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="358" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="386" font-size="38" font-weight="bold" fill="#fbf6ea">Never late.</text><text x="140" y="416" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">understated</tspan></text><text x="140" y="438" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="502" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="494" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="486" width="11" height="26" rx="2" fill="#a08260"/><rect x="95" y="478" width="11" height="34" rx="2" fill="#a08260"/><rect x="110" y="470" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="498" font-size="38" font-weight="bold" fill="#fbf6ea">Crag!</text><text x="140" y="528" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a leap</tspan></text><text x="140" y="550" font-size="14" fill="#77727f">plays when: winds up Crag Leap</text><rect x="0" y="562" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="614" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="606" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="598" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="590" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="582" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="610" font-size="38" font-weight="bold" fill="#fbf6ea">Stone.</text><text x="140" y="640" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">unmoved</tspan></text><text x="140" y="662" font-size="14" fill="#77727f">plays when: winds up Stone Patience</text><rect x="50" y="726" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="718" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="710" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="702" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="694" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="722" font-size="38" font-weight="bold" fill="#fbf6ea">Steady.</text><text x="140" y="752" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">reassuring</tspan></text><text x="140" y="774" font-size="14" fill="#77727f">plays when: winds up Sure-Footed</text><rect x="0" y="786" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="838" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="830" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="822" width="11" height="26" rx="2" fill="#a08260"/><rect x="95" y="814" width="11" height="34" rx="2" fill="#a08260"/><rect x="110" y="806" width="11" height="42" rx="2" fill="#a08260"/><text x="138" y="834" font-size="38" font-weight="bold" fill="#fbf6ea">The crags answer!</text><text x="140" y="864" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">an echoing call</tspan></text><text x="140" y="886" font-size="14" fill="#77727f">plays when: winds up The Crags Answer</text><rect x="50" y="950" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="942" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="934" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="926" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="918" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="946" font-size="38" font-weight="bold" fill="#fbf6ea">On time.</text><text x="140" y="976" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">dry</tspan></text><text x="140" y="998" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="1010" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1062" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="1054" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="1046" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1038" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1030" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1058" font-size="38" font-weight="bold" fill="#fbf6ea">The mountain waited.</text><text x="140" y="1088" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">patient</tspan></text><text x="140" y="1110" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1174" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="1166" width="11" height="18" rx="2" fill="#a08260"/><rect x="80" y="1158" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1150" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1142" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1170" font-size="38" font-weight="bold" fill="#fbf6ea">Crumble...</text><text x="140" y="1200" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a rockfall of a word</tspan></text><text x="140" y="1222" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1234" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1286" width="11" height="10" rx="2" fill="#a08260"/><rect x="65" y="1278" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1270" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1262" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1254" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1282" font-size="38" font-weight="bold" fill="#fbf6ea">Stone... sleeps...</text><text x="140" y="1312" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#907557">voice/stonewhisper/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">settling</tspan></text><text x="140" y="1334" font-size="14" fill="#77727f">plays when: falls</text><rect y="1386" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1414" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1436" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>