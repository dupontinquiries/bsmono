<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1474" viewBox="0 0 1000 1474" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a314d"/><stop offset="1" stop-color="#131019"/></linearGradient></defs><rect width="1000" height="1474" fill="#141319"/><rect width="1000" height="356" fill="url(#hd)"/><rect y="350" width="1000" height="6" fill="#9986b6"/><text x="48" y="92" font-size="64" font-weight="bold" fill="#fbf6ea">Stillsmoke</text><text x="50" y="132" font-size="24" fill="#e8dcc0">the ninth son of the storm-dragon, of the far-east thunder mountains</text><text x="50" y="176" font-size="22" font-style="italic" fill="#9986b6">“Sit still long enough, and even the storm will come to ask your leave.”</text><text x="50" y="218" font-size="18" font-weight="bold" fill="#f3ead4">dragon-cat, son of the storm-dragon · the age of storms · the far-east thunder mountains</text><text x="50" y="242" font-size="18" font-weight="bold" fill="#f3ead4">· he/him</text><text x="50" y="272" font-size="19" fill="#d8d2c4">Serene, unhurried, faintly amused -- the storm-dragon's ninth son. Calm until</text><text x="50" y="298" font-size="19" fill="#d8d2c4">the thunder.</text><rect x="0" y="362" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="414" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="406" width="11" height="18" rx="2" fill="#9986b6"/><rect x="80" y="398" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="390" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="382" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="410" font-size="38" font-weight="bold" fill="#fbf6ea">Sit. The storm will come.</text><text x="140" y="440" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/select.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">tranquil</tspan></text><text x="140" y="462" font-size="14" fill="#77727f">plays when: locked in on the select screen</text><rect x="50" y="526" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="518" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="510" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="502" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="494" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="522" font-size="38" font-weight="bold" fill="#fbf6ea">Breathe.</text><text x="140" y="552" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/cast1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a slow exhale</tspan></text><text x="140" y="574" font-size="14" fill="#77727f">plays when: winds up Cloud Breath</text><rect x="0" y="586" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="638" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="630" width="11" height="18" rx="2" fill="#9986b6"/><rect x="80" y="622" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="614" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="606" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="634" font-size="38" font-weight="bold" fill="#fbf6ea">Sweet rain.</text><text x="140" y="664" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/cast2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">kind</tspan></text><text x="140" y="686" font-size="14" fill="#77727f">plays when: winds up Sweetrain</text><rect x="50" y="750" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="742" width="11" height="18" rx="2" fill="#9986b6"/><rect x="80" y="734" width="11" height="26" rx="2" fill="#9986b6"/><rect x="95" y="726" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="718" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="746" font-size="38" font-weight="bold" fill="#fbf6ea">The mountain sits.</text><text x="140" y="776" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/cast3.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">immovable</tspan></text><text x="140" y="798" font-size="14" fill="#77727f">plays when: winds up The Seated Mountain</text><rect x="0" y="810" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="862" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="854" width="11" height="18" rx="2" fill="#9986b6"/><rect x="80" y="846" width="11" height="26" rx="2" fill="#9986b6"/><rect x="95" y="838" width="11" height="34" rx="2" fill="#9986b6"/><rect x="110" y="830" width="11" height="42" rx="2" fill="#9986b6"/><text x="138" y="858" font-size="38" font-weight="bold" fill="#fbf6ea">NINTH THUNDER!</text><text x="140" y="888" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/cast4.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">all the calm breaks at once</tspan></text><text x="140" y="910" font-size="14" fill="#77727f">plays when: winds up The Ninth Thunder</text><rect x="50" y="974" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="966" width="11" height="18" rx="2" fill="#9986b6"/><rect x="80" y="958" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="950" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="942" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="970" font-size="38" font-weight="bold" fill="#fbf6ea">The storm asked leave.</text><text x="140" y="1000" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/kill.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">gently wry</tspan></text><text x="140" y="1022" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="0" y="1034" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1086" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="1078" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1070" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1062" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1054" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1082" font-size="38" font-weight="bold" fill="#fbf6ea">Still.</text><text x="140" y="1112" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/kill.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a single settled word</tspan></text><text x="140" y="1134" font-size="14" fill="#77727f">plays when: takes down an enemy ancestor</text><rect x="50" y="1198" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="1190" width="11" height="18" rx="2" fill="#34323d"/><rect x="80" y="1182" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1174" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1166" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1194" font-size="38" font-weight="bold" fill="#fbf6ea">Smoke... clears...</text><text x="140" y="1224" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/death.1.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">unbothered</tspan></text><text x="140" y="1246" font-size="14" fill="#77727f">plays when: falls</text><rect x="0" y="1258" width="1000" height="112" fill="#1b1a22"/><rect x="50" y="1310" width="11" height="10" rx="2" fill="#9986b6"/><rect x="65" y="1302" width="11" height="18" rx="2" fill="#9986b6"/><rect x="80" y="1294" width="11" height="26" rx="2" fill="#34323d"/><rect x="95" y="1286" width="11" height="34" rx="2" fill="#34323d"/><rect x="110" y="1278" width="11" height="42" rx="2" fill="#34323d"/><text x="138" y="1306" font-size="38" font-weight="bold" fill="#fbf6ea">The thunder... waits...</text><text x="140" y="1336" font-size="17" fill="#9e98a8"><tspan font-family="DejaVu Sans Mono, monospace" fill="#8978a4">voice/stillsmoke/death.2.opus</tspan>  ·  <tspan font-style="italic" fill="#cfc7b6">a promise</tspan></text><text x="140" y="1358" font-size="14" fill="#77727f">plays when: falls</text><rect y="1410" width="1000" height="64" fill="#0f0e13"/><text x="50" y="1438" font-size="16" fill="#8f8a98">48 kHz mono · export Opus (~96 kbps) · 0.2 s of silence before and after</text><text x="50" y="1460" font-size="16" fill="#8f8a98">kill.1 / kill.2 (and death.1 / death.2) are two different lines: record both</text></svg>