[package]
name = "shell"
version = "0.1.0"
edition = "2021"

[features]
default = ["sound"]
# Synthesized sound through cpal (needs ALSA headers on Linux: libasound2-dev). Build with
# --no-default-features for a silent binary with no audio system dependency.
sound = ["dep:cpal"]

[dependencies]
road_warrior_core = { path = "../core" }
cpal = { version = "0.15", optional = true }
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts", "x11"] }
egui = "0.27"
zbus = { version = "3", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
bytemuck = { version = "1", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
# Offline WGSL validation so a shader error fails `cargo test` rather than
# panicking on the first frame. Matched to this crate's own wgpu.
naga = { version = "22", features = ["wgsl-in"] }
