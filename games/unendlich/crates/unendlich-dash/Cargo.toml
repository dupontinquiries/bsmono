[package]
name = "unendlich-dash"
version = "0.1.0"
edition = "2021"
description = "Native egui telemetry dashboard for unendlich (parses run_summaries.txt + events.jsonl)"
license = "MIT OR Apache-2.0"

[dependencies]
unendlich-ui = { path = "../unendlich-ui" }
# Pinned to the current releases (verified May 2026). egui_plot 0.35 targets
# egui 0.34, and eframe 0.34 also uses egui 0.34, so all three unify.
eframe = { version = "0.34", features = ["glow"] }
egui = "0.34"
egui_plot = "0.35"
regex = "1"
serde_json = "1"

