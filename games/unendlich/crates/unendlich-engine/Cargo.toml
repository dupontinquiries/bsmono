[package]
name = "unendlich-engine"
version = "0.99.9999996-r746-recipe-build-itemid-fix"
edition = "2021"
build = "build.rs"

[dependencies]
voxel-tools = { path = "../voxel-tools" }
# IN-INSTANCE inference: logscope's wgpu engine (gpu-gemm) linked directly,
# via aperture's Provider wrapper. Optional and OFF by default -- the trait
# and prompt shaping are pure and cost nothing; turning on `ai-gpu` links
# wgpu/naga/pollster through gpu-gemm and makes the model resident in the
# game process, sharing the GPU the renderer already has.
aperture-engine = { path = "../../../../apps/aperture/crates/aperture-engine", optional = true }
rodio = { version = "0.19", optional = true }  # spatial music playback; only built with --features audio
audiopus = { version = "0.2", optional = true }  # opus decode (libopus); audio feature only
ogg = { version = "0.9", optional = true }  # ogg demux for ogg-opus; audio feature only
linkme = "0.3"
# Workspace deps
unendlich-shared = { path = "../unendlich-shared" }
# Surface nets over a scalar field (games/shared/isosurface): pure geometry,
# tested in a second outside this crate. See src/world/smooth.rs.
isosurface = { path = "../../../shared/isosurface" }
# Fleet online play: the shared handoff + session control plane (games/shared/netcode)
netcode = { path = "../../../shared/netcode" }
# unendlich-netview bin: serves the live world-state debug view over HTTP
netview = { path = "../../../../shared/netview" }

# Math
nalgebra-glm = "0.18"

# Procedural generation
noise = "0.8"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency / collections
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "5.5"
rayon = "1.10" # r191: parallel worldgen columns

# Logging
log = "0.4"
env_logger = "0.10"

# Vulkan compute shader pipeline (optional)
ash = { version = "0.37", optional = true }

# Required by the render feature: glfw 0.45's Vulkan wrappers are typed
# against vk-sys, so we need the same types we can pass to it. The handles
# themselves are bit-identical with ash's so we transmute at the boundary.
vk-sys = { version = "0.4", optional = true }

# Window & input (full game build)
glfw = { version = "0.45", features = ["vulkan"], optional = true }

# T07-R27 glfw->winit migration, Approach B (see input_codes.rs's winit_conv
# module, previously dead code with no feature to gate it): winit gives real
# per-finger multi-touch (WindowEvent::Touch with id+phase), which GLFW
# cannot report on Linux at all -- it only ever sees a single emulated
# pointer from the compositor. Same version blackstar-rs (this monorepo)
# already ships successfully. `window-winit` is a standalone alternate
# window backend -- NOT wired into unendlich_fullgame.rs yet, additive only,
# doesn't touch the existing `window` (glfw) path.
winit = { version = "0.29", optional = true }

# In-game UI overlay (hand-rolled egui renderer; egui 0.34 to match the kit, ash 0.37 to match the engine).
egui = { version = "0.34", optional = true }
unendlich-ui = { path = "../unendlich-ui", optional = true }

# v0.24.25-shader-bin-fix: Linux setpriority + sched_setaffinity for
# the worker-priority fix. Only pulled in on Linux; macOS/Windows
# builds fall through to a no-op stub in thread_priority.rs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[package.metadata.gitmind]
# Read by gitmind's cockpit (crates/cockpit/src/buildflags.rs) to pre-tick the
# feature boxes per target; see maintenance/DISTRIBUTION.md.
#
# Both arches get the playable set. ai-engine is offered and unticked on both:
# the aarch64 handsets cannot usefully run the model, and on the desktop it is
# a choice rather than a default.
default-features-musl = ["gpu", "render", "window", "audio"]
default-features-gnu  = ["gpu", "render", "window", "audio"]

[features]
# The model lives in this process, on the GPU. No server, no subprocess.
# ai-gpu IMPLIES ai-engine. It did not, and the result was the worst kind
# of silent failure: `describe()` checked ai-gpu and said "in-instance",
# while every code path was gated on ai-engine and compiled out, so
# /build returned None instantly and told the operator to enable the
# feature they already had. One feature name for one thing.
ai-gpu = ["ai-engine", "aperture-engine/gpu"]
# The seam without the engine: /provider engine reports how to enable it.
ai-engine = ["dep:aperture-engine"]
# DEFAULT: a playable window with sound. `["gpu"]` alone built the engine with
# no render module, no window and no audio -- correct for a headless CI build
# and wrong for anyone launching it to play, who then had to know that `render`
# does not imply `window` and that `audio` exists at all.
#
# `ai-engine` is deliberately NOT here. It pulls aperture-engine and a model,
# which is a heavy dependency and a running cost, and it is the one feature a
# person should turn on knowingly rather than discover. It stays VISIBLE as a
# toggle (gitmind lists every declared feature, defaults merely pre-ticked), so
# off-but-offered rather than hidden.
default = ["gpu", "render", "window", "audio"]
gpu = ["ash"]
# T06-R27 (GLFW_DECOUPLING Approach A): the render module split so it no longer
# *forces* a window. `render-core` is the whole render module minus the glfw
# surface/swapchain/input coupling (that coupling is confined to context.rs's
# windowed constructor + input.rs/keybindings.rs, all `window`-gated). It builds
# headless (ash dlopen's libvulkan; no cmake/glfw-sys), so render-side changes
# can compile and run on lavapipe without a display.
render-core = ["gpu"]
# `window` is now the opt-in glfw path: the GLFW window + Vulkan surface
# creation (vk-sys is only used at the glfw->ash surface-handle boundary) plus
# input/keybindings. Enabling `window` restores the windowed path byte-for-byte.
window = ["glfw", "vk-sys"]
# T07-R27 glfw->winit migration, Approach B: alternate window backend using
# winit instead of GLFW, for real multi-touch input (see the Cargo.toml
# comment on the winit dependency). Additive only right now -- gates the
# previously-dead input_codes.rs::winit_conv module (keyboard/mouse event
# translation only; no touch handling yet, no window creation, no event loop,
# not called from any binary). NOT a drop-in replacement for `window` yet.
window-winit = ["winit"]
# `render` = the render module, WITHOUT pulling glfw. Add `window` for a real
# window, or `headless` for the offscreen target. (Was: render forced window.)
render = ["render-core"]
# Offscreen render: build render-core and render into an offscreen color/depth
# VkImage instead of a swapchain. No glfw in the dep tree. Present is a no-op
# (optional readback for screenshots/parity tests).
headless = ["render-core"]
# Exposes ONLY the pure-CPU mesher + octree CPU reference (no glfw/ash) via a
# minimal `render` shim, so GPU-vs-CPU mesh parity can run headless (lavapipe).
# Mutually exclusive in practice with `render` (which provides the full module).
mesh-ref = []
hot-shaders = []
# Hand-rolled egui overlay over the world (blurred panels, in-game dialogs).
# The overlay draws into the windowed swapchain present path, so it needs a window.
ui-overlay = ["render", "window", "egui", "unendlich-ui"]
# Was referenced by items/debug_ui.rs but never declared -> the module could never
# compile; now it pulls the overlay so the egui debug UI can build.
egui_debug = ["ui-overlay"]
# Spatial music playback (rodio). Optional so the default/headless build needs no
# audio system libs; the pure mixer (sim::spatial_audio) is always available.
audio = ["dep:rodio", "dep:audiopus", "dep:ogg"]
# r238 EXPERIMENTAL (off by default): batch-as-field grass LOD. Instead of
# culling dense distant grass, treat a patch as a density/phase FIELD: the far
# "back" of the patch is fast-forwarded with one field-propagation step that
# compensates for skipped ticks (like leaf_decay's advance_n_ticks but over a
# field), while only the near "front" edge is high-res per-blade ticked. Pure
# module (sim::grass_field) is always built + unit-tested; this feature gates
# the live tick-path integration. See docs/design/grass_field_batch.md.
grass-field-batch = []
# r239 EXPERIMENTAL (off by default): batch-as-field fire LOD — the grass
# treatment applied to spreading fire (far fires fast-forwarded as a fuel/
# intensity/heat field, near fires high-res per-cell). Pure module
# (sim::fire_field) always built + tested; this gates the live tick-path
# integration. See docs/design/batch_field_lod.md.
fire-field-batch = []
# r239 EXPERIMENTAL (off by default): vision-driven mesh scheduling. Mesh what
# player/mob view cones need now/soon and DEFER obscured or behind-the-actor
# chunks (the dense-cave-interior win) — a meshing-TIME visibility gate, atop
# the existing draw-time GPU frustum cull. Pure model (sim::mesh_vision) always
# built + tested; this gates the live mesh-queue integration. See
# docs/design/mesh_vision_scheduling.md.
mesh-vision-sched = []
# r244 EXPERIMENTAL (off by default): per-chunk shader variants. chunk.frag
# gates fog-steps/water/dynamic-lights/shadows behind compile-time flags; the
# engine compiles cheaper variants and binds the lightest one a chunk needs
# (far/flat/dry chunks skip what they can't show). Pure selector
# (sim::shader_variant) always built + tested; this gates the variant-pipeline
# compilation + per-chunk binding. See docs/design/shader_variants.md.
shader-variants = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "roar-render"
path = "src/bin/roar_render.rs"
required-features = ["audio"]

[[bin]]
name = "world-bench"
path = "src/bin/world_bench.rs"

[[bin]]
name = "perf-probe"
path = "src/bin/perf_probe.rs"

[[bin]]
name = "gpu-headless-probe"
path = "src/bin/gpu_headless_probe.rs"
required-features = ["headless"]

[[bin]]
name = "octree-bench"
path = "src/bin/octree_bench.rs"

[[bin]]
name = "mesh-bench"
path = "src/bin/mesh_bench.rs"
required-features = ["render"]

[[bin]]
name = "gpu-mesh-bench"
path = "src/bin/gpu_mesh_bench.rs"
required-features = ["render", "gpu", "window"]

[[bin]]
name = "probe-report"
path = "src/bin/probe_report.rs"

[[bin]]
name = "unendlich-demo"
path = "src/bin/unendlich_demo.rs"

[[bin]]
name = "unendlich-triangle"
path = "src/bin/unendlich_triangle.rs"
required-features = ["render", "window"]

[[bin]]
name = "unendlich-chunk"
path = "src/bin/unendlich_chunk.rs"
required-features = ["render", "window"]

[[bin]]
name = "unendlich-palette"
path = "src/bin/unendlich_palette.rs"
required-features = ["render", "window"]

[[bin]]
name = "unendlich-world"
path = "src/bin/unendlich_world.rs"
required-features = ["render", "window"]

[[bin]]
name = "unendlich-fullgame"
path = "src/bin/unendlich_fullgame.rs"
required-features = ["render", "window", "ui-overlay"]

[[bin]]
name = "unendlich-server"
path = "src/bin/unendlich_server.rs"
# render-core pulls world_renderer which references egui unconditionally, so the lib only builds
# with egui present; the server never opens a window — egui is just a compile-time dep here.
required-features = ["headless", "egui"]

[[bin]]
name = "unendlich-spin"
path = "src/bin/unendlich_spin.rs"
required-features = ["render", "window"]

[[bin]]
name = "winding-check"
path = "src/bin/winding_check.rs"
required-features = ["render"]

[dev-dependencies]
tempfile = "=3.10"
getrandom = "=0.2.15"

[[example]]
name = "menu_snapshot"
required-features = ["egui"]

[[example]]
name = "flythrough_snapshot"
required-features = ["egui"]

[[example]]
name = "heightmap_collage"
required-features = ["gpu"]
