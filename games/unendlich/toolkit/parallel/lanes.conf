# unendlich — parallel-thread LANE MAP
#
# One "lane" per parallel Claude session. A lane owns a set of path prefixes /
# globs. The merge tooling (lane_check.py, merge_bricks.sh) uses this to:
#   * warn when a session's brick edits files OUTSIDE its declared lane
#     (the #1 cause of cross-session clobbering), and
#   * surface where two sessions' bricks touch the same files BEFORE merging.
#
# It is a CONTRACT, not a wall: editing out of lane is allowed, you just get a
# warning so the collision is visible and deliberate.
#
# Format:  <lane> = <comma-separated path prefixes or globs>
#   - A prefix matches any path that starts with it (e.g. "src/render/").
#   - A glob may use * and ? (fnmatch), e.g. "**/sim/*_gpu.rs".
#   - Paths are repo-relative (as they appear in `git diff --name-only`).
#   - The special lane `shared` is owned by EVERYONE — files there are never
#     flagged out-of-lane (keep it small + low-conflict by discipline).
#
# EDIT ME: these defaults were inferred from the tree on 2026-06-02. Adjust the
# globs to match how you actually split work. Lines marked CONTESTED are paths
# that plausibly belong to two lanes — the checker will report them as contested
# so you can decide an owner.

# ── rendering / shaders (the "AAA shaders" thread) ───────────────────────────
rendering = crates/unendlich-engine/src/render/, crates/unendlich-engine/src/shaders/

# ── item advancement (crafting, inventory, loot, drops, progression) ─────────
items = crates/unendlich-engine/src/items/, crates/unendlich-engine/src/sim/item_entity.rs, crates/unendlich-engine/src/sim/skills.rs, crates/unendlich-engine/src/sim/armor.rs

# ── mobs / entities / combat / AI ────────────────────────────────────────────
mobs = crates/unendlich-engine/src/world/entity.rs, crates/unendlich-engine/src/sim/mob.rs, crates/unendlich-engine/src/sim/combat.rs, crates/unendlich-engine/src/sim/spawn.rs, crates/unendlich-engine/src/sim/goals.rs, crates/unendlich-engine/src/sim/summon.rs, crates/unendlich-engine/src/sim/projectile.rs, crates/unendlich-engine/src/sim/personality.rs, crates/unendlich-engine/src/sim/vision.rs, crates/unendlich-engine/src/sim/perception_field.rs, crates/unendlich-engine/src/sim/perception_fog.rs

# ── world / terrain / cave generation ────────────────────────────────────────
worldgen = crates/unendlich-engine/src/world/cpu_generator.rs, crates/unendlich-engine/src/world/gpu_generator.rs, crates/unendlich-engine/src/world/terrain_generator.rs, crates/unendlich-engine/src/world/cave_flora.rs

# ── shared infra: owned by everyone, never flagged (keep edits additive) ─────
# toolkit/ + claude-notes are append-mostly; Cargo manifests + shared crate are
# touched by many threads — coordinate or expect 3-way merges here.
shared = toolkit/, docs/claude-notes/, Cargo.toml, Cargo.lock, crates/unendlich-shared/, crates/vk-harness/

# CONTESTED (declare an owner if these get edited a lot):
#   crates/unendlich-engine/src/sim/*_gpu.rs   -> rendering vs the sim lanes
#   crates/unendlich-engine/src/world/mod.rs   -> worldgen vs mobs (entity spawn)
#   crates/unendlich-engine/src/render/world_renderer.rs -> rendering, but every
#       feature that draws something tends to reach into it. Keep edits there
#       small + localized; it is the most collision-prone file in the repo.
