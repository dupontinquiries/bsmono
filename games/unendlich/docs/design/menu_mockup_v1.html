<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unendlich · menu mockup (r206)</title>
<!--
  Standalone menu mockup for rapid, browser-side iteration on the menu
  aesthetic — decoupled from the engine build cycle (operator: "mock
  something in HTML for rapid parallel devel"). Encodes the design tokens
  from 08_UI_and_UX/bending_character_menu_ui_v2.docx:
    - "panels are atmospheres, not surfaces": frosted, tinted, blurred bg.
    - thin chrome, no high-contrast borders; legible via sharp text.
    - depth: background void heavily blurred (28-40px), panel chrome ~8px.
    - per-element colour grading; soft light; optical (defocus) transitions.
  This is a reference for what the egui liquid-glass should converge to.
  Pure HTML/CSS/JS, no deps. Open in any browser.
-->
<style>
  /* r208.1: the fill widens in WITHOUT @property (which some engines don't
     transition). A fixed-size radial pseudo is SCALED from 0 -> 1 on hover;
     transform+opacity transitions are universally supported. */
  :root {
    /* element colour-grading anchors (per-discipline tints in the doc) */
    --void-0: #0a0e16;
    --void-1: #121a28;
    --glass-tint: rgba(120,160,200,0.10);
    --glass-edge: rgba(190,225,255,0.22);
    --glass-hi:  rgba(215,240,255,0.85);
    --text:      #e8f0f8;
    --text-dim:  #9fb2c6;
    --accent:    #6fc3ff;
    --accent-warm:#ffd27f;
    --panel-blur: 14px;
    --void-blur:  34px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
  body {
    background: radial-gradient(1200px 800px at 50% 35%, var(--void-1), var(--void-0) 70%);
    color: var(--text);
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  /* The blurred "atmosphere" behind everything — drifts slowly on its own
     AND parallaxes with the mouse (JS sets --px/--py in px). Heavy blur =
     depth, so it should move the MOST of any layer. */
  .void {
    position: fixed; inset: -14%;
    filter: blur(var(--void-blur));
    opacity: 0.7;
    z-index: 0;
    --px: 0px; --py: 0px;
    transform: translate3d(var(--px), var(--py), 0);
    transition: transform 220ms cubic-bezier(.2,.7,.2,1);
    will-change: transform;
  }
  .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 26s ease-in-out infinite; }
  .blob.a { width: 600px; height: 600px; left: 10%; top: 20%; background: #1d4e7a; }
  .blob.b { width: 520px; height: 520px; right: 8%; top: 30%; background: #4a2d6e; animation-delay: -8s; }
  .blob.c { width: 480px; height: 480px; left: 40%; bottom: 5%; background: #1f6e63; animation-delay: -15s; }
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(40px,-30px) scale(1.08); }
    66%     { transform: translate(-30px,20px) scale(0.96); }
  }

  .stage { position: relative; z-index: 1; width: 1080px; max-width: 96vw; display: grid; grid-template-columns: 240px 1fr; gap: 22px; }

  .title { grid-column: 1 / -1; text-align: center; margin-bottom: 6px; }
  .title h1 { font-weight: 200; letter-spacing: 0.5em; font-size: 42px; text-indent: 0.5em;
    background: linear-gradient(180deg, #fff, var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .title p { color: var(--text-dim); font-size: 13px; letter-spacing: 0.3em; margin-top: 2px; }

  /* A glass panel: frosted, tinted, thin bright top edge, soft bottom glow.
     The bottom inner-glow is the "liquid" tell the egui fresnel also uses. */
  .glass {
    position: relative;
    background: var(--glass-tint);
    backdrop-filter: blur(var(--panel-blur)) saturate(1.2);
    -webkit-backdrop-filter: blur(var(--panel-blur)) saturate(1.2);
    border-radius: 16px;
    border: 1px solid var(--glass-edge);
    box-shadow: 0 10px 40px rgba(0,0,0,0.35),
                inset 0 1px 0 var(--glass-hi),
                inset 0 -30px 40px -30px rgba(120,180,230,0.5);
    overflow: hidden;
    /* r209: glass parallaxes by TRANSLATION ONLY (rotation removed — it
       was disorienting). The offset comes from the cone-projection model
       in JS, which writes --px/--py. */
    --px: 0px; --py: 0px;
    transform: translate(var(--px), var(--py));
    transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform;
  }
  /* r208: moving sheen sweeps removed — operator found them distracting,
     and real item/feedback content will animate the panels instead. The
     glass keeps its static top rim + bottom inner-glow (the box-shadow on
     .glass above), which read as glass without motion. */

  .nav { padding: 18px 16px; display: flex; flex-direction: column; gap: 8px; align-self: start; }
  .nav button {
    appearance: none; border: none; cursor: pointer; text-align: left;
    color: var(--text); font-size: 15px; letter-spacing: 0.04em;
    padding: 12px 16px; border-radius: 10px; background: transparent;
    position: relative; overflow: hidden;
    transition: color 180ms ease;
    --mx: 50%; --my: 50%;
  }
  /* the fill: a radial pseudo centred on the cursor (--mx/--my), SCALED
     from 0 to full on hover so it grows out of the point. transform +
     opacity only — no custom-property transition (max compatibility). */
  .nav button::before {
    content: ""; position: absolute; inset: -20%; border-radius: inherit;
    background: radial-gradient(circle at var(--mx) var(--my),
      rgba(111,195,255,0.32), rgba(111,195,255,0.12) 42%, transparent 68%);
    opacity: 0; transform: scale(0.2); transform-origin: var(--mx) var(--my);
    transition: opacity 320ms ease, transform 560ms cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .nav button:hover::before { opacity: 1; transform: scale(1); }
  .nav button span { position: relative; z-index: 1; }
  .nav button.active { color: #fff; }
  .nav button.active::before { opacity: 0.5; transform: scale(1); }
  .nav button.active::after {
    content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 2px;
    background: var(--accent); border-radius: 2px; z-index: 1;
  }

  .panel { padding: 26px 28px; min-height: 360px; }
  /* optical transition: content defocuses then resolves (doc: "defocus into
     blur, then resolve from blur into sharpness") */
  .panel .content { animation: resolve 620ms cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes resolve { from { filter: blur(12px); opacity: 0; transform: scale(0.98); } to { filter: blur(0); opacity: 1; transform: none; } }
  .panel h2 { font-weight: 300; font-size: 24px; letter-spacing: 0.08em; margin-bottom: 4px;
    color: var(--accent); /* r210: deterministic per-page/slider accent */ }
  /* r210: a faint wash bar under the heading whose colour is the
     slider+page hash — the most visible "sliders feed the content" tell. */
  .panel .content::before {
    content: ""; display: block; height: 3px; width: 60px; border-radius: 3px;
    background: var(--accent); margin-bottom: 14px; opacity: 0.8;
    box-shadow: 0 0 16px 2px var(--page-wash); }
  .panel .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }

  .row { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px; border-bottom: 1px solid rgba(160,200,240,0.08); }
  .row:last-child { border-bottom: none; }
  .row .label { font-size: 14px; }
  .row .hint { color: var(--text-dim); font-size: 12px; }

  /* slider + toggle — r211: more animated. */
  input[type=range] { -webkit-appearance: none; width: 180px; height: 5px; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), rgba(160,200,240,0.18)); outline: none;
    transition: box-shadow 220ms ease, filter 220ms ease; }
  input[type=range]:hover { box-shadow: 0 0 12px var(--page-wash); filter: brightness(1.15); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent)); cursor: pointer;
    box-shadow: 0 0 8px rgba(111,195,255,0.6);
    transition: transform 200ms cubic-bezier(.34,1.56,.64,1), box-shadow 200ms ease; }
  /* thumb grows + glows on hover, and "presses" on active */
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.35); box-shadow: 0 0 16px 3px var(--accent); }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); box-shadow: 0 0 22px 5px var(--accent); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--accent)); cursor: pointer;
    box-shadow: 0 0 8px rgba(111,195,255,0.6); transition: transform 200ms cubic-bezier(.34,1.56,.64,1); }
  input[type=range]:hover::-moz-range-thumb { transform: scale(1.35); }

  .toggle { width: 48px; height: 25px; border-radius: 14px; background: rgba(160,200,240,0.18);
    position: relative; cursor: pointer; overflow: hidden;
    transition: background 320ms ease, box-shadow 320ms ease; }
  .toggle.on { background: linear-gradient(90deg, var(--accent), #4a9fd8);
    box-shadow: 0 0 14px var(--page-wash), inset 0 0 8px rgba(255,255,255,0.25); }
  /* a light sweep that flashes across the track at the moment it turns on */
  .toggle::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    transform: translateX(-120%); opacity: 0; }
  .toggle.on::after { animation: toggleSweep 520ms ease-out; }
  @keyframes toggleSweep { 0% { transform: translateX(-120%); opacity: .9; } 100% { transform: translateX(120%); opacity: 0; } }
  .toggle .knob { position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #dfeaf5);
    /* springy travel + a subtle scale "lift" mid-throw */
    transition: left 360ms cubic-bezier(.5,1.6,.5,1), box-shadow 320ms ease, transform 200ms ease;
    box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .toggle.on .knob { left: 26px; box-shadow: 0 1px 4px rgba(0,0,0,.4), 0 0 10px rgba(255,255,255,.6); }
  .toggle:active .knob { transform: scale(0.9); }

  .worlds { display: flex; flex-direction: column; gap: 10px; }
  .world { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px;
    background: rgba(140,180,220,0.06); cursor: pointer; position: relative; overflow: hidden;
    --mx: 50%; --my: 50%; }
  .world::before {
    content: ""; position: absolute; inset: -20%; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--mx) var(--my),
      rgba(140,200,240,0.22), rgba(140,200,240,0.07) 45%, transparent 70%);
    opacity: 0; transform: scale(0.2); transform-origin: var(--mx) var(--my);
    transition: opacity 320ms ease, transform 560ms cubic-bezier(0.16, 1, 0.3, 1); }
  .world:hover::before { opacity: 1; transform: scale(1); }
  .world > * { position: relative; z-index: 1; }
  .world .thumb { width: 48px; height: 48px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #2a6e5a, #1d4e7a); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .world .meta { flex: 1; }
  .world .meta .n { font-size: 15px; }
  .world .meta .d { font-size: 12px; color: var(--text-dim); }
  .world .acts button { appearance: none; border: 1px solid var(--glass-edge); background: transparent; color: var(--text-dim);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; margin-left: 6px; transition: all 140ms; }
  .world .acts button:hover { color: var(--text); border-color: var(--accent); }
  .world .acts button.danger:hover { color: #ff9a9a; border-color: #ff6a6a; }

  .timeline { display: flex; gap: 0; align-items: stretch; margin-top: 8px; position: relative; padding: 18px 0; }
  .timeline .track { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(160,200,240,0.2); }
  .tp { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .tp .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); z-index: 1;
    box-shadow: 0 0 0 4px rgba(111,195,255,0.15); transition: transform 160ms; }
  .tp:hover .dot { transform: scale(1.4); }
  .tp .cap { font-size: 11px; color: var(--text-dim); margin-top: 8px; text-align: center; }
  .tp.warm .dot { background: var(--accent-warm); box-shadow: 0 0 0 4px rgba(255,210,127,0.15); }

  /* ── r208: inventory + crafting (per crafting_inventory_layout.docx) ── */
  /* a slot cell: near-black void fill, dark frame, blue corner accent dots
     at each corner (the doc's signature cell anatomy). */
  .cell {
    position: relative; aspect-ratio: 1; border-radius: 8px;
    background: radial-gradient(120% 120% at 50% 40%, rgba(30,60,90,0.25), rgba(6,10,16,0.9));
    border: 1px solid rgba(120,160,200,0.18);
    display: grid; place-items: center;
    transition: border-color 160ms, box-shadow 160ms; cursor: pointer;
  }
  /* the four blue corner dots */
  .cell::before, .cell::after,
  .cell > .c2::before, .cell > .c2::after {
    content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: var(--accent); opacity: 0.7;
  }
  .cell::before { left: 3px; top: 3px; } .cell::after { right: 3px; top: 3px; }
  .cell > .c2 { position: absolute; inset: 0; }
  .cell > .c2::before { left: 3px; bottom: 3px; } .cell > .c2::after { right: 3px; bottom: 3px; }
  .cell:hover { border-color: var(--accent); box-shadow: 0 0 14px rgba(111,195,255,0.25), inset 0 0 12px rgba(111,195,255,0.1); }
  .cell .ico { font-size: 22px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); z-index: 1; }
  .cell .qty { position: absolute; right: 4px; bottom: 2px; font-size: 10px; color: var(--text-dim); z-index: 1; }
  .cell.empty { cursor: default; } .cell.empty:hover { border-color: rgba(120,160,200,0.18); box-shadow: none; }

  /* category sidebar (8 filters) */
  .cats { display: flex; flex-direction: column; gap: 8px; }
  .cat { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(140,180,220,0.06); border: 1px solid rgba(120,160,200,0.16);
    font-size: 18px; cursor: pointer; position: relative; transition: all 150ms; color: var(--text-dim); }
  .cat:hover { background: rgba(140,180,220,0.13); color: var(--text); }
  .cat.active { background: linear-gradient(135deg, rgba(111,195,255,0.3), rgba(74,159,216,0.15)); color: #fff;
    border-color: var(--accent); box-shadow: 0 0 14px rgba(111,195,255,0.3); }
  .cat.active::after { content: "\25b6"; position: absolute; left: -10px; font-size: 9px; color: var(--accent); }

  /* crafting layout: sidebar | 3x3 grid | chevron | result column */
  .craft { display: grid; grid-template-columns: auto auto auto 1fr; gap: 20px; align-items: center; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 8px; }
  .chev { font-size: 32px; color: var(--accent-warm); animation: chevpulse 1.6s ease-in-out infinite; }
  @keyframes chevpulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  .result-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .result {
    width: 132px; height: 132px; border-radius: 14px; display: grid; place-items: center; position: relative;
    background: radial-gradient(120% 120% at 50% 40%, rgba(60,80,110,0.3), rgba(12,18,28,0.85));
    border: 2px solid rgba(220,180,90,0.7);
    box-shadow: 0 0 0 1px rgba(255,220,140,0.3), 0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,240,200,.4);
  }
  /* element-matched glow ring around the manifested result (blue = Water) */
  .result::after { content: ""; position: absolute; inset: -6px; border-radius: 18px;
    box-shadow: 0 0 24px 2px rgba(111,195,255,0.5); pointer-events: none; }
  .result .ico { font-size: 46px; }
  .station { width: 64px; height: 64px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(12,18,28,0.85); border: 1px solid var(--accent); box-shadow: inset 0 0 12px rgba(111,195,255,0.2); font-size: 22px; }
  .station .lbl { position: absolute; }
  .invgrid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 7px; margin-top: 4px; }
  .craft-foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
  .recipe-name { font-size: 16px; color: var(--accent); letter-spacing: .06em; }

  /* ── r211: CHARACTER sheet — glass × the green-tactical reference ───── */
  /* the merge: keep the frosted-glass depth + inner-glow, but recolour to
     the reference's forest-green tactical palette with gold accents and
     SHARP angular (clipped-corner) frames instead of round ones. */
  .char {
    --gold: #d9bc6a; --sage: #7d9b6f; --green-deep: #0d1a12;
    --frame: rgba(150,180,130,0.35);
    display: grid; grid-template-columns: 72px 1fr 1.1fr 184px; gap: 12px;
    color: #d8e4d2; min-height: 380px;
  }
  /* an angular glass sub-panel (clipped corners, sage border, green tint) */
  .gpanel {
    position: relative; padding: 12px;
    background: linear-gradient(160deg, rgba(20,34,24,0.55), rgba(10,18,12,0.65));
    backdrop-filter: blur(10px) saturate(1.1); -webkit-backdrop-filter: blur(10px) saturate(1.1);
    border: 1px solid var(--frame);
    box-shadow: inset 0 1px 0 rgba(190,220,170,0.18), inset 0 -22px 30px -26px rgba(120,160,90,0.5);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .gpanel .ph { font-size: 11px; letter-spacing: 0.18em; color: var(--sage); margin-bottom: 10px; text-transform: uppercase; }

  /* left: equipment slots with corner brackets + durability + rank diamond */
  .gear-col { display: flex; flex-direction: column; gap: 9px; }
  .eslot { position: relative; aspect-ratio: 1; background: rgba(10,18,12,0.6);
    border: 1px solid var(--frame); display: grid; place-items: center; cursor: pointer;
    transition: border-color 200ms, box-shadow 200ms; }
  .eslot:hover { border-color: var(--gold); box-shadow: 0 0 14px rgba(217,188,106,0.3); }
  .eslot .ico { font-size: 26px; }
  /* corner brackets */
  .eslot::before, .eslot::after { content: ""; position: absolute; width: 8px; height: 8px; border: 1px solid var(--gold); opacity: .8; }
  .eslot::before { left: -1px; top: -1px; border-right: none; border-bottom: none; }
  .eslot::after { right: -1px; bottom: -1px; border-left: none; border-top: none; }
  .eslot .dura { position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: var(--sage); }
  .eslot .rank { position: absolute; top: -4px; left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 7px; height: 7px; background: var(--gold); }

  /* stats column: power (gold, big) + diamond-glyph stat rows */
  .pname { font-size: 22px; letter-spacing: 0.06em; color: #eef3e8; }
  .psub { font-size: 11px; color: var(--sage); letter-spacing: 0.14em; margin-bottom: 14px; }
  .pwr-label { font-size: 11px; color: var(--sage); letter-spacing: 0.2em; }
  .pwr { font-size: 40px; font-weight: 300; color: var(--gold); line-height: 1; margin-bottom: 16px;
    text-shadow: 0 0 18px rgba(217,188,106,0.4); }
  .stat { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .stat .dia { width: 16px; height: 16px; background: var(--sage); transform: rotate(45deg); flex: none; opacity: .85; }
  .stat .sname { color: var(--sage); flex: 1; letter-spacing: 0.08em; }
  .stat .sval { color: #eef3e8; font-size: 15px; }

  /* centre: voxel character stage (placeholder block art vibe) */
  .char-stage { position: relative; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 35%, rgba(30,50,34,0.4), rgba(8,14,10,0.5));
    border: 1px solid var(--frame); overflow: hidden;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
  .char-stage .silhouette { font-size: 120px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); opacity: .92; }
  .char-stage .disc { position: absolute; left: 14px; bottom: 12px; font-size: 11px; color: var(--sage); letter-spacing: 0.14em; }
  .char-stage .disc b { color: var(--gold); display:block; font-size: 14px; letter-spacing: 0.1em; }

  /* right: companions, bond pips, resonance hex */
  .side { display: flex; flex-direction: column; gap: 12px; }
  .comp { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .comp .cthumb { width: 34px; height: 34px; border: 1px solid var(--frame); display: grid; place-items: center; font-size: 18px; flex: none; }
  .comp .cname { font-size: 12px; letter-spacing: 0.08em; }
  .abil { display: flex; gap: 5px; }
  .abil span { width: 22px; height: 22px; border: 1px solid var(--frame); display: grid; place-items: center; font-size: 12px;
    transition: border-color 160ms, box-shadow 160ms; cursor: pointer; }
  .abil span:hover { border-color: var(--gold); box-shadow: 0 0 8px rgba(217,188,106,0.4); }
  .pips { display: flex; gap: 4px; flex-wrap: wrap; }
  .pip { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); }
  .pip.empty { background: transparent; border: 1px solid var(--frame); }
  .hexwheel { display: grid; place-items: center; padding: 8px; }
  .hexwheel .core { width: 64px; height: 64px; display: grid; place-items: center; font-size: 28px;
    background: radial-gradient(circle, rgba(125,155,111,0.3), transparent);
    border: 1px solid var(--sage); border-radius: 50%; box-shadow: 0 0 20px rgba(125,155,111,0.3); }

  .footer { grid-column: 1 / -1; text-align: center; color: var(--text-dim); font-size: 11px; letter-spacing: 0.15em; margin-top: 4px; }
</style>
</head>
<body>
  <div class="void"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

  <div class="stage">
    <div class="title">
      <h1>UNENDLICH</h1>
      <p>MENU AESTHETIC MOCKUP · r206</p>
    </div>

    <nav class="glass nav" id="nav">

<script>
const panels = {
  play: `<div class="content"><h2>New World</h2><div class="sub">configure a world, then drop in</div>

    </div>
    <div class="row" style="margin-top:18px"><span class="label">＋ create history point now</span><span class="hint">dev</span></div>
    <div class="row"><span class="label">Each point snapshots your world</span><span class="hint">restore · delete</span></div></div>`,
  settings: `<div class="content"><h2>Settings</h2><div class="sub">video · audio · controls · performance</div>
    <div class="row"><span class="label">GUI scale</span><input type="range" min="1" max="1.66" step="0.11" value="1"></div>
    <div class="row"><span class="label">Fog</span><div class="toggle on" onclick="this.classList.toggle('on')"><div class="knob"></div></div></div>
    <div class="row"><span class="label">Shadows</span><div class="toggle on" onclick="this.classList.toggle('on')"><div class="knob"></div></div></div>
    <div class="row"><span class="label">Dev banner (UNENDLICH_DEV)</span><div class="toggle" onclick="this.classList.toggle('on')"><div class="knob"></div></div></div></div>`,
  quit: `<div class="content"><h2>Quit unendlich?</h2><div class="sub">your world is saved automatically</div>
    <div class="row"><span class="label">Return to desktop</span><span class="hint">esc to cancel</span></div></div>`,

  // r211: CHARACTER — the glass×green-tactical merge (character_panel_reference.docx
  // + the RootBender reference image). Grounded in that art: Root discipline,
  // Builder Dragon + Water Ocelot companions, Power + 3 stats, bond pips, resonance hex.
  character: (() => {
    const gear = [['\ud83d\udc79','helm'],['\ud83e\udde5','chest'],['\ud83e\uddbe','arms'],['\ud83e\udd7e','boots'],['\ud83d\udcff','amulet']];
    const gearCells = gear.map(g=>`<div class="eslot"><span class="rank"></span><span class="ico">${g[0]}</span><span class="dura">10/10</span></div>`).join('');
    const stats = [['MOBILITY','34'],['RESILIENCE','102'],['RECOVERY','68']];
    const statRows = stats.map(s=>`<div class="stat"><span class="dia"></span><span class="sname">${s[0]}</span><span class="sval">${s[1]}</span></div>`).join('');
    const pips = Array.from({length:10},(_,i)=>`<span class="pip ${i===0?'empty':''}"></span>`).join('');
    return `<div class="content"><div class="char">
      <div class="gear-col">${gearCells}</div>
      <div class="gpanel"><div class="ph">Profile</div>
        <div class="pname">ROOTBENDER</div>
        <div class="psub">LVL 50 \u00b7 GRAND GROVE</div>
        <div class="pwr-label">POWER</div><div class="pwr">1560</div>
        ${statRows}
      </div>
      <div class="char-stage">
        <div class="silhouette">\ud83c\udf33</div>
        <div class="disc">ROOT DISCIPLINE<b>Harness the living weave</b></div>
      </div>
      <div class="side">
        <div class="gpanel"><div class="ph">Companions</div>
          <div class="comp"><div class="cthumb">\ud83d\udc09</div><div class="cname">Builder Dragon</div></div>
          <div class="abil"><span>\ud83c\udf3f</span><span>\u2728</span><span>\ud83c\udf31</span></div>
          <div style="height:10px"></div>
          <div class="comp"><div class="cthumb">\ud83d\udc31</div><div class="cname">Water Ocelot</div></div>
          <div class="abil"><span>\u2744</span><span>\ud83d\udca7</span><span>\ud83c\udf0a</span></div>
        </div>
        <div class="gpanel"><div class="ph">Bond \u00b7 Max Rank</div><div class="pips">${pips}</div></div>
        <div class="gpanel"><div class="ph">Resonance</div><div class="hexwheel"><div class="core">\ud83c\udf33</div></div></div>
      </div>
    </div></div>`;
  })(),


  inventory: (() => {
    const cats = ['\u25c6','\ud83c\udf3f','\u2726','\ud83d\udd28','\u2744','\ud83c\udf43','\u2299','\ud83d\udc5d'];
    const items = [
      ['\ud83d\udd37',''],['\ud83d\udfea',''],['\ud83d\udd36',''],['\ud83e\uddea','3'],['\u2728',''],['\ud83c\udf3f','12'],
      ['\u2694\ufe0f',''],['\ud83e\udeb5','4'],['\ud83d\udc1a','7'],['\ud83e\udea8','22'],['\ud83d\udd31',''],['\ud83e\uddf1','48'],
      ['\ud83d\udca0',''],['\ud83e\udd56','9'],['\ud83c\udf56','3'],['\ud83e\uddca','5'],['\u26a1',''],['\ud83c\udf6f','2'],
    ];
    const cell = (it) => it
      ? `<div class="cell"><span class="c2"></span><span class="ico">${it[0]}</span>${it[1]?`<span class="qty">${it[1]}</span>`:''}</div>`
      : `<div class="cell empty"><span class="c2"></span></div>`;
    let grid = '';
    for (let i = 0; i < 36; i++) grid += cell(items[i] || null);
    const sidebar = cats.map((g,i)=>`<div class="cat ${i===0?'active':''}">${g}</div>`).join('');
    return `<div class="content"><h2>Inventory</h2><div class="sub">4 \u00d7 9 grid \u00b7 category filters \u00b7 hover a slot for its genome tooltip</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:18px">
        <div class="cats">${sidebar}</div>
        <div class="invgrid">${grid}</div>
      </div></div>`;
  })(),

  // r208: CRAFTING — sidebar + 3x3 grid + chevron + gold result + station.
  crafting: (() => {
    const cats = ['\u25c6','\ud83c\udf3f','\u2726','\ud83d\udd28','\u2744','\ud83c\udf43','\u2299','\ud83d\udc5d'];
    // the doc's Tidal Blade recipe, slot by slot
    const recipe = ['\ud83d\udd37','\ud83d\udfea','\ud83d\udd36','\ud83e\uddea','\u2728','\ud83c\udf3f','\ud83d\udc1a','\u2694\ufe0f','\ud83d\udd31'];
    const grid = recipe.map(ic=>`<div class="cell"><span class="c2"></span><span class="ico">${ic}</span></div>`).join('');
    const sidebar = cats.map((g,i)=>`<div class="cat ${i===0?'active':''}">${g}</div>`).join('');
    return `<div class="content"><h2>Crafting</h2><div class="sub">3 \u00d7 3 grid \u00b7 result \u00b7 station indicator</div>
      <div class="craft">
        <div class="cats">${sidebar}</div>
        <div class="grid3">${grid}</div>
        <div class="chev">\u00bb\u00bb</div>
        <div class="result-col">
          <div class="result"><span class="ico">\ud83d\udde1\ufe0f</span></div>
          <div class="station" title="Tidal Anvil required">\ud83e\udded</div>
        </div>
      </div>
      <div class="craft-foot"><span class="recipe-name">Tidal Blade</span><span class="hint">Water affinity \u00b7 Tidal Anvil</span></div></div>`;
  })(),
};
const panelEl = document.getElementById('panel');
// ── r210: sliders FEED the page content — deterministic variation ───────
// tune is declared up here (above show/applyContentTint, which read it).
// Cone parallax + tuner below reuse this same object.
const tune = { voidZ: 0.10, glassZ: 0.03, smooth: 0.03 };
// The tuner values + page name are hashed into a reproducible accent
// colour so the content "plays" with the parallax values: same sliders +
// same page => same look, every time; move a slider or switch pages and
// the tint shifts deterministically across the range.
//
// text hash: FNV-1a over the string (stable, fast, well-distributed).
function hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
// colour-max: build an RGB where one channel is driven to MAX by the hash
// (which channel = hash % 3), the other two are damped by the slider
// magnitudes. Returns an [r,g,b] in a cool palette so it stays on-brand.
function colorMax(seedStr, mags) {
  const h = hashStr(seedStr);
  const dom = h % 3;                       // dominant channel
  const t = ((h >>> 3) & 0xff) / 255;      // hue jitter within the channel
  const m = Math.min(1, mags.reduce((a, b) => a + Math.abs(b), 0)); // 0..1 from sliders
  // cool base, push the dominant channel up, damp others by (1 - m*0.5)
  const base = [80, 150, 210];
  const damp = 1 - m * 0.5;
  const out = base.map((c, i) => {
    if (i === dom) return Math.round(Math.min(255, c + 70 + t * 50));
    return Math.round(c * damp);
  });
  return out;
}
let curPage = 'play';
function applyContentTint() {
  const mags = [tune.voidZ, tune.glassZ, tune.smooth * 8];
  const [r, g, b] = colorMax(curPage + ':' + mags.map(v=>v.toFixed(2)).join(','), mags);
  // drive the page's accent + a faint heading wash via CSS vars on #panel
  panelEl.style.setProperty('--accent', `rgb(${r},${g},${b})`);
  panelEl.style.setProperty('--page-wash', `rgba(${r},${g},${b},0.10)`);
}
function show(name){ curPage = name; panelEl.innerHTML = panels[name] || ''; applyContentTint(); }

// ── r210: MORPHING GEOMETRIES (not stutter) ─────────────────────────────
// Operator's spec for the final design: "take all the boxes in the last
// frame and pull/transition the one that was closest to the next UI."
// This is the FLIP technique (First-Last-Invert-Play) applied as a MORPH:
// instead of blurring the whole panel out and resolving the new one in
// (a stutter), we keep continuity by carrying the single outgoing box
// that is geometrically nearest the incoming content into its place.
//
// Algorithm (what the engine will do per panel-swap):
//   1. FIRST  — before the swap, measure the rects of every box in the
//               outgoing frame (panel rows, cells, result slot…).
//   2. swap   — render the new UI; measure the incoming anchor box's rect.
//   3. closest— pick the outgoing box whose centre is nearest the incoming
//               anchor (min Euclidean distance). That box is the "thread"
//               of visual continuity.
//   4. INVERT — set the incoming content's transform so it STARTS at the
//               chosen outgoing box's position+size (translate+scale delta).
//   5. PLAY   — release the transform; it eases to identity, so the new UI
//               appears to grow out of the box you were just looking at,
//               rather than cross-fading.
// In the mockup we do the lightweight version: morph from the nearest box
// rect to the new content with a transform tween (no per-cell choreography
// yet, but the same FIRST→closest→INVERT→PLAY skeleton).
function nearestBoxRect(toRect) {
  // gather candidate boxes from the (still-present) outgoing content
  const boxes = panelEl.querySelectorAll('.content > *, .row, .world, .cell, .result, .tp');
  let best = null, bestD = Infinity;
  const tx = toRect.left + toRect.width / 2, ty = toRect.top + toRect.height / 2;
  boxes.forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    const d = Math.hypot((r.left + r.width/2) - tx, (r.top + r.height/2) - ty);
    if (d < bestD) { bestD = d; best = r; }
  });
  return best;
}
function morphTo(name){
  if (name === curPage) return;
  // 1. FIRST: anchor for the incoming UI is the panel's content origin.
  const panelRect = panelEl.getBoundingClientRect();
  // a representative incoming target near the heading (top-left of content)
  const incoming = { left: panelRect.left + 28, top: panelRect.top + 26, width: 200, height: 28 };
  // 3. closest outgoing box to that incoming anchor (measured pre-swap)
  const from = nearestBoxRect(incoming) || panelRect;
  // 2. swap content
  show(name);
  const content = panelEl.querySelector('.content');
  if (!content) return;
  // 4. INVERT: start the new content at the chosen box's delta
  const now = content.getBoundingClientRect();
  const dx = (from.left + from.width/2) - (now.left + now.width/2);
  const dy = (from.top  + from.height/2) - (now.top  + now.height/2);
  const sx = Math.max(0.6, Math.min(1.4, from.width  / Math.max(1, now.width)));
  const sy = Math.max(0.6, Math.min(1.4, from.height / Math.max(1, now.height)));
  // suppress the default blur-resolve; we're doing a geometric morph
  content.style.animation = 'none';
  content.style.transformOrigin = 'top left';
  content.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
  content.style.opacity = '0.35';
  // 5. PLAY: next frame, ease to identity (long expo-out tail, per the
  //          "increase the decay tails" note)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    content.style.transition = 'transform 620ms cubic-bezier(0.16, 1, 0.3, 1), opacity 360ms ease';
    content.style.transform = 'none';
    content.style.opacity = '1';
  }));
}

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); morphTo(b.dataset.panel);
});
show('play');

// Everything below is presentational polish (parallax, cursor fills, the
// tuner). It's wrapped so that if any of it ever fails on a given browser,
// navigation above still works and the menu remains fully usable.
try {

// ── Mouse-as-cone-anchor parallax (algorithm dev) ───────────────────────
// Model: the cursor is the APEX of a viewing cone — the point the eye-ray
// pierces the screen. The scene is a STACK of layers, each at a fixed
// signed depth z along the view axis:
//     z < 0  → BEHIND the screen (background void)
//     z = 0  → the screen plane itself (the focal plane — does not move)
//     z > 0  → IN FRONT, toward the viewer (foreground glass)
// As the cursor (anchor) moves off centre by `a` px, every layer projects
// through that apex by similar triangles: shift = -a * (z / D), where D is
// the viewer distance. Background (z<0) lags opposite the cursor; near
// layers (z>0) lead with it; the magnitude grows with |z|. One projection,
// one anchor — no per-layer hand-tuned directions, so motion is coherent.
//
// We express each layer's depth as a unitless ratio (z/D). The tuner edits
// these ratios live. (`tune` is declared above, near show().)
// anchor offset from screen centre, in PIXELS (the cone apex displacement)
let aTgt = { x: 0, y: 0 };
let aCur = { x: 0, y: 0 };
const voidEl = document.querySelector('.void');
const glassEls = () => document.querySelectorAll('.glass');

window.addEventListener('pointermove', e => {
  aTgt.x = e.clientX - window.innerWidth  / 2;   // px right of centre
  aTgt.y = e.clientY - window.innerHeight / 2;    // px below centre
});
window.addEventListener('pointerleave', () => { aTgt.x = 0; aTgt.y = 0; });

// project the anchor displacement onto a layer at depth ratio z.
// r210: layers move TOWARD the cursor (operator: "everything is moving
// away... flip your thinking, toward not away"). The cursor is an
// ATTRACTOR — each layer leans toward the apex by its depth ratio. Larger
// z = pulled further toward the cursor. shift = +a * z does this: cursor
// right (a>0) shifts the layer right (toward it), scaled by z.
function projShift(z) {
  return { x: aCur.x * z, y: aCur.y * z };
}

function frame() {
  // smooth the anchor toward the cursor (heavier = more lag/weight)
  aCur.x += (aTgt.x - aCur.x) * tune.smooth;
  aCur.y += (aTgt.y - aCur.y) * tune.smooth;

  // background void: z<0 → projects OPPOSITE the cursor, the largest swim
  const v = projShift(tune.voidZ);
  voidEl.style.setProperty('--px', v.x.toFixed(2) + 'px');
  voidEl.style.setProperty('--py', v.y.toFixed(2) + 'px');

  // foreground glass: z>0 → projects WITH the cursor, gently (translation
  // only; the focal plane is the content, so this stays subtle and stable)
  const g = projShift(tune.glassZ);
  glassEls().forEach(el => {
    el.style.setProperty('--px', g.x.toFixed(2) + 'px');
    el.style.setProperty('--py', g.y.toFixed(2) + 'px');
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// FEEL: voidZ (negative) is the background swim; glassZ (small positive)
// the foreground lead. Equal-and-opposite isn't required — the cone makes
// any z set coherent because they all project from the same apex.

// ── Cursor-driven radial fade-fill on buttons + world rows ──────────────
// Real centerpoint fill: the radial gradient's centre is the cursor's
// position INSIDE the element (not a left-edge shadow), and --fill ramps
// the opacity on enter/leave. Delegated so it covers dynamically-rendered
// rows too.
// Cursor-driven radial fade-fill: JS only updates the gradient CENTRE
// (--mx/--my) to the cursor position inside the element; the grow-in and
// fade are pure CSS :hover (robust across browsers). Delegated so it
// covers dynamically-rendered rows.
function wireFill(selector) {
  document.addEventListener('pointermove', e => {
    const el = e.target.closest(selector);
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', ((e.clientX - r.left) / r.width  * 100) + '%');
    el.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100) + '%');
  });
}
wireFill('.nav button');
wireFill('.world');

// ── Live tuning panel (algorithm dev) ───────────────────────────────────
const tuner = document.createElement('div');
tuner.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:5;font:11px/1.6 monospace;'+
  'background:rgba(10,16,24,.7);backdrop-filter:blur(8px);border:1px solid var(--glass-edge);'+
  'border-radius:10px;padding:12px 14px;color:var(--text-dim);min-width:190px';
tuner.innerHTML = '<div style="color:var(--text);letter-spacing:.1em;margin-bottom:6px">PARALLAX CONE</div>';
// r209: tuner now edits the cone depth ratios (z/D) + smoothing. Ranges
// kept small per the operator's "halve again" — background swim tops out
// modest, foreground lead smaller still.
//   key      label          min    max    step
[['voidZ',  'bg pull (z)',   0.0,  0.17,  0.01],
 ['glassZ', 'fg pull (z)',   0.0,  0.05,  0.005],
 ['smooth', 'smoothing',     0.02, 0.053, 0.003]].forEach(([k,label,min,max,step])=>{
  const id='t_'+k;
  const row=document.createElement('label');
  row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer';
  row.innerHTML=`<span>${label}</span><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${tune[k]}" style="width:90px">`;
  tuner.appendChild(row);
  row.querySelector('input').addEventListener('input', ev => {
    tune[k] = parseFloat(ev.target.value);
    applyContentTint(); // r210: sliders feed the page content's deterministic tint
  });
});
document.body.appendChild(tuner);
} catch (err) {
  console.warn('menu polish disabled (navigation still works):', err);
}

</script>
