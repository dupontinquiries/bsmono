[workspace]
resolver = "2"
members = [
    "model-metadata",
    "raid-content",
    "extract-models",
    "obj-iqm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared release profile: these are batch CLI tools, optimize for throughput.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
