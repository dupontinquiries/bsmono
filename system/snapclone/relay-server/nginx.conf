# SnapClone relay — nginx TLS termination config
# Drop this in /etc/nginx/sites-available/snapclone and symlink to sites-enabled.
# Assumes: certbot certificate at /etc/letsencrypt/live/YOUR_DOMAIN/
#          relay.js running on localhost:9900 (plain ws://)
#
# With this config clients use:
#   wss://YOUR_DOMAIN/relay/TOKEN
# and relay.js stays plain ws:// internally.

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # WebSocket upgrade
    location /relay/ {
        proxy_pass         http://127.0.0.1:9900;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 120s;
    }

    # Health check
    location / {
        proxy_pass http://127.0.0.1:9900;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}
