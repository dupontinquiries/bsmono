[package]
name = "photosync-system"
version = "0.2.0"
edition = "2021"
authors = ["PhotoSync Contributors"]
description = "High-compression photo sync with deduplication and content-defined chunking"
license = "MIT OR Apache-2.0"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
zstd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
image = "0.24"
rayon = "1.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"
walkdir = "2.4"
notify = "6.1"

# Optional dependencies for features
tokio = { version = "1.35", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }

[features]
default = ["content-defined-chunking"]

# Chunking strategies
content-defined-chunking = []
fixed-chunking = []

# Sync methods
websocket-sync = ["tokio", "tokio-tungstenite", "futures-util"]

# Future features (gated)
video-recording = []
raw-support = []
ai-features = []
qr-scanner = []
cloud-sync = []
exif-full = []

# Convenience feature sets
minimal = []
full = [
    "websocket-sync",
    "video-recording",
    "raw-support",
    "exif-full",
    "qr-scanner"
]

[lib]
name = "photosync"
path = "src/lib.rs"

[[bin]]
name = "photosync-daemon"
path = "src/daemon.rs"

[[bin]]
name = "photosync-cli"
path = "src/cli.rs"

[[bin]]
name = "photosync-sync-server"
path = "src/sync_server.rs"
required-features = ["websocket-sync"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
