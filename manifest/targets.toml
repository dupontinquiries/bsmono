# Cross-compilation targets. Referenced by manifest/projects.toml `targets`.
# IMPORTANT: the build HOST is aarch64 (Asahi), so x86 and riscv are CROSS
# targets (need `cross`/sysroots) — no x86 hardware is owned. Page sizes differ
# between the aarch64 desktop (16K, Asahi) and the aarch64 phone (~4K,
# pmOS/Alpine); avoid hardcoded page-size assumptions across them.

[targets.desktop]
triple = "aarch64-unknown-linux-gnu"
description = "Primary build host: Apple Silicon laptop/desktop via Asahi Linux"
flatpak_arch = "aarch64"
notes = "16K page size (Asahi); native on the user's machine"

[targets.phone]
triple = "aarch64-unknown-linux-musl"
description = "Fairphone 5 fleet — postmarketOS / Alpine, aarch64"
flatpak_arch = "aarch64"
notes = "musl, ~4K pages (was incorrectly aarch64-gnu before)"

[targets.x86]
triple = "x86_64-unknown-linux-gnu"
description = "Playtesters / users without aarch64 — games must build here"
flatpak_arch = "x86_64"
notes = "CROSS from the aarch64 host — needs cross/sysroot"

[targets.alpine]
triple = "x86_64-unknown-linux-musl"
description = "Alpine-on-server (static musl); confirm still x86 vs aarch64"
flatpak_arch = "x86_64"
notes = "server/cloud; no flatpak"

# Future:
[targets.riscv]
triple = "riscv64gc-unknown-linux-gnu"
description = "RISC-V (future, games) — cross only"
flatpak_arch = "riscv64"
notes = "aspirational; toolchain + sysroot needed"
