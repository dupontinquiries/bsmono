notes = "kBM3 GAN/vocoder audio-model project. NOTE the layout: there is no Cargo.toml at the project root — the cargo crate is at gpu/ (burn 0.21 + wgpu, bins: main/vocoder/population), so build with `cd tools/kbm3/gpu && cargo build --release`, which is why this is filed python+rust rather than cargo (a cargo-kind entry would make build.sh --run cd to the wrong directory). Python side: pipeline/ (gan-zai v5.x trainers), vocoder/, explorer/ (spectrogram browser + server.py). The 2026-07-26 drop added the RpGAN relativistic pairing loss (--loss rpgan) on both the Rust and Python sides, R1/R2 penalties with lazy regularization on the Python side only (Burn has no second-order gradients), and turned on Burn's fusion + autotune with an opt-in `spirv` feature. `rustcheck --fast` passes. NOT compiled in-sandbox: burn's dependency graph pulls edition-2024 crates, which need a newer cargo than Ubuntu's 1.75."

