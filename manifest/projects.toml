# Per-project metadata. Drives the build orchestrator and Flatpak CI.
# kind:    cargo | hybrid (cargo+cmake/C++) | cmake | python+rust
# role:    app | daemon | app+daemon | service | tool | vendored-lib
# flatpak: true | false | partial   (partial = only one component ships)
# runtime: kde | gnome | freedesktop | none | tbd   (Flatpak runtime)
# targets: subset of manifest/targets.toml ids; "all" = every linux target

[apps.voiceterm]
path = "apps/voiceterm"
kind = "cargo"            # qmetaobject cdylib (Rust↔Qt, not Rust↔C++)
role = "app"
daemon = false
flatpak = true
runtime = "kde"
targets = ["desktop", "phone"]
notes = "QML voice app; pulseaudio; android via build-android.sh; QtState pattern"

[apps.hatch-egui]
path = "apps/hatch/egui-frontend"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"          # pure egui/glow (wayland/x11); icon decode via image+resvg is the only extra weight
targets = ["desktop", "phone"]
primary = true            # the egui shell over crates/hatch-core; the QML plasmoid in apps/hatch/qml is the Plasma-native surface, installed with kpackagetool6, not built here
notes = "fullscreen app launcher: hatch-core (std-only: .desktop scan, Exec spawn, icon-theme resolve, fuzzy rank, favorites/recents via config-kit) under an egui grid shell. Single-instance with a poke-file toggle so a global shortcut summons the running window (`hatch-egui --toggle`). `svg` feature (default on) pulls resvg for breeze system icons; drop it for a min-size musl build and svg-only icons fall back to letter tiles."

