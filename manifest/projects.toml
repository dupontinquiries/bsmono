# --- games (new tier; consolidated from apps/ duplicates — keeping the larger games/ trees) ---
[games.unendlich]
path = "games/unendlich"
kind = "cargo"
role = "app"
daemon = false
flatpak = true
runtime = "freedesktop"
targets = ["desktop", "phone", "x86"]
notes = "voxel GPU engine; Vulkan (--device=dri); large download; shaders+assets. A workspace root with no [package] of its own — several benchmark/probe bins (perf-probe, gpu-mesh-bench, octree-bench, …) live alongside the real game, which is a DIFFERENTLY NAMED bin: `cargo build --release --bin unendlich-fullgame --features render,window,ui-overlay` (NOT `--bin unendlich` — that matches none of the workspace's bin targets)."

[games.paperbound]
path = "games/paperbound"
kind = "python"          # pygame-ce; not a cargo build — needs a python build lane in the orchestrator
role = "app"
daemon = false
flatpak = false
runtime = "none"
targets = []
notes = "origami lane-battler (pygame-ce); 30 cards/9 arenas/LAN lockstep; consolidated from paperbound drop (was a 2-file stub in apps/)"

[games.paperbound-core]
path = "games/paperbound/rust/paperbound-core"
kind = "cargo"
role = "lib"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop", "x86"]
notes = "Rust port of paperbound's gamemodes and tooling: data/tech/economy (sim), live RTS matches with the four faction mechanics (match_sim), the clawbound-facet papercraft renderer with std-only PNG out (render), self-playing skirmishes (skirmish + bin), the base lane-battler mode with the shipped MODES table (battler), single-elim tournaments where every match is actually fought (tournament + bin), and a headless data editor whose validator encodes every match-start crash the project has shipped and fixed (editor + pbedit bin). Kit integration: cli-kit (all binaries), config-kit (pbedit XDG config/backups), net-kit (lan_skirmish: token-authenticated TCP lockstep with desync-detecting state hashes). Bins: skirmish, tournament, pbedit (incl. interactive shell — the UI seam an egui front drives later per UI_STRATEGY.md), lan_skirmish. Origami slice: units render as their actual folded card models from cards.json/parts.json (full builtin+JSON part vocabulary incl. the wizard outfit rack). 42 tests, all against the real game data at games/paperbound."

