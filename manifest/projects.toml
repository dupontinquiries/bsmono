# --- games (new tier; consolidated from apps/ duplicates — keeping the larger games/ trees) ---
[games.clawbound]
path = "games/clawbound"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop"]
notes = "papercraft stalk/hide/chase game (Rust + wgpu22; Vulkan/Metal/WebGPU). Deterministic logic lives in lib.rs; the default bin renders offscreen→PNG headless (CI-safe: `cargo run --release -- out.png MODE TOD`), the live window is `--features app -- --play`. Modes: world/map/goals/poses/seq/senses/wildlife/game/prowl/capture + the open-world clan-founding sim (openworld.rs, season-tick deterministic). IN-SANDBOX BUILD (cargo 1.75): sed the lockfile `version = 4`→`3`, then pin `image 0.25.1`, `proc-macro-crate 3.1.0`, `indexmap 2.2.6` to drop the edition-2024 chains — full test suite then runs (206+ green)."

