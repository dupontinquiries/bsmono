# Per-project metadata. Drives the build orchestrator and Flatpak CI.
# kind:    cargo | hybrid (cargo+cmake/C++) | cmake | python+rust
# role:    app | daemon | app+daemon | service | tool | vendored-lib
# flatpak: true | false | partial   (partial = only one component ships)
# runtime: kde | gnome | freedesktop | none | tbd   (Flatpak runtime)
# targets: subset of manifest/targets.toml ids; "all" = every linux target


[apps.voiceterm]
path = "apps/voiceterm"
kind = "cargo"            # qmetaobject cdylib (Rust↔Qt, not Rust↔C++)
role = "app"
daemon = false
flatpak = true
runtime = "kde"
targets = ["desktop", "phone"]
notes = "QML voice app; pulseaudio; android via build-android.sh; QtState pattern"

[apps.snapclone-egui]
path = "apps/snapclone/egui-frontend"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"          # pure egui/glow (wayland/x11), same convention as the other -egui apps
targets = ["desktop"]
notes = "the founding egui app for the uikit-egui patterns (live backgrounds, page/subpage nav originated here) — not a Qt/GTK port, so it uses the shared default palette rather than a bespoke one. `cargo build --release` produces the deployable `snapclone-egui` bin directly (the `app` feature is default-on). The C++ camera/peer engine (src/, cmake/) is the separate on-device native app; this is the egui reference/demo surface."

[apps.bot-arena-egui]
path = "apps/bot-arena/egui-frontend"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"          # pure egui/glow (wayland/x11) — no GTK runtime, same convention as rusty-board-egui
targets = ["desktop"]
notes = "the egui-primary port of bot-arena (GTK4/libadwaita dashboard) — see UI_STRATEGY.md. Defaults to the Arena palette, matching main.rs's real .bot-* CSS status colours (idle/running/pass/fail/spawn), not fsm.rs's separate SVG-diagram colour scheme. `cargo build --release` produces the deployable `bot-arena-egui` bin directly (the `app` feature is default-on); the GTK4 original stays the parity reference."

[apps.bo-suite-egui]
path = "apps/bo-suite/egui-frontend"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"          # pure egui/glow (wayland/x11) — no Qt runtime, same convention as rusty-board-egui
targets = ["desktop"]
notes = "the egui-primary port of bo-controller (Qt/QML B&O ambient audio panel) — see UI_STRATEGY.md. Defaults to the Amber palette (warm gold) matching the Qt surface. `cargo build --release` produces the deployable `bo-suite-egui` bin directly (the `app` feature is default-on); the Qt/QML original stays the parity reference. Compact-width layout uses the vertical-tabs sidebar (not a whole-surface swipe) since the Devices view's volume sliders would otherwise race a page-swipe gesture for the same drag."

