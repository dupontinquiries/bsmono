[apps.settings-egui]
path = "apps/settings/egui-frontend"
kind = "cargo"
role = "lib"              # a WIDGET LIBRARY, not a deployable app
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop"]
primary = true            # the egui port is the intended build
notes = "the egui settings editor, embedded by other frontends rather than run on its own — which is why it has no [[bin]] and no `app` feature, unlike every other egui port. It was missing from this manifest entirely, so it could never appear in gitmind's catalogue; role=\"lib\" is the honest description rather than giving it a binary it does not need."

[apps.krapper-egui]
path = "apps/krapper/egui-frontend"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop"]
primary = true            # the egui port is the intended build
notes = "the egui port of krapper (an iced app). krapper had NO egui build at all and the parity audit never noticed, because it looks for an egui-frontend/ directory and krapper has one src/ with main.rs calling iced::application. vibe.rs, scale.rs, vocab.rs and dict.rs are iced-free, so the port mounts the model by #[path] and carries only the surface: the stress ruler, the hot-mic meter, and blurb suggestions filtered to what still fits the bar."

[apps.ambient-learner-egui]
path = "apps/ambient-learner/egui-frontend"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop", "phone"]
primary = true
notes = "the egui port of ambient-learner. A SEPARATE CRATE rather than a feature of the parent: iced 0.12 caps web-sys below what eframe 0.34 needs, and cargo resolves optional dependencies whether or not their feature is on, so an eframe binary in the parent fails to RESOLVE even with iced disabled. The view code is not copied — one #[path] include pulls in src/egui_lib.rs and its page tree. Live and History pages are ported; Locations, Map, Model and Sync are not."

# ── daemons ──────────────────────────────────────────────────────────────────
#
# These four existed in apps/ with working Cargo manifests and NO entry here, so
# gitmind — which builds from this file — could not build them. All four compile
# clean; the only thing missing was the registration. `role = "daemon"` and
# `daemon = true` so a build that wants services picks them up without having to
# know their names.

[apps.sharemd]
path = "apps/sharemd"
kind = "cargo"
role = "daemon"
daemon = true
flatpak = false
runtime = "none"
targets = ["desktop", "phone"]
notes = "the cross-app data-share daemon. Binds the `share` socket and serves datashare-core's Hub: namespaced key/value with pub-sub, so shared state (contacts, sessions, now-playing, handoff) lives once. Apps reach it through ipc-kit and fall back to private state when it is not running, which is why nothing breaks when it is missing — and why its absence from this manifest went unnoticed."

[apps.settingsd]
path = "apps/settingsd"
kind = "cargo"
role = "daemon"
daemon = true
flatpak = false
runtime = "none"
targets = ["desktop", "phone"]
notes = "the persistent settings daemon. Serves the cross-app `settings` namespace and, unlike sharemd, PERSISTS every change to ~/.config/gitmind/settings.conf through config-kit, so preferences survive a restart. Seeds defaults from settings-kit on first run. settings-app publishes here; every egui-kit app subscribes."

[apps.voiced]
path = "apps/voiced"
kind = "cargo"
role = "daemon"
daemon = true
flatpak = false
runtime = "none"
targets = ["desktop", "phone"]
notes = "the unified voice daemon. Binds the `voiced` socket and owns intent routing via voiced-core's Registry: apps register intent types at Always/Active scope, the compositor reports focus, and utterances are routed to whoever is entitled to them. This is the arbitration voiceterm's own mic work stops short of — that is about hardware and pipelines, this is about which APP gets the intent."

[apps.coordd]
path = "apps/coordd"
kind = "cargo"
role = "daemon"
daemon = true
flatpak = false
runtime = "none"
targets = ["desktop", "phone"]
notes = "the coordination daemon. Binds the `coord` socket and serves coord-core's Arbiter: apps claim and release shared resources with a priority and a mode, and announce activity that is relayed to interested apps. The obvious consumer is the microphone — snapclone in a call and voiceterm listening for commands are exactly the contention this exists to settle."

# ── apps that were also missing ───────────────────────────────────────────────

[apps.settings-app]
path = "apps/settings-app"
kind = "cargo"
role = "app"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop", "phone"]
primary = true            # the egui SettingsEditor is the only front end there is
notes = "the central settings app for the egui-kit apps: a shared SettingsEditor on uikit-egui, plus two front ends onto settingsd — the `bsettings` GUI and the `bsettings-cli` command line. Both read current Prefs from the daemon and publish changes to the `settings` namespace so every app updates live. Uses settings-kit for schema/diff and bigsilicon-client for the daemon link."

[apps.beatspace]
path = "apps/beatspace"
kind = "cargo"
role = "tool"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop"]
notes = "a Rust port of the kBM3 mel-spectrogram GAN. A tool rather than a shipped app. NOTE: needs libasound2-dev — `cargo check` fails in alsa-sys's build script without it, which is a host requirement rather than a code fault. Registered anyway so the dependency is discoverable from here instead of on first build."

[apps.av1tuner-m1]
path = "apps/av1tuner-m1"
kind = "cargo"
role = "tool"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop"]
notes = "the M1 variant of av1tuner. Registered alongside av1tuner, which was already listed — the pair had drifted, with only one of them known to the build."

[apps.echelon]
path = "games/echelon"
kind = "cargo"
role = "game"
daemon = false
flatpak = false
runtime = "none"
targets = ["desktop"]
notes = "deterministic 1v1 RTS in Rust: the M0 simulation core, a headless match runner with scripted macro bots for all three races, and the transport-agnostic lockstep session layer (M2), proven by running two clients in-process with zero desyncs. NO ENGINE DEPENDENCIES — serde + ron only — and pinned to rustc 1.75 so it builds on distro toolchains, the same convention as bot-arena. `client/` is workspace-EXCLUDED because it pulls Bevy; the sim workspace builds without it. Imported as a source snapshot: the tarball carried no .git, and the incremental bundle for the same drop could not be applied (see maintenance/ECHELON_M0_02_BLOCKED.md)."

# --- games registered after an audit found them buildable but unlisted --------
# Found by checking every directory with a Cargo.toml against every section of
# this file. The four apps the same check flagged were FALSE POSITIVES — they
# are registered against their `egui-frontend/` subdirectory rather than their
# root, which is correct and which my check did not understand. These four are
# real: two of them arrived through imports I made and I never registered them,
# so check-features.sh and any build-everything sweep have been skipping them.

[games.blackstar-rs]
path = "games/blackstar-rs"
kind = "cargo"
role = "game"
notes = "The Rust blackstar on the skydribble engine — raid, loot, damage, patrol, procgen, dispatch, ballistics. Self-contained: references nothing in games/blackstar and carries its own assets. Needs libasound2-dev to link, so it does not build in the CI container."

[games.skydribble]
path = "games/skydribble"
kind = "cargo"
role = "game"
notes = "Air-dribble playground, Rust + wgpu. Shares an engine with blackstar-rs and NO git history with it, so engine improvements move between them by port rather than merge — see games/ENGINE_SHARING.md. Also needs libasound2-dev."

[games.bsgames]
path = "games/bsgames"
kind = "cargo"
role = "game"
notes = "The game centre: profiles, presence, launch kinds, and the cross-game tournament host built on shared/netcode (brackets, lobbies, attested results)."

[games.road-warrior]
path = "games/road-warrior"
kind = "cargo"
role = "game"
targets = ["desktop", "phone"]
notes = "Side-view combat racer, from-scratch Rust (not a port — the 2014 original is closed-source). Two-crate workspace: `core` is headless (physics, terrain, boss AI, level data, save, campaign) with zero rendering deps and 60 tests that run in a sandbox; `shell` is eframe/egui + wgpu + zbus. Build `-p road_warrior_core` to verify anything in CI; `-p shell` needs a GPU and a display. Gyro flip control reads net.hadess.SensorProxy over D-Bus — a THIRD accelerometer surface in this tree beside shared/sensor-kit (monitor-sensor events) and voiceterm's iio_accel (sysfs in_accel_*_raw); a sensor-source kit is the obvious lift and has not been attempted. gyro.rs has never run against a live iio-sensor-proxy, only its failure path."

[games.soldier]
path = "games/soldier"
kind = "cargo"
role = "game"

[shared.bsweb]
path = "games/shared/bsweb"
kind = "cargo"
role = "library"
notes = "Reader for the BSWEB parts-web format — geometry stored once, referenced by placements, annotated with harvest categories and inferred material properties. Dependency-free like netcode so both the C-adjacent Rust tools and blackstar-rs can link it without pulling serde or a zlib crate into their graphs. Callers pass already-decompressed bytes; an engine has a decompressor already."

[shared.dht-kit]
path = "shared/dht-kit"
kind = "cargo"
role = "library"
notes = "OpenDHT-compatible messaging in Rust: the wire format alone — msgpack query/reply/push/error maps, 160-bit InfoHash, values with per-value ids, IPv4 node entries. No transport, no routing table, no engine, no dependencies. The protocol layer snapcore lacks and snapclone-dht had buried in an app crate; the seam that lets any engine in the fleet speak the reference's format."

[shared.nat-kit]
path = "shared/nat-kit"
kind = "cargo"
role = "library"
notes = "STUN (RFC 5389) messaging: binding request/success/error, XOR-MAPPED-ADDRESS for v4 and v6, MAPPED-ADDRESS for older servers. Codec only — no sockets, no async, no randomness (the caller supplies the transaction id), no dependencies. The NAT-discovery counterpart to dht-kit; snapclone-nat has the same protocol but drags in tokio, anyhow, bytes, rand and tracing."

[shared.wake-kit]
path = "shared/wake-kit"
kind = "cargo"
role = "library"
notes = "Spend less radio: coalesce Background periodic work into device-offset wake windows so a 20s and a 60s job share one modem wake-up, and decide when a payload is worth compressing. Policy only — no timers, no sockets, no compressor, no dependencies. Generalises snapcore::schedule, which does the same for DHT maintenance alone."

[apps.snapclone-presence]
path = "apps/snapclone/rust/snapclone-presence"
kind = "cargo"
role = "library"
notes = "What snapclone puts IN a DHT rather than a DHT: sc-ID identity, presence records and their keys, gossip peer discovery, and the announce record. Extracted from snapclone-dht, whose other 1,062 lines duplicated snapcore and dht-kit. Depends on dht-kit for types only — it builds records, something else puts them on a socket."

[apps.tadpole]
path = "apps/tadpole/egui-frontend"
kind = "cargo"
role = "app"
daemon = false
runtime = "egui"
targets = ["desktop", "mobile"]
notes = "Image to text, all Rust — a Frog-shaped OCR app on egui with touch support. Built around REGIONS rather than a text blob, because PP-OCRv5-style backends return per-box confidence and rendering that as one text area throws away what the newer model is better at. The engine is a trait: rusto-rs today, a stub in tests, something else later."

[shared.cleanup-kit]
path = "shared/cleanup-kit"
kind = "cargo"
role = "library"
notes = "Clean up with AI, shared by voiceterm, logscope and tadpole. Finds a small local GGUF in ~/models, describes the job, and returns a PROPOSAL the user accepts or rejects — never a silent rewrite. Ranks Gemma 4 E-series first for structured output on phone-class hardware, then Qwen3.5, Phi-4-mini, Llama 3.2. Backends plug in behind a trait: llama.cpp preferred, logscope's wgpu engine as the fallback that works where the C toolchain does not build."

[tools.astfind]
path = "tools/astfind"
kind = "cargo"
role = "library"
notes = "fzf-like search over the monorepo's Rust items: find a function, read its doc comment, list its call sites. fzf's scoring model ported with its tuning relationships intact. Line-wise rather than syn, so a file that does not compile still indexes — which is when you most want to search. Ratatui shell and the optional wgpu/ollama analysis pass are separate layers over this core."

[shared.hover-kit]
path = "shared/hover-kit"
kind = "cargo"
role = "library"
notes = "Hover gating and pointer synthesis for phone-class sensors. A phone proximity sensor is one bit at 5cm, not a rangefinder — so it gates WHEN the camera runs and vision decides WHERE. Pure policy, no sysfs or camera, testable without the hardware."

[shared.hand-kit]
path = "shared/hand-kit"
kind = "cargo"
role = "library"
notes = "Hand-gesture taxonomy and evaluation harness over a labelled capture set from a real Fairphone. Parses the filename label convention into typed poses so a detector is scored against device truth rather than a benchmark shot on other hardware. No model, no image decoding."

[shared.light-kit]
path = "shared/light-kit"
kind = "cargo"
role = "library"
notes = "Ambient-light policy: cover detection from differentials (pairs with hover-kit's proximity gate), a brightness PID in perceptual space with anti-windup, derivative-on-measurement, a deadband and asymmetric slew, plus adaptive white point and theme tinting capped at the fleet's 0.18 contrast ceiling. No sysfs, no rendering."

[shared.ink-kit]
path = "shared/ink-kit"
kind = "cargo"
role = "library"
notes = "Headless freehand-ink engine: stroke capture with pressure, one-euro smoothing, RDP simplification, an f64 infinite canvas camera, spatial-indexed undo, and a pointer router that partitions contacts between inking and touchkit navigation without changing touchkit's frame-driven contract. std-only, no deps — same rationale as touchkit, so it cross-compiles to the phone targets."

[apps.snapshot-cam]
path = "apps/snapshot-cam"
kind = "cargo"
role = "app"
daemon = false
notes = "A local camera. Captures land on this device and go nowhere until the user picks a target: photosync (their own machines, content-addressed) or a snapclone contact (a person, not recallable). The two are kept distinct in the type system because collapsing them is how a backup becomes a disclosure. Headless core + eframe shell, so the sharing rules test without a camera."

[apps.dialer]
path = "apps/dialer"
kind = "cargo"
role = "app"
daemon = false
flatpak = false             # a phone app wants the system bus + modem; Flatpak later if ever
runtime = "none"            # pure egui/glow (wayland/x11), same convention as the other -egui apps
targets = ["desktop", "phone"]
primary = true              # egui-first from birth; no Qt/GTK surface exists to archive
notes = "phone calls over ModemManager (zbus blocking, poll loop) with a simulated-modem fallback for desktop/demo, plus a Matrix signalling backend (incoming m.call.invite rings, decline sends m.call.hangup; no media engine yet) on the same Command/Event link. Setup wizard: carrier APN suggestion from mobile-broadband-provider-info (system XML > downloaded XML > builtin snapshot) keyed by the modem's OperatorCode, applied as a NetworkManager GSM connection over D-Bus; Matrix sign-in with .well-known discovery. Headless dialer-core (19 unit tests) under crates/, dialer-egui on uikit-egui. `cargo build --release -p dialer-egui` = deployable bin (`app`+`mm`+`matrix` default-on); features peel off individually."
