[package]
name = "tinypack-kit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fit the most into a tiny fixed byte budget (NFC tag, DHT value, QR): a static-vocabulary token codec for short text that beats deflate on messages under ~1 KB and never expands, an adaptive binary arithmetic coder, and a headerless 8x8-DCT image codec that binary-searches its quantiser to land under a budget. Zero dependencies; the CLI speaks PGM/PPM, PNG is a feature."

[lib]
path = "src/lib.rs"

[[bin]]
name = "tinypack"
path = "src/bin/tinypack.rs"
required-features = ["std"]

[features]
# `std` on by default: the phone-side codecs (text, image) and the CLI need it.
# Turn it off (`--no-default-features`) to build the no_std carry layer
# (huffman, bac, drop, ledger) for microcontroller anchors and device-carriers.
default = ["std"]
std = []
# PNG read/write for the CLI. Implies std. Off by default so the kit stays dependency-free.
png = ["dep:png", "std"]

[dependencies]
png = { version = "0.17", optional = true }

[profile.release]
opt-level = 3
