[package]
name = "vidkit-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "egui front end for vidkit: a Presenter on an egui texture, and a letterboxed video surface with uikit-egui chrome."

[dependencies]
vidkit-core = { path = "../vidkit-core" }
# For clipboard URL classification in the palette.
vidkit-ytdlp = { path = "../vidkit-ytdlp" }
# Chapter, Hit and Section for the sections panel. Pure, no dependencies.
vidkit-relevance = { path = "../vidkit-relevance" }
# The voice grammar/matcher, rather than a second one here.
voiced-core = { path = "../../../voiced-core" }
egui = "0.34"
# dlopen of the libEGL eframe already loaded, mmap/fstat for dma-bufs
# (glow-upload only).
libc = { version = "0.2", optional = true }

# shared/uikit is a separate nested workspace; a path dependency across the two
# is fine and is how the rest of this tree reaches its kits.
uikit-egui = { path = "../../../uikit/crates/uikit-egui" }
uikit-gesture = { path = "../../../uikit/crates/uikit-gesture" }
snapclone-theme = { path = "../../../uikit/crates/snapclone-theme" }
# Backends are NOT named here -- see scene-kit/uikit-egui for the same fix. A
# library that hardcodes both silently overrides the app's choice through
# feature unification, which on static musl means a binary that dlopens
# libwayland at startup and dies with NoWaylandLib.
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow"] }

# Off by default so `cargo test` stays light and headless, matching uikit-egui.
# Backend named explicitly: eframe 0.34's defaults select wgpu, whose default
# device descriptor asks for max_color_attachments 8 and dies at startup on a
# GPU that allows 5 -- logscope-egui records exactly that crash on Asahi, which
# is one of this crate's target platforms. See
# maintenance/tools/eframe_backend_check.py.

[dev-dependencies]
# A BACKEND FOR THIS CRATE'S `demo` EXAMPLE, and only for it.
#
# Here it is the example, not the tests: eframe is optional and off by default,
# so the unit tests never compile winit. But `--features demo` enables eframe to
# run the `video_demo` example, which needs a window -- and examples, unlike
# binaries, receive dev-dependencies.
#
# The normal `eframe` dependency above names no windowing backend, on purpose:
# a library that names one forces it onto every app through feature
# unification (see 70895dc53 -- voiceterm on static musl could not exclude
# Wayland). But built STANDALONE, eframe with no backend makes winit refuse to
# compile ("platform not supported"), so a standalone demo build broke.
#
# That standalone break was fixed once before (097fe78aa9, by putting the
# backends on the normal dependency) and then UNDONE by 70895dc53, which moved
# them off again without reading that history. Both goals are right; they
# only collided because they shared one line.
#
# A dev-dependency serves both. It is active when THIS crate's tests build,
# and is never passed on to crates that depend on this one -- so apps still
# choose their own backend, and this crate still builds alone.
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }
# The cross-crate pipeline test drives the real demuxer through the real
# player; `fixtures` exposes the same MP4 writer the demuxer's own tests use.
vidkit-mp4 = { path = "../vidkit-mp4", features = ["fixtures"] }
vidkit-webm = { path = "../vidkit-webm", features = ["fixtures"] }

[features]
demo = ["dep:eframe"]
# NV12 upload + shader conversion through an egui_glow paint callback. Needs
# eframe for its glow/egui_glow re-exports, same as scene-kit's `glow` feature.
glow-upload = ["dep:eframe", "dep:libc"]

[[example]]
name = "video_demo"
required-features = ["demo"]
