[package]
name = "scene-kit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The physical-UI scene renderer, lifted from logscope-egui: mesh3d scene assembly, gpuscene camera/pack/GLSL (triplanar materials, shadow map, post pass), the glow/egui PaintCallback embedding, textsurface (which shapes can carry words), and — new at extraction — per-vertex UVs (12→14 floats), an inscription material (MAT_INSCRIPTION samples a page texture by UV, so words sit ON a face instead of floating), a wired u_touch proximity response, and a font8x8 page rasterizer. See docs/physical-ui-findings.md in logscope for the brief this implements."

[features]
default = ["glow"]
# The egui/eframe glow embedding (glow_scene). Off = pure-data core for headless tests.
glow = ["dep:eframe"]

[dependencies]
# Dependency-free maths; `mesh3d::sun_clock_at` delegates to its `daylight`.
math-kit = { path = "../math-kit" }
egui = "0.34"
noise-kit = { path = "../noise-kit" }
font8x8 = "0.3"
# Backends are NOT named here. `wayland` and `x11` were both hardcoded, and
# because cargo unifies features across the graph that silently overrode the
# app's choice -- voiceterm asking for x11 only still got wayland linked, which
# on static musl is a binary that dlopens libwayland at startup and dies with
# NoWaylandLib.
#
# A library crate has no business choosing the display server. The APP picks,
# via its own `eframe?/x11` / `eframe?/wayland` features; anything that needs
# both says so itself.
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow"] }

[workspace]
