[package]
name = "uikit-egui"
version = "0.1.0"
edition = "2021"
description = "The shared egui UI kit: logscope's carved-material widget surface (Skin L4 + carved painters L2), snapclone's TwoTierGesture wired to egui::InputState, and a snapclone-theme -> egui Visuals bridge. The substrate every app's egui front-end builds on."
license = "MIT OR Apache-2.0"

# What this crate IS, and why it sits in shared/:
#   · L4 Skin tokens + L2 carved painters are ported from
#     apps/logscope/crates/logscope-egui/src/theme.rs (the "carved material"
#     look) — generalized so it is no longer logscope-private.
#   · GestureLayer adapts egui::InputState (pointer drag + scroll) to
#     uikit-gesture::TwoTierGesture, so the FP5-tuned swipe feel works in any
#     egui app with no per-app gesture code.
#   · theme_bridge maps snapclone-theme::Palette -> egui::Visuals so the 9
#     palettes (Dark = the SnapClone look) drive egui directly.
#
# Consumers: apps/snapclone-egui (the port), and — as a reverse-port — a touch
# layer for apps/logscope (see examples/logscope_touch.rs).

[dependencies]
# Dependency-free maths. `lux::sky_at` delegates to `math_kit::daylight` so the
# panels, scene-kit and logscope all read ONE sun curve — see that module.
math-kit = { path = "../../../math-kit" }
# tideshell's living palette on the wire; zero dependencies. The mapping to
# PaletteColors lives here (theme_bridge::ambient) so the shell writing it and
# every app reading it share one definition.
ambient-palette = { path = "../../../ambient-palette" }
qrcodegen = { version = "1.8", optional = true }
voice-engine-kit = { path = "../../../voice-engine-kit", optional = true, features = ["voice"] }
touchkit = { path = "../../../touchkit", features = ["egui"] }
# `glow` alone leaves winit with NO Linux backend compiled, so the `demo`
# feature failed to build anywhere on Linux with "The platform you're compiling
# for is not supported by winit" — not a sandbox limitation, since the error is
# a cfg check rather than a missing system library. Off by default, so no
# ordinary build ever touched it and nothing noticed. scene-kit, krapper and
# voiceterm's frontend all already spell it "glow", "wayland", "x11"; this was
# the outlier. Found by feature_sweep.sh, which is the reason that tool checks
# non-default features.
# Backends are NOT named here. `wayland` and `x11` were both hardcoded, and
# because cargo unifies features across the graph that silently overrode the
# app's choice -- voiceterm asking for x11 only still got wayland linked, which
# on static musl is a binary that dlopens libwayland at startup and dies with
# NoWaylandLib.
#
# A library crate has no business choosing the display server. The APP picks,
# via its own `eframe?/x11` / `eframe?/wayland` features; anything that needs
# both says so itself.
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow"] }
egui = "0.34"
uikit-gesture = { path = "../uikit-gesture" }

# snapclone-theme already advertises egui compatibility in its own docs
# ("compatible with egui Color32::from_hex"); we consume it directly rather
# than re-defining colors.
snapclone-theme = { path = "../snapclone-theme" }
settings-kit = { path = "../../../settings-kit" }

[features]
# Runnable eframe demos (examples/); off by default so `cargo test` stays light + headless.
demo = ["dep:eframe"]
# A REAL QR encoder (`qrbig`): Nayuki's qrcodegen, no deps of its own. Off by default — the
# identicon in `qr` is dependency-free and most apps only need that; an app that shares
# data (voiceterm's zettelkasten) turns this on.
qrbig = ["dep:qrcodegen"]
# The voice popup (voice_popup.rs) and its Ctrl+P-style tap/hold trigger
# (ctrl_p_gesture.rs, unconditional -- see below). Off by default: pulls in
# voice-engine-kit's whisper-rs/cpal, a real dependency cost most apps
# using this kit have no use for. An app that wants voice (voiceterm-egui,
# first) turns this on. `features = ["voice"]` is forwarded unconditionally
# rather than left for the consumer to also enable -- the popup calling
# voice-engine-kit's capture/transcribe functions with that feature OFF
# would just silently do nothing (they compile to no-ops), which is a
# worse failure mode than one crate forwarding the feature it actually
# needs to function.
voice-popup = ["dep:voice-engine-kit"]

[[example]]
name = "logscope_touch"
required-features = ["demo"]

[dev-dependencies]
# A BACKEND FOR THIS CRATE'S `demo` EXAMPLE, and only for it.
#
# Here it is the example, not the tests: eframe is optional and off by default,
# so the unit tests never compile winit. But `--features demo` enables eframe to
# run the `logscope_touch` example, which needs a window -- and examples, unlike
# binaries, receive dev-dependencies.
#
# The normal `eframe` dependency above names no windowing backend, on purpose:
# a library that names one forces it onto every app through feature
# unification (see 70895dc53 -- voiceterm on static musl could not exclude
# Wayland). But built STANDALONE, eframe with no backend makes winit refuse to
# compile ("platform not supported"), so a standalone demo build broke.
#
# That standalone break was fixed once before (097fe78aa9, by putting the
# backends on the normal dependency) and then UNDONE by 70895dc53, which moved
# them off again without reading that history. Both goals are right; they
# only collided because they shared one line.
#
# A dev-dependency serves both. It is active when THIS crate's tests build,
# and is never passed on to crates that depend on this one -- so apps still
# choose their own backend, and this crate still builds alone.
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }
