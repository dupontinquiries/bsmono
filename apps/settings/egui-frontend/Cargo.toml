[package]
name = "settings-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The central BigSilicon settings app: an egui UI on uikit-egui that edits the shared Prefs (gesture feel, touch, palette, a11y) and publishes changes over the sharemd bus so every egui-kit app updates live. The daemon that 'talks to a larger settings app' is just sharemd + bigsilicon-client::Settings."

[lib]
path = "src/lib.rs"

# The crate described itself as "the central BigSilicon settings app" and
# shipped only a library — nothing to launch, so the desktop entry would have
# pointed at a binary that does not exist.
[[bin]]
name = "settings-egui"
path = "src/bin/settings_egui.rs"
required-features = ["app"]

[features]
default = ["app"]
app = ["dep:eframe", "dep:config-kit"]

[dependencies]
egui = "0.34"
settings-kit = { path = "../../../shared/settings-kit" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }
config-kit = { path = "../../../shared/config-kit", optional = true }
