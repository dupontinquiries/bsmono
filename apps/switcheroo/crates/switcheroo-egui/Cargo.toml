[package]
name = "switcheroo-egui"
version = "0.1.0"
edition = "2021"
description = "switcheroo's egui shell: outlet list, tap-to-toggle, and a visible activity log of every radio command and reply."

[[bin]]
name = "switcheroo"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
switcheroo-core = { path = "../switcheroo-core" }
# The HomeKit protocol. Headless; only `hap.rs` (behind `ble`) drives it over a radio.
hap-core = { path = "../hap-core" }
# The published hap-rust stack: SRP cross-verified against aiohomekit traces
# and real accessories, plus mDNS, the accessory database and Thread
# provisioning. `crate::hap_rs` uses it; `crate::hap` keeps the hand-rolled
# path until this one is confirmed on hardware.
hap-controller = { version = "3", features = ["ble"] }
# THE SHARED KIT. switcheroo was the only egui app in the fleet not on it: no
# palette, eight hardcoded colours, and — because the symbol fonts are
# installed by `apply_palette` — its own star and refresh glyphs rendering as
# boxes. See the module note in ui.rs.
uikit-egui = { path = "../../../../shared/uikit/crates/uikit-egui" }
snapclone-theme = { path = "../../../../shared/uikit/crates/snapclone-theme" }
egui = "0.34"
# Local wall-clock minute for the scheduler; the core takes a Clock value.
chrono = "0.4"
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }

# The radio. btleplug is async (BlueZ over D-Bus on Linux), so it brings
# tokio with it — both are confined to src/ble.rs and neither crosses the
# Backend seam. current_thread runtime only; no work-stealing pool for one
# serial radio.
btleplug = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", optional = true }

[features]
# Deployable bin, per the house convention for every -egui app.
default = ["app", "ble"]
app = ["dep:eframe"]
# Real Bluetooth. Off in CI/sandbox: btleplug wants a D-Bus session and an
# adapter, and the demo backend covers the UI without either. With this
# off the app still builds and runs, and says so in its own status bar
# rather than pretending an empty list means "no outlets nearby".
ble = ["dep:btleplug", "dep:tokio", "dep:futures", "dep:uuid"]
