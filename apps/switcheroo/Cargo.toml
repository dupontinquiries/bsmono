# switcheroo — Bluetooth smart-outlet remote.
#
# Two crates on purpose: switcheroo-core has no egui, no bluetooth crate,
# no threads and no async, so every device-state transition is a unit test
# rather than something you can only observe by standing in the kitchen.
# switcheroo-egui owns the frame loop and the radio thread.
[workspace]
resolver = "2"
members = ["crates/hap-core", "crates/switcheroo-core", "crates/switcheroo-egui"]
# `cargo build --release` produces the deployable bin and nothing else.
default-members = ["crates/switcheroo-egui"]

[profile.release]
opt-level = "z"
lto = true
strip = true
