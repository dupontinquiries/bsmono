  background:rgba(0,0,0,0.6); backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:5px 8px; z-index:200;
}
.tb {
  padding:4px 11px; border:1px solid transparent; border-radius:5px;
  background:transparent; color:rgba(255,255,255,0.45);
  font:10px/1 'Courier New',monospace; cursor:pointer; transition:all .2s; letter-spacing:.6px;
}
.tb:hover { color:rgba(255,255,255,.8); border-color:rgba(255,255,255,.18); }
.tb.on { color:#fff; border-color:rgba(255,255,255,.45); background:rgba(255,255,255,.1); }
#lbl { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.28); font:9px/1 'Courier New',monospace;
  letter-spacing:2.5px; text-transform:uppercase; z-index:200; pointer-events:none; }
#hint { position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
  color:rgba(255,255,255,.15); font:8px/1 'Courier New',monospace;
  letter-spacing:1px; z-index:200; pointer-events:none; }
.ripple { position:fixed; border-radius:50%; background:rgba(255,255,255,.22); pointer-events:none;
  animation:rip .5s ease-out forwards; z-index:300; }
@keyframes rip { from{width:0;height:0;opacity:1;margin:0} to{width:60px;height:60px;opacity:0;margin:-30px} }
#variant, #chrome {
  background:rgba(0,0,0,.4); color:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.2); border-radius:5px;
  font:10px/1 'Courier New',monospace; padding:4px 6px; cursor:pointer; outline:none;
}
#variant option, #chrome option { background:#15131f; color:#eee; }
#tint, #vignette { position:fixed; inset:0; pointer-events:none; z-index:150; }
#tint { mix-blend-mode:soft-light; opacity:0; transition:opacity .5s, background .5s; }
#vignette { background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.45) 100%);
  opacity:.4; transition:opacity .5s; }
</style>

  {name:'Ink & Shadow',  exp:1.00, amb:0.55, fogN:1.0, fogF:1.1, rays:1.1, drop:0.9, shaft:1.1, vig:.70, tint:'#10131c', tintA:0.22},

let curV=0;

// ── SKIN: mirrors egui `theme::Skin` field-for-field so a skin is portable between ends ──
// Fields map to 3D as: radius→corner round, fill_*→face brightness per state, accent→vein tint mix,

const SKINS={

// Skin.lerp — every field numeric/pair, so chrome swaps can crossfade (egui advice)
function lerpSkin(a,b,t){
  const f=(x,y)=>x+(y-x)*t; const o={name:b.name};
  for(const k in a){ o[k]=Array.isArray(a[k]) ? a[k].map((v,i)=>f(v,b[k][i])) : (typeof a[k]==='number'?f(a[k],b[k]):b[k]); }
  return o;
}
let skinFrom=SKINS.carved, skinTo=SKINS.carved, skinT=1;     // crossfade tween

const SKIN_DUR=.45;

const TDUR=1.3;
const eio=t=>t<.5?2*t*t:-1+(4-2*t)*t;

function mkTex(w,h,fn){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d');fn(cx,w,h);return new THREE.CanvasTexture(cv);
}
function mkSpr(col,r=1.0){
  return mkTex(128,128,(cx,W,H)=>{
    cx.clearRect(0,0,W,H);
    const c=new THREE.Color(col),cs=`${~~(c.r*255)},${~~(c.g*255)},${~~(c.b*255)}`;
    const g=cx.createRadialGradient(W/2,H/2,1,W/2,H/2,W/2*r);
    g.addColorStop(0,`rgba(${cs},1)`);g.addColorStop(.45,`rgba(${cs},.65)`);g.addColorStop(1,`rgba(${cs},0)`);
    cx.fillStyle=g;cx.beginPath();cx.arc(W/2,H/2,W/2*.98,0,Math.PI*2);cx.fill();
    cx.strokeStyle=`rgba(${cs},.9)`;cx.lineWidth=2.5;cx.beginPath();cx.arc(W/2,H/2,W/2*.32,0,Math.PI*2);cx.stroke();
  });
}
function mkNS(col,label=''){
  return mkTex(160,160,(cx,W,H)=>{
    cx.clearRect(0,0,W,H);
    const c=new THREE.Color(col),cs=`${~~(c.r*255)},${~~(c.g*255)},${~~(c.b*255)}`;

  });
}
function wT(cx,txt,x,y,mW,lh){
  const words=txt.split(' ');let line='';
  words.forEach(w=>{const t=line+w+' ';if(cx.measureText(t).width>mW&&line!=''){cx.fillText(line.trim(),x,y);line=w+' ';y+=lh;}else line=t;});

// Paint the panel SURFACE material per scene: wood grain, stone, marble, frosted glass
function drawBase(cx,W,H,style){
  if(style==='wood'){
    const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a1a0c');g.addColorStop(.5,'#34210e');g.addColorStop(1,'#241608');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.lineWidth=1;
    for(let i=0;i<70;i++){
      const y=Math.random()*H, amp=4+Math.random()*10, hue=22+Math.random()*14;
      cx.strokeStyle=`hsla(${hue},45%,${10+Math.random()*12}%,${.25+Math.random()*.3})`;
      cx.beginPath();
      for(let x=0;x<=W;x+=24)cx.lineTo(x,y+Math.sin(x*.01+i)*amp*.3);
      cx.stroke();
    }
    for(let k=0;k<3;k++){const kx=Math.random()*W,ky=Math.random()*H;
      for(let r=18;r>2;r-=3){cx.strokeStyle='rgba(20,12,4,.3)';cx.beginPath();cx.ellipse(kx,ky,r,r*.6,.3,0,Math.PI*2);cx.stroke();}}
    return;
  }
  if(style==='glass'){
    const g=cx.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(14,26,34,.92)');g.addColorStop(1,'rgba(8,18,26,.92)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    for(let i=0;i<5;i++){const x=Math.random()*W;
      const s=cx.createLinearGradient(x-120,0,x+120,H);
      s.addColorStop(0,'rgba(255,255,255,0)');s.addColorStop(.5,`rgba(180,220,240,${.04+Math.random()*.05})`);s.addColorStop(1,'rgba(255,255,255,0)');
      cx.fillStyle=s;cx.save();cx.translate(x,0);cx.rotate(-.3);cx.fillRect(-120,-H,240,H*3);cx.restore();}
    for(let i=0;i<400;i++){cx.fillStyle=`rgba(200,230,245,${Math.random()*.05})`;cx.fillRect(Math.random()*W,Math.random()*H,2,2);}
    return;
  }
  if(style==='marble'){
    cx.fillStyle='#14110a';cx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){const x=Math.random()*W,y=Math.random()*H;
      cx.strokeStyle=`rgba(${180+Math.random()*40|0},${150+Math.random()*40|0},${90+Math.random()*30|0},${.06+Math.random()*.08})`;
      cx.lineWidth=1+Math.random()*2;cx.beginPath();cx.moveTo(x,y);
      for(let s=0;s<5;s++)cx.lineTo(x+(Math.random()-.5)*120,y+(Math.random()-.5)*120);cx.stroke();}
    return;
  }
  cx.fillStyle='#0d0b18';cx.fillRect(0,0,W,H);
  for(let i=0;i<300;i++){cx.fillStyle=`rgba(${40+Math.random()*40|0},${40+Math.random()*50|0},${60+Math.random()*60|0},${Math.random()*.06})`;cx.fillRect(Math.random()*W,Math.random()*H,3,3);}
}

    });

    cx.fillStyle='#0c0a18';cx.fillRect(0,55,W,30);
    cx.fillStyle='rgba(255,255,255,.3)';cx.font='9px Courier New';
    cx.fillText('j/k move · h/l branch · g/G ends · t/T zoom · z+hjkl rotate · o fit · / find · ? cmd · b branch · a write · ? help',18,73);
    cx.fillStyle='rgba(255,255,255,.12)';cx.beginPath();cx.roundRect(W-74,60,60,18,3);cx.fill();
    cx.strokeStyle='rgba(255,255,255,.3)';cx.lineWidth=1;cx.beginPath();cx.roundRect(W-74,60,60,18,3);cx.stroke();
    cx.fillStyle='rgba(255,255,255,.75)';cx.font='bold 9px Courier New';cx.fillText('NORMAL',W-65,73);
    cx.fillStyle='#0e0c1e';cx.fillRect(0,85,W,32);
    const t2=[['⊟ Overview',true],['✗ Prune churn (13)',false],['↤ Unprune (0)',false]];
    let tx=14;t2.forEach(([t,a])=>{
      const tw=cx.measureText(t).width+22;
      cx.fillStyle=a?'rgba(255,255,255,.14)':'rgba(255,255,255,.04)';
      cx.beginPath();cx.roundRect(tx,90,tw,20,3);cx.fill();

// 0: Rune stone circle
function mkHelix(){
  // folding@home — protein double helix
  const g=new THREE.Group();
  const turns=3.2, N=64, radius=.42, height=2.6;
  // Two sugar-phosphate backbones as smooth tubes
  function backbone(phase,col){
    const pts=[];
    for(let i=0;i<=N;i++){
      const t=i/N, a=t*turns*Math.PI*2+phase;
      pts.push(new THREE.Vector3(Math.cos(a)*radius, -height/2+t*height, Math.sin(a)*radius));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,128,.045,16,false),
      new THREE.MeshStandardMaterial({color:col,roughness:.25,metalness:.5,
        emissive:new THREE.Color(col),emissiveIntensity:.45,envMapIntensity:2.0}));
    tube.castShadow=true; return tube;
  }
  g.add(backbone(0,0x3a78ff));
  g.add(backbone(Math.PI,0x33ccff));
  // Base-pair rungs + amino-acid node spheres
  const rungMat=new THREE.MeshStandardMaterial({color:0xaab8ff,roughness:.3,metalness:.4,emissive:new THREE.Color(0x4466cc),emissiveIntensity:.35});
  const baseCols=[0xff5566,0x55ddaa,0xffcc44,0x66aaff];
  const beads=[];
  for(let i=0;i<=N;i+=3){
    const t=i/N, a=t*turns*Math.PI*2;
    const pA=new THREE.Vector3(Math.cos(a)*radius,-height/2+t*height,Math.sin(a)*radius);
    const pB=new THREE.Vector3(Math.cos(a+Math.PI)*radius,-height/2+t*height,Math.sin(a+Math.PI)*radius);
    const mid=pA.clone().lerp(pB,.5);
    const len=pA.distanceTo(pB);
    const rung=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,len,12),rungMat);
    rung.position.copy(mid);
    rung.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),pB.clone().sub(pA).normalize());
    g.add(rung);
    // amino beads at each backbone point (high-res spheres)
    [pA,pB].forEach((p,k)=>{
      const c=baseCols[(i+k)%baseCols.length];
      const bead=new THREE.Mesh(new THREE.SphereGeometry(.07,24,18),
        new THREE.MeshStandardMaterial({color:c,roughness:.18,metalness:.55,emissive:new THREE.Color(c),emissiveIntensity:.5}));
      bead.position.copy(p);bead.castShadow=true;g.add(bead);beads.push(bead);
    });
  }
  g.userData.beads=beads;
  // Biological glow + floating organic motes
  const gl=new THREE.PointLight(0x4477ff,3.6,8);gl.position.set(0,0,.4);g.userData.glow=gl;g.add(gl);
  const gl2=new THREE.PointLight(0x33ccaa,2.0,6);gl2.position.set(0,-1.0,.2);g.add(gl2);
  const motes=[];
  for(let i=0;i<28;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:mkSpr(0x66bbff),transparent:true,opacity:.4,blending:THREE.AdditiveBlending}));
    s.position.set((Math.random()-.5)*1.6,(Math.random()-.5)*2.6,(Math.random()-.5)*1.0);
    s.scale.set(.06+Math.random()*.08,.06+Math.random()*.08,1);
    s.userData.seed=Math.random();s.userData.bY=s.position.y;motes.push(s);g.add(s);
  }
  g.userData.motes=motes;return g;
}

// 1: Grove tree with doves
function mkGrove(){
  const g=new THREE.Group();
  const bark=new THREE.MeshStandardMaterial({color:0x3a2410,roughness:.9,metalness:.03});
  // Leaf-card texture: flat leaf with veins; some carry engraved node text
  function leafTex(label){
    return mkTex(128,160,(cx,W,H)=>{
      cx.clearRect(0,0,W,H);
      // leaf body
      const grd=cx.createLinearGradient(0,0,0,H);
      grd.addColorStop(0,'#3e7a1e');grd.addColorStop(1,'#1f4d10');
      cx.fillStyle=grd;
      cx.beginPath();
      cx.moveTo(W/2,4);
      cx.quadraticCurveTo(W-6,H*.35,W/2,H-4);
      cx.quadraticCurveTo(6,H*.35,W/2,4);
      cx.fill();
      // midrib + veins
      cx.strokeStyle='rgba(20,50,10,.6)';cx.lineWidth=2;
      cx.beginPath();cx.moveTo(W/2,8);cx.lineTo(W/2,H-8);cx.stroke();
      cx.lineWidth=1;
      for(let i=1;i<6;i++){const y=8+i*(H-16)/6;
        cx.beginPath();cx.moveTo(W/2,y);cx.lineTo(W/2+(W/2-10)*.7,y-10);cx.stroke();
        cx.beginPath();cx.moveTo(W/2,y);cx.lineTo(W/2-(W/2-10)*.7,y-10);cx.stroke();}
      // engraved text (sunlight-dappled)
      if(label){
        cx.fillStyle='rgba(225,245,200,.92)';cx.font='bold 26px Courier New';
        cx.textAlign='center';cx.textBaseline='middle';
        cx.shadowColor='rgba(255,255,200,.8)';cx.shadowBlur=6;
        cx.fillText(label,W/2,H/2);cx.shadowBlur=0;
      }
    });
  }
  const leaves=[];
  const blankLeafTex=leafTex('');
  const sharedLeafMat=new THREE.MeshStandardMaterial({map:blankLeafTex,roughness:.7,metalness:.0,
    transparent:true,alphaTest:.35,side:THREE.DoubleSide,emissive:new THREE.Color(0x1a4008),emissiveIntensity:.25});
  const leafGeo=new THREE.PlaneGeometry(.3,.38);
  function addLeaf(pos,scale,label){
    const m=label?new THREE.MeshStandardMaterial({map:leafTex(label),roughness:.7,metalness:.0,
      transparent:true,side:THREE.DoubleSide,emissive:new THREE.Color(0x1a4008),emissiveIntensity:.3}):sharedLeafMat;
    const lf=new THREE.Mesh(leafGeo,m);
    lf.position.copy(pos);lf.scale.setScalar(scale);lf.rotation.set((Math.random()-.5)*1.2,Math.random()*6.28,(Math.random()-.5)*1.2);
    lf.userData.seed=Math.random();lf.userData.base=pos.clone();lf.userData.rot=lf.rotation.clone();lf.userData.text=!!label;
    leaves.push(lf);g.add(lf);
  }
  // Recursive triplet branching: each branch splits into 3
  const nodeLabels=['34t','14t','5t','4t','30t','25t','28t','89t','39t'];let li=0;
  function branch(origin,dir,len,rad,depth){
    const end=origin.clone().add(dir.clone().multiplyScalar(len));
    const mid=origin.clone().lerp(end,.5);
    const seg=new THREE.Mesh(new THREE.CylinderGeometry(rad*.7,rad,len,12),bark);
    seg.position.copy(mid);
    seg.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
    seg.castShadow=true;g.add(seg);
    if(depth<=0){
      // leaf cluster at tip — a few flat cards, one carrying node text
      for(let k=0;k<3;k++){
        const off=new THREE.Vector3((Math.random()-.5)*.3,(Math.random()-.5)*.2+.1,(Math.random()-.5)*.3);
        addLeaf(end.clone().add(off),.8+Math.random()*.5, k===0&&li<nodeLabels.length?nodeLabels[li++]:'');
      }
      return;
    }
    // three children, ~triplet spread
    const up=new THREE.Vector3(0,1,0);
    const side=new THREE.Vector3().crossVectors(dir,up).normalize();
    if(side.length()<.1) side.set(1,0,0);
    for(let c=0;c<3;c++){
      const ang=(c-1)*0.5;
      const nd=dir.clone().applyAxisAngle(side,0.45).applyAxisAngle(dir.clone().normalize(),c*2.094);
      nd.lerp(up,.15).normalize();
      branch(end,nd,len*.7,rad*.7,depth-1);
    }
  }
  // trunk — thicker, shorter, leaning
  const trunkLen=1.15;
  branch(new THREE.Vector3(0,-1.5,0),new THREE.Vector3(.12,1,.04).normalize(),trunkLen,.30,0); // stout base
  // main split into 3 from top of trunk
  const top=new THREE.Vector3(.16,-.25,.05);
  for(let c=0;c<3;c++){
    const a=c*2.094;
    const d=new THREE.Vector3(Math.cos(a)*.6+.18,1,Math.sin(a)*.6).normalize();
    branch(top,d,.82,.17,2); // → 3 → 9 tips, thicker
  }
  // overall lean
  g.rotation.z=.10;g.rotation.x=-.04;
  // ── MOSS patches clinging to trunk + lower branches ──
  const mossM=new THREE.MeshStandardMaterial({color:0x3a6e22,roughness:.95,metalness:0,emissive:new THREE.Color(0x16380c),emissiveIntensity:.3});
  for(let i=0;i<14;i++){
    const mp=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.07,8,6),mossM);
    mp.scale.set(1,.5,.6);const a=Math.random()*Math.PI*2,h=-1.4+Math.random()*1.0;
    mp.position.set(.16+Math.cos(a)*.26,h,Math.sin(a)*.26);mp.castShadow=true;g.add(mp);
  }
  // ── HANGING VINES (thin drooping strands with leaf tufts) ──
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,r=.5+Math.random()*.5;
    const vx=.16+Math.cos(a)*r, vz=Math.sin(a)*r, vy=.4+Math.random()*.6;
    const vlen=.5+Math.random()*.6;
    const vine=new THREE.Mesh(new THREE.CylinderGeometry(.012,.006,vlen,5),
      new THREE.MeshStandardMaterial({color:0x2e5818,roughness:.9,metalness:0}));
    vine.position.set(vx,vy-vlen*.5,vz);g.add(vine);
    addLeaf(new THREE.Vector3(vx,vy-vlen,vz),.5+Math.random()*.3,'');
  }
  // ── BUSHY crawling leaves low around the trunk base ──
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2,r=.3+Math.random()*.5;
    addLeaf(new THREE.Vector3(.16+Math.cos(a)*r,-1.45+Math.random()*.5,Math.sin(a)*r),.6+Math.random()*.4,'');
  }
  // ── TWO-TIER canopy of INDIVIDUAL leaves — gaps let dappled light through ──
  function leafShell(cx,cy,cz,rad,count,flat){
    for(let i=0;i<count;i++){
      const u=Math.random(),v=Math.random();
      const theta=2*Math.PI*u, phi=Math.acos(1-1.25*v); // bias toward rounded top
      const rr=rad*(.78+Math.random()*.28);
      addLeaf(new THREE.Vector3(
        cx+Math.sin(phi)*Math.cos(theta)*rr,
        cy+Math.cos(phi)*rr*flat,
        cz+Math.sin(phi)*Math.sin(theta)*rr), .7+Math.random()*.5, '');
    }
  }
  // lower tier (broad, bushy)
  [[.0,.55,0,.95],[.6,.45,0,.62],[-.5,.5,0,.6],[.25,.4,0,.55],[-.3,.35,0,.5]].forEach(([x,y,z,r])=>leafShell(.16+x,y,z,r,20,.78));
  // upper tier
  [[0,1.02,0,.7],[.35,.96,0,.5],[-.32,.95,0,.48]].forEach(([x,y,z,r])=>leafShell(.16+x,y,z,r,16,.82));
  // rounded crown
  leafShell(.16,1.28,0,.58,22,.7);
  g.userData.leaves=leaves;
  // Circular bookshelf wall behind (ancient tightly-packed books)
  const bookTex=mkTex(512,256,(cx,W,H)=>{
    cx.fillStyle='#1a1208';cx.fillRect(0,0,W,H);
    const shelfH=H/5;
    for(let s=0;s<5;s++){
      let x=0;const y=s*shelfH;
      while(x<W){const bw=8+Math.random()*14;const hh=shelfH*(.7+Math.random()*.25);
        const hue=20+Math.random()*30, l=18+Math.random()*22;
        cx.fillStyle=`hsl(${hue},${40+Math.random()*30}%,${l}%)`;
        cx.fillRect(x,y+shelfH-hh,bw-1,hh);x+=bw;}
      cx.fillStyle='rgba(0,0,0,.5)';cx.fillRect(0,y+shelfH-2,W,3);
    }
  });
  bookTex.wrapS=THREE.RepeatWrapping;bookTex.repeat.set(4,2);
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,3.0,48,1,true,Math.PI*.15,Math.PI*1.2),
    new THREE.MeshStandardMaterial({map:bookTex,roughness:.85,metalness:.0,side:THREE.BackSide,envMapIntensity:.5}));
  wall.position.set(0,.2,-.3);g.add(wall);
  const gl=new THREE.PointLight(0xffd060,2.4,8);gl.position.set(.5,1.2,.8);g.userData.glow=gl;g.add(gl);
  return g;
}

  // Colonnade of THICKER columns ringing the drum exterior (down to the platform)

const lC=(a,b,t)=>new THREE.Color().lerpColors(new THREE.Color(a),new THREE.Color(b),t);

// ╔═══ LAYER 4: STYLE — themes+variants resolve to a flat TOKEN bag (stable API) ═══╗
// Widgets below read ONLY `tok.*`. Themes/variants only PRODUCE tok. This is the
// anti-rot seam: add a theme = data row; widget/styler code never changes.
const Style={
  resolve(A,B,t,V){
    const c=(a,b)=>new THREE.Color().lerpColors(new THREE.Color(a),new THREE.Color(b),t);
    const f=(a,b)=>a+(b-a)*t;
    return {
      // lights
      ambColor:c(A.amb[0],B.amb[0]), ambInt:f(A.amb[1],B.amb[1])*V.amb,
      keyColor:c(A.key.c,B.key.c), keyInt:f(A.key.i,B.key.i), keyPos:B.key.p.map((v,i)=>f(A.key.p[i],v)),
      fillColor:c(A.fill.c,B.fill.c), fillInt:f(A.fill.i,B.fill.i), fillPos:B.fill.p.map((v,i)=>f(A.fill.p[i],v)),
      rimColor:c(A.rim.c,B.rim.c), rimInt:f(A.rim.i,B.rim.i), rimPos:B.rim.p,
      hemiSky:c(A.skyB,B.skyB), hemiGround:c(A.floorCol,B.floorCol), hemiInt:f(.5,.7)+.4,
      // atmosphere
      fogColor:B.fog[0], fogNear:f(A.fog[1],B.fog[1])*V.fogN, fogFar:f(A.fog[2],B.fog[2])*V.fogF,
      starOp:f(A.stars?.5:0,B.stars?.5:0),
      volColor:(()=>{const vc=B.vol||[0,0,0],pv=A.vol||[0,0,0];return [f(pv[0],vc[0]),f(pv[1],vc[1]),f(pv[2],vc[2])];})(),
      volOp:f(A.vol?.75:0,B.vol?.75:0),
      godrayColor:B.godray.c, godraySrc:B.godray.src, godrayMul:V.rays, dropMul:V.drop, shaftMul:V.shaft,
      // surfaces
      accent:c(A.acc,B.acc),
      panelRough:f(A.panel.r,B.panel.r), panelMetal:f(A.panel.m,B.panel.m),
      panelEnv:f(A.panel.e,B.panel.e), panelOpacity:f(A.pop,B.pop),
      floorColor:B.floorCol, floorRough:f(A.floorR,B.floorR),
      // bg + content selectors
      sceneIdx:curS, prevIdx:prevS, blend:t,
    };
  }
};
// Widget stylers: each reads tok and writes to its own objects. Register, never inline.
const STYLERS=[];
const styler=fn=>STYLERS.push(fn);

styler(k=>{ ambL.color.copy(k.ambColor);ambL.intensity=k.ambInt;

  fillL.color.copy(k.fillColor);fillL.intensity=k.fillInt;fillL.position.set(...k.fillPos);

const clock=new THREE.Clock();let T=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);T+=dt;
  if(transT<1.0)transT=Math.min(1.0,transT+dt/TDUR);
  // single styling path: theme(prev→cur) × variant → tokens → stylers, every frame
  applyS(SC[prevS],SC[curS],eio(transT));
  shaftMat.uniforms.uOp.value=ARCH[curS].sOp*VARIANTS[curV].shaft;
  volMat.uniforms.uT.value=T;bgMat.uniforms.uT.value=T;
  causticMat.uniforms.uT.value=T;
  causticMat.uniforms.uOp.value+=((curS===6?1:0)-causticMat.uniforms.uOp.value)*.05;
  rays.forEach((r,i)=>{
    const fl=.5+.5*Math.sin(T*.9+r.seed*6.28+i*.3);
    r.mat.uniforms.uOp.value=SC[curS].godray.i*0.048*fl*(transT<1?eio(transT):1.0)*VARIANTS[curV].rays;
    r.mesh.rotation.z=r.angle+Math.sin(T*.5+r.seed*3.14)*.035;
  });
  const cy=yaw+mu.x*.006,cp2=pitch-mu.y*.004;
  camera.position.x=Math.sin(cy)*7.0;camera.position.z=Math.cos(cy)*7.0;camera.position.y=.55+cp2*3.0;
  camera.lookAt(.3,0,-.4);
  ui.position.y=Math.sin(T*.26)*.04;ui.rotation.y=Math.sin(T*.14)*.007;
  shaftMat.uniforms.uT.value=T;
  oculus.material.opacity=.7+.15*Math.sin(T*.6);
  droplets.forEach(d=>{const s=d.userData.seed;
    d.position.y=d.userData.bY+Math.sin(T*.5+s*6.28)*.18;
    d.position.x=d.userData.bX+Math.cos(T*.35+s*5.)*.12;
    d.material.opacity=(.18+.18*Math.sin(T*.7+s*3.14))*VARIANTS[curV].drop;});
  nodeSprites.forEach((sp,i)=>{sp.position.y=nodeBases[i].y+Math.sin(T*.52+nodeBases[i].seed*6.28)*.09;});
  // roving sunlight reveals the node it falls upon
  const lx=-.9+Math.sin(T*.22)*.85, ly=-.05+Math.cos(T*.17)*.85;
  sunSpot.position.set(lx,ly,.52);sunSpot.material.opacity=.4+.15*Math.sin(T*1.3);
  sunLight.position.set(lx-.85,ly,1.0);
  nodeSprites.forEach((sp,i)=>{
    const d=Math.hypot(nodeData[i].p[0]-lx, sp.position.y-ly);
    const illum=Math.max(0,1-d/.45);
    nodeCards[i].material.opacity=illum*illum*.95;
    nodeCards[i].position.y=sp.position.y;
    sp.scale.setScalar(nodeData[i].s*(1+illum*.5));
  });
  // spontaneous ripples on the memory water
  ripples.forEach(r=>{r.userData.t+=dt;const tt=r.userData.t%3.2,k=tt/3.2;
    r.scale.setScalar(.05+k*1.6);r.material.opacity=Math.max(0,(1-k))*.35;
    if(tt<dt)reseedRipple(r);});
  // drifting leaf (only over Grove)
  leafDrift.visible=(curS===1);
  if(leafDrift.visible){leafDrift.userData.t+=dt;
    leafDrift.position.y=3-((leafDrift.userData.t*.45)%6);
    leafDrift.position.x=1+Math.sin(leafDrift.userData.t*1.1)*.6;
    leafDrift.material.rotation=Math.sin(leafDrift.userData.t*1.6)*.5;}
  nodeSprites.forEach((sp,i)=>{sp.material.opacity=.65+.35*Math.sin(T*.75+nodeBases[i].seed*3.14);});
  rippleMat.uniforms.uT.value=T;
  ripple.position.y=nodeSprites[0].position.y;ripple.scale.setScalar(1+Math.sin(T*.8)*.06);
  nodeOrbit.forEach(s=>{const a=s.userData.a+T*.5;s.position.set(nodeData[0].p[0]+Math.cos(a)*s.userData.r,nodeSprites[0].position.y+Math.sin(a*1.3)*.06,nodeData[0].p[2]+Math.sin(a)*s.userData.r*.4+.05);});
  waterRing.material.opacity=.78+.06*Math.sin(T*.6);
  waterRing.material.metalness=.1+.05*Math.sin(T*.4);
  rc.setFromCamera(mu,camera);const bhits=rc.intersectObjects(btnMs);canvas.style.cursor=bhits.length?'pointer':'default';
  const hov=bhits.length?bhits[0].object:null;
  // resolve chrome-skin crossfade (egui Skin.lerp parity)
  if(skinT<1){skinT=Math.min(1,skinT+dt/SKIN_DUR);skinNow=lerpSkin(skinFrom,skinTo,skinT);}
  const sk=skinNow;
  stoneBtns.forEach(b=>{b.userData.hover+=(((hov===b)?1:0)-b.userData.hover)*.18;
    const h=b.userData.hover;
    // vein glow ramps rest→hover; accent-tinted
    b.userData.mat.emissiveIntensity=(sk.vein[0]+h*(sk.vein[1]-sk.vein[0]))*sk.accent;
    // fill brightness per state → face base via emissive on map? use color tint
    const fill=sk.fill_rest+h*(sk.fill_hover-sk.fill_rest);
    b.userData.mat.color.setScalar(.7+fill);
    // sheen → low roughness + animated specular sweep
    b.userData.mat.roughness=Math.max(0,.85-sk.sheen*.8 - h*.1);
    b.userData.mat.metalness=sk.sheen*.5;
    b.userData.mat.envMapIntensity=1.0+sk.sheen*(1.2+.6*Math.sin(T*sk.sheen_speed*2+b.userData.i));});
  const cp=CPS[curS];
  if(cp&&cp.visible){
    if(cp.userData.glow)cp.userData.glow.intensity=cp.userData.glow.intensity*.92+(SC[curS].key.i*1.2+Math.sin(T*1.8)*.6)*.08;
    if(curS===0){cp.rotation.y=T*.35;if(cp.userData.motes)cp.userData.motes.forEach(m=>{m.position.y=m.userData.bY+Math.sin(T*.4+m.userData.seed*6.28)*.25;m.material.opacity=.25+.35*Math.sin(T*.8+m.userData.seed*3.14);});}
    if(curS===1&&cp.userData.leaves)cp.userData.leaves.forEach(l=>{const s=l.userData.seed,r=l.userData.rot;l.rotation.z=r.z+Math.sin(T*1.2+s*6.28)*.22;l.rotation.y=r.y+Math.sin(T*.9+s*4.)*.3;l.position.x=l.userData.base.x+Math.sin(T*.7+s*5.)*.035;l.position.y=l.userData.base.y+Math.sin(T*1.1+s*3.)*.025;});
    if(curS===2){
      if(cp.userData.islands)cp.userData.islands.forEach(is=>{is.position.y=is.userData.bY+Math.sin(T*.5+is.userData.seed*6.28)*.06;is.rotation.y=Math.sin(T*.2+is.userData.seed*4.)*.05;});
      if(cp.userData.drops)cp.userData.drops.forEach(d=>{d.position.y+=d.userData.vy*dt;if(d.position.y<-1.5){d.position.y=d.userData.bY;d.position.x=-.35+(Math.random()-.5)*.25;}});
      if(cp.userData.mist)cp.userData.mist.forEach(m=>{m.position.x+=Math.sin(T*.15+m.userData.seed*6.28)*.002;m.material.opacity=.08+.10*Math.sin(T*.4+m.userData.seed*3.14);});
      if(cp.userData.water)cp.userData.water.material.opacity=.6+.12*Math.sin(T*.8);
    }
    if(curS===3&&cp.userData.flames)cp.userData.flames.forEach((f,i)=>{f.scale.set(.28+Math.sin(T*2.8+i)*.04,.4+Math.sin(T*2.1+i*.7)*.08,1);f.material.opacity=.8+.2*Math.sin(T*3+i*2);});
    if(curS===4){
      if(cp.userData.drips)cp.userData.drips.forEach(d=>{d.position.y+=d.userData.vy*dt*2;if(d.position.y<-1.54){d.position.y=d.userData.bY;d.position.x=d.userData.bX;d.position.z=d.userData.bZ;}d.material.opacity=.4+.4*Math.max(0,1-Math.abs(d.position.y-d.userData.bY)/.6);});
      if(cp.userData.jets)cp.userData.jets.forEach((j,i)=>{j.scale.set(.07+Math.sin(T*3+i)*.02,.22+Math.sin(T*2.5+i*.8)*.06,1);j.material.opacity=.55+.15*Math.sin(T*2+i);});
    }
    if(curS===5&&cp.userData.rings)cp.userData.rings.forEach(r=>r.rotation.y+=r.userData.spd*dt);
    if(curS===6){
      if(cp.userData.bubbles)cp.userData.bubbles.forEach(b=>{b.position.y+=b.userData.vy*dt;if(b.position.y>-.05)b.position.y=-1.22+Math.random()*.3;});
      if(cp.userData.fish)cp.userData.fish.forEach(f=>{f.position.x+=f.userData.vx;f.position.y+=Math.sin(T*.5+f.userData.seed*3)*.002;if(Math.abs(f.position.x)>1.0)f.userData.vx*=-1;f.scale.x=f.userData.vx>0?.3:-.3;});
    }
  }
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{renderer.setSize(W(),H());camera.aspect=W()/H();camera.updateProjectionMatrix();});
</script>
</body>
