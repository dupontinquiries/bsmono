<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pulse Reader — the text prints out of the crystal</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:#9aa}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;left:14px;top:12px;font-size:12px;line-height:1.5;opacity:.78;pointer-events:none;text-shadow:0 0 6px #000}
  #hud b{color:#cde}
  #panel{position:fixed;right:14px;top:12px;background:rgba(10,14,18,.72);border:1px solid #223;border-radius:8px;padding:10px 12px;font-size:11px;width:190px}
  #panel h4{margin:0 0 6px;color:#bdf;font-weight:600;letter-spacing:.04em}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row label{width:64px;color:#9bd}
  .row input{flex:1}
  #hint{position:fixed;left:0;right:0;bottom:12px;text-align:center;font-size:12px;opacity:.55;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div>the crystal swirls; a rhythmic beam <b>prints</b> the centred block left→right, then it dissolves back</div><div id="st"></div></div>
<div id="panel">
  <h4>PULSE</h4>
  <div class="row"><label>rhythm</label><input id="lRhy" type="range" min="0.2" max="2.5" step="0.05" value="1.0"></div>
  <div class="row"><label>hold</label><input id="lHold" type="range" min="0" max="2" step="0.05" value="0.7"></div>
  <div class="row"><label>tilt/scroll</label><input id="lTilt" type="range" min="-1.6" max="1.6" step="0.01" value="0.0"></div>
  <div class="row"><label>swirl</label><input id="lSpin" type="range" min="0" max="0.8" step="0.01" value="0.22"></div>
  <div class="row"><label>depth</label><input id="lDepth" type="range" min="0.2" max="1.0" step="0.01" value="0.7"></div>
  <div class="row"><label>glow</label><input id="lGlow" type="range" min="0.3" max="2" step="0.01" value="1.0"></div>
</div>
<div id="hint">drag up/down (or tilt/scroll) to move between blocks · the beam reveals the centred one in rhythm · depth only stirs the cloud</div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1),Wd=0,Ht=0;
function resize(){Wd=cv.clientWidth||innerWidth||800;Ht=cv.clientHeight||innerHeight||600;cv.width=Wd*DPR;cv.height=Ht*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);
const lever=id=>parseFloat(document.getElementById(id).value);

const BLOCKS=[
  "Keep a seek cursor; remember the byte offset.",
  "On inode change, reopen the path.",
  "If it shrinks, reset the offset to zero.",
  "Stream lines so memory stays bounded.",
];
const TAU=Math.PI*2, rand=(s=>()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296;})(0x5151aa>>>0);
const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};
function rotY(p,a){const c=Math.cos(a),s=Math.sin(a);return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c];}
function rotX(p,a){const c=Math.cos(a),s=Math.sin(a);return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c];}

const tcan=document.createElement('canvas'),tctx=tcan.getContext('2d');
// upright glyph points, normalized so width ~1.7 (aspect preserved), centred at origin
function glyphPoints(text,wrap){
  const px=46,lh=px*1.26,words=text.split(/\s+/);let lines=[],cur="";
  for(const w of words){if(cur&&cur.length+w.length+1>wrap){lines.push(cur);cur="";}cur=cur?cur+" "+w:w;} if(cur)lines.push(cur);
  tcan.width=1000;tcan.height=Math.max(120,lines.length*lh+px);tctx.clearRect(0,0,tcan.width,tcan.height);
  tctx.fillStyle="#fff";tctx.font=`700 ${px}px ui-monospace,monospace`;tctx.textBaseline="alphabetic";
  lines.forEach((l,i)=>tctx.fillText(l,6,px+i*lh));
  const W=tcan.width,H=tcan.height,d=tctx.getImageData(0,0,W,H).data,pts=[];
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(d[(y*W+x)*4+3]>128){pts.push([x,y]);mnx=Math.min(mnx,x);mny=Math.min(mny,y);mxx=Math.max(mxx,x);mxy=Math.max(mxy,y);}
  const w=mxx-mnx,h=mxy-mny,cx=(mnx+mxx)/2,cy=(mny+mxy)/2,s=1.7/w;
  return pts.map(p=>[(p[0]-cx)*s,-(p[1]-cy)*s]);  // x in ~[-0.85,0.85], y aspect-preserved
}
// each block: upright glyph points (home, front plane) + a scatter point in the volume (the swirling cloud)
const BLK=BLOCKS.map((t,i)=>{
  const gp=glyphPoints(t,24);
  const pts=gp.map(([x,y])=>{ let sx,sy,sz; do{sx=rand()*2-1;sy=rand()*2-1;sz=rand()*2-1;}while(sx*sx+sy*sy+sz*sz>1);
    return {hx:x, hy:y, scat:[sx,sy,sz]}; });
  return {text:t, pts};
});
const SPACING=1.15;  // vertical gap between blocks in the stack

function makeSprite(rgb){const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`);rg.addColorStop(0.45,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.45)`);rg.addColorStop(1,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
  g.fillStyle=rg;g.fillRect(0,0,64,64);return s;}
const S_WHITE=makeSprite([255,255,255]),S_COOL=makeSprite([110,150,235]),S_WARM=makeSprite([255,220,180]);
function spr(img,x,y,sz,a){if(a<0.012||sz<=0.5)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(img,x-sz/2,y-sz/2,sz,sz);}

let scroll=0, scrollExtra=0, drag=false, ly=0, swirl=0;
cv.addEventListener('pointerdown',e=>{drag=true;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(drag){scrollExtra+=(e.clientY-ly)*0.006;ly=e.clientY;}});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('wheel',e=>{e.preventDefault();scrollExtra+=e.deltaY*0.002;},{passive:false});

function draw(){
  if(!Wd||!Ht){resize();if(!Wd||!Ht){requestAnimationFrame(draw);return;}}
  const t=performance.now()*0.001, dt=1/60;
  const RHY=lever('lRhy'),HOLD=lever('lHold'),DEPTH=lever('lDepth'),GLOW=lever('lGlow');
  swirl+=lever('lSpin')*dt;
  const scrollPos=lever('lTilt')+scrollExtra;     // which block is centred
  ctx.globalAlpha=1;ctx.fillStyle="#04050a";ctx.fillRect(0,0,Wd,Ht);
  const cx=Wd*0.5,cy=Ht*0.5,R=Math.min(Wd,Ht)*0.4;
  let rg=ctx.createRadialGradient(cx,cy,R*0.05,cx,cy,R);
  rg.addColorStop(0,"rgba(26,36,64,0.16)");rg.addColorStop(0.7,"rgba(12,16,30,0.08)");rg.addColorStop(1,"rgba(4,5,10,0)");
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();

  // rhythmic sweep phase: beam travels left->right printing the text, holds, then clears & repeats
  const cycle=1+HOLD, phase=(t*RHY)%cycle;
  const sweeping=phase<1, sx=sweeping?(-0.95+1.95*phase):1.2;   // beam x position (normalized)

  ctx.save();ctx.globalCompositeOperation="lighter";
  // proj for the cloud (swirling); home text is drawn flat & upright (front)
  const projCloud=p=>{const q=rotX(rotY(p,swirl),0.18*Math.sin(t*0.3));return [cx+q[0]*R,cy-q[1]*R,q[2]];};

  let activeIdx=Math.round(scrollPos), activeName="";
  for(let bi=0;bi<BLK.length;bi++){
    const B=BLK[bi];
    const yOff=(bi-scrollPos)*SPACING;                 // 0 when centred
    const active=Math.exp(-(yOff*yOff)/(0.5*0.5));     // 1 at centre, falls off -> separation by tilt/scroll
    if(active<0.02) continue;
    if(Math.abs(yOff)<0.3) activeName=B.text;
    for(const pt of B.pts){
      // assembled amount: active * (printed by the beam left of sx, or full during hold)
      const printed = sweeping ? smooth(sx-0.10, sx+0.02, pt.hx) : 1;     // left of beam = printed
      const printedInv = sweeping ? (1-printed) : 0;
      const c = active * (sweeping ? printed : 1);     // 0 dispersed .. 1 upright text
      // home: upright, front plane, at the block's vertical offset
      const home=[pt.hx, pt.hy*0.6 + yOff*0.9, 0.0];
      // cloud: scatter point, swirling, depth-spread
      const cl=[pt.scat[0], pt.scat[1], pt.scat[2]*DEPTH];
      const Pc=projCloud(cl);
      const hx2=cx+home[0]*R, hy2=cy-home[1]*R;
      // lerp from swirling cloud -> upright home as it gets printed
      const X=Pc[0]+(hx2-Pc[0])*c, Y=Pc[1]+(hy2-Pc[1])*c;
      const dep=(Pc[2]+1)/2;
      const sz=(2.2+4.2*dep)*(0.7+0.5*c);
      // cloud presence (dispersed) — the persistent interior
      spr(dep>0.5?S_WARM:S_COOL, X,Y, sz, (0.05+0.30*dep)*active*GLOW*(1-0.7*c));
      // the printed text core (upright, legible, white) + a beam-edge flash where it's being written
      if(c>0.03) spr(S_WHITE, X,Y, sz*0.7, (0.2+1.5*c)*GLOW);
      if(sweeping && printedInv<0.25 && printed>0.05) spr(S_WHITE, X,Y, sz*0.9, 0.6*active*GLOW); // bright write-front
    }
  }
  ctx.restore();ctx.globalAlpha=1;

  // the writing beam (a soft vertical bar at sx) sweeping the read zone
  if(sweeping){ const bxp=cx+sx*R; const lg=ctx.createLinearGradient(bxp-30,0,bxp+30,0);
    lg.addColorStop(0,"rgba(150,210,255,0)");lg.addColorStop(0.5,"rgba(170,220,255,0.10)");lg.addColorStop(1,"rgba(150,210,255,0)");
    ctx.fillStyle=lg;ctx.fillRect(bxp-30,cy-R*0.6,60,R*1.2); }

  ctx.strokeStyle="rgba(150,170,190,0.18)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
  document.getElementById('st').innerHTML=`block <b>${Math.max(1,Math.min(BLK.length,activeIdx+1))}/${BLK.length}</b> · ${sweeping?("printing "+(phase*100|0)+"%"):"hold"} — “${activeName||BLK[Math.max(0,Math.min(BLK.length-1,activeIdx))].text}”`;
  requestAnimationFrame(draw);
}
resize();requestAnimationFrame(draw);
</script>
</body>
</html>
