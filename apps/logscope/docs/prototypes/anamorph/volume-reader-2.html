<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Volume Reader 2 — one interior, many angles</title>
<style>
  html,body{margin:0;height:100%;background:#04050a;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace;color:#9aa}
  #c{display:block;width:100vw;height:100vh;touch-action:none}
  #hud{position:fixed;left:14px;top:12px;font-size:12px;line-height:1.5;opacity:.78;pointer-events:none;text-shadow:0 0 6px #000}
  #hud b{color:#cde}
  #tag{position:fixed;left:14px;bottom:12px;font-size:11px;opacity:.5}
  #panel{position:fixed;right:14px;top:12px;background:rgba(10,14,18,.72);border:1px solid #223;border-radius:8px;padding:10px 12px;font-size:11px;width:190px}
  #panel h4{margin:0 0 6px;color:#bdf;font-weight:600;letter-spacing:.04em}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row label{width:64px;color:#9bd}
  .row input{flex:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><b>one</b> interior · every block lives in it at once · the angle picks which one resolves</div><div id="st"></div></div>
<div id="tag">version: <b>volume-reader-2</b> (unified interior, equator longitudes)</div>
<div id="panel">
  <h4>VOLUME</h4>
  <div class="row"><label>spin</label><input id="lSpin" type="range" min="-0.5" max="0.5" step="0.01" value="0.10"></div>
  <div class="row"><label>tilt</label><input id="lTilt" type="range" min="-0.5" max="0.5" step="0.01" value="0.07"></div>
  <div class="row"><label>depth</label><input id="lDepth" type="range" min="0.15" max="1.0" step="0.01" value="0.7"></div>
  <div class="row"><label>reveal</label><input id="lPow" type="range" min="1" max="10" step="0.5" value="4"></div>
  <div class="row"><label>glow</label><input id="lGlow" type="range" min="0.3" max="2" step="0.01" value="1.0"></div>
  <div class="row"><label>ambient</label><input id="lAmb" type="range" min="0" max="1" step="0.01" value="0.5"></div>
</div>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=Math.min(2,window.devicePixelRatio||1),Wd=0,Ht=0;
function resize(){Wd=cv.clientWidth||innerWidth||800;Ht=cv.clientHeight||innerHeight||600;cv.width=Wd*DPR;cv.height=Ht*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);
const lever=id=>parseFloat(document.getElementById(id).value);
const SECTIONS=[
  "Keep a seek cursor; remember the byte offset.",
  "On inode change, reopen the path.",
  "If it shrinks, reset the offset to zero.",
  "Stream lines so memory stays bounded.",
];
const TAU=Math.PI*2, rand=(s=>()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296;})(0x77aa33>>>0);
function rotY(p,a){const c=Math.cos(a),s=Math.sin(a);return [p[0]*c+p[2]*s,p[1],-p[0]*s+p[2]*c];}
function rotX(p,a){const c=Math.cos(a),s=Math.sin(a);return [p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c];}
const tcan=document.createElement('canvas'),tctx=tcan.getContext('2d');
function glyphPoints(text,wrap){
  const px=46,lh=px*1.26,words=text.split(/\s+/);let lines=[],cur="";
  for(const w of words){if(cur&&cur.length+w.length+1>wrap){lines.push(cur);cur="";}cur=cur?cur+" "+w:w;} if(cur)lines.push(cur);
  tcan.width=940;tcan.height=Math.max(150,lines.length*lh+px);tctx.clearRect(0,0,tcan.width,tcan.height);
  tctx.fillStyle="#fff";tctx.font=`700 ${px}px ui-monospace,monospace`;tctx.textBaseline="alphabetic";
  lines.forEach((l,i)=>tctx.fillText(l,6,px+i*lh));
  const W=tcan.width,H=tcan.height,d=tctx.getImageData(0,0,W,H).data,pts=[];
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(d[(y*W+x)*4+3]>128){pts.push([x,y]);mnx=Math.min(mnx,x);mny=Math.min(mny,y);mxx=Math.max(mxx,x);mxy=Math.max(mxy,y);}
  const half=Math.max(mxx-mnx,mxy-mny)/2,cx=(mnx+mxx)/2,cy=(mny+mxy)/2,s=0.82/half,out=[];
  for(let i=0;i<pts.length;i++) if(rand()<0.5) out.push([(pts[i][0]-cx)*s,-(pts[i][1]-cy)*s]);
  return out;
}
const PHI=SECTIONS.map((_,i)=>i*(TAU/SECTIONS.length));
const ALL=[];
SECTIONS.forEach((t,si)=>{ const phi=PHI[si];
  for(const [x,y] of glyphPoints(t,16)){ const rho=Math.min(0.98,Math.hypot(x,y)),hz=Math.sqrt(1-rho*rho);
    const z=(rand()*2-1)*hz; ALL.push({base:rotY([x,y,z],phi), zr:z/Math.max(0.01,hz), phi, sec:si}); }});
const STRUCT=[];for(let i=0;i<220;i++){const a=()=>{let x,y,z;do{x=rand()*2-1;y=rand()*2-1;z=rand()*2-1;}while(x*x+y*y+z*z>1);return [x,y,z];};STRUCT.push([a(),a()]);}
function makeSprite(rgb){const s=document.createElement('canvas');s.width=s.height=64;const g=s.getContext('2d');
  const rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`);rg.addColorStop(0.4,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.5)`);rg.addColorStop(1,`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
  g.fillStyle=rg;g.fillRect(0,0,64,64);return s;}
const S_WHITE=makeSprite([255,255,255]),S_COOL=makeSprite([110,150,235]),S_WARM=makeSprite([255,225,190]),S_RED=makeSprite([255,70,70]),S_BLUE=makeSprite([80,130,255]);
function spr(img,x,y,sz,a){if(a<0.012||sz<=0.5)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(img,x-sz/2,y-sz/2,sz,sz);}
let yaw=0,dragYaw=0,pitchExtra=0,drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(drag){dragYaw+=(e.clientX-lx)*0.005;pitchExtra+=(e.clientY-ly)*0.004;lx=e.clientX;ly=e.clientY;}});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('wheel',e=>{e.preventDefault();dragYaw+=e.deltaY*0.0016;},{passive:false});
function draw(){
  if(!Wd||!Ht){resize();if(!Wd||!Ht){requestAnimationFrame(draw);return;}}
  const dt=1/60; yaw+=lever('lSpin')*dt;
  const totYaw=yaw+dragYaw, pitch=lever('lTilt')+pitchExtra;
  const DEPTH=lever('lDepth'),POW=lever('lPow'),GLOW=lever('lGlow'),AMB=lever('lAmb');
  ctx.globalAlpha=1;ctx.fillStyle="#04050a";ctx.fillRect(0,0,Wd,Ht);
  const cx=Wd*0.5,cy=Ht*0.5,R=Math.min(Wd,Ht)*0.4;
  let rg=ctx.createRadialGradient(cx,cy,R*0.05,cx,cy,R);
  rg.addColorStop(0,"rgba(28,38,66,0.16)");rg.addColorStop(0.7,"rgba(12,16,30,0.08)");rg.addColorStop(1,"rgba(4,5,10,0)");
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.fill();
  const proj=p=>{const q=rotX(rotY([p[0],p[1],p[2]*DEPTH],totYaw),pitch);return [cx+q[0]*R,cy-q[1]*R,q[2]];};
  ctx.save();ctx.globalCompositeOperation="lighter";
  ctx.globalAlpha=1;ctx.lineWidth=1;
  for(const [a,b] of STRUCT){const A=proj(a),B=proj(b);const dep=(A[2]+B[2])*0.25+0.5;
    ctx.strokeStyle=`rgba(70,100,170,${0.05*AMB*(0.3+dep)})`;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
  for(const pt of ALL){
    const P=proj(pt.base); const dep=(P[2]+1)/2;
    const conv=Math.pow(Math.max(0,Math.cos(totYaw+pt.phi)),POW);
    const sz=(2.2+5.0*dep)*(0.7+0.5*conv);
    spr(dep>0.5?S_WARM:S_COOL, P[0],P[1], sz, (0.05+0.34*dep)*AMB*GLOW*(1-0.55*conv));
    if(conv>0.03){
      if(conv<0.9){const sep=(1-conv)*pt.zr*R*0.05;
        spr(S_RED, P[0]+sep,P[1], sz*0.9, 0.4*conv*GLOW*dep);
        spr(S_BLUE,P[0]-sep,P[1], sz*0.9, 0.4*conv*GLOW*dep);}
      spr(S_WHITE,P[0],P[1], sz*0.8, (0.15+1.6*conv)*(0.45+0.55*dep)*GLOW);
    }
  }
  ctx.restore();ctx.globalAlpha=1;
  ctx.strokeStyle="rgba(150,170,190,0.2)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
  let near=0,best=-2;for(let s=0;s<PHI.length;s++){const c=Math.cos(totYaw+PHI[s]);if(c>best){best=c;near=s;}}
  document.getElementById('st').innerHTML=`resolving block <b>${near+1}/${SECTIONS.length}</b> · ${(Math.max(0,best)*100|0)}% — “${SECTIONS[near]}”`;
  requestAnimationFrame(draw);
}
resize();requestAnimationFrame(draw);
</script>
</body>
</html>
