[package]
name = "gpu-gemm"
version = "0.1.0"
edition = "2021"
description = "Transformer GPU kernels on wgpu→Vulkan (GEMM, linear, Q4_0 dequant, softmax, RMSNorm, attention), each CPU-validated. The compute foundation for a wgpu/Burn inference backend."

[lib]
name = "gpu_kernels"
path = "src/lib.rs"

[[bin]]
name = "kernel-validate"
path = "src/main.rs"

[[bin]]
name = "logscope-serve"
path = "src/serve.rs"

[dependencies]
libc = "0.2"     # madvise(WILLNEED) on predicted expert ranges — see prefetch.rs
memmap2 = "0.9"  # mmap GGUFs (big-model loading) — scoped infra dep, not RAM-loading 40GB files
wgpu = "29"
naga = "29"  # in-process WGSL validation (the shader fitness gate) — pure Rust, no GPU
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Optional: UNSAFE zero-copy weight residency (import mmap'd GGUF pages as GPU memory via
# VK_EXT_external_memory_host). Behind a feature so the default upload path is untouched.
ash = { version = "0.38", optional = true }

[[bin]]
name = "zerocopy-probe"
path = "src/bin/zerocopy-probe.rs"
required-features = ["zerocopy"]

[[bin]]
name = "caps-probe"
path = "src/bin/caps-probe.rs"

[[bin]]
name = "diffstep-bench"
path = "src/bin/diffstep-bench.rs"

[[bin]]
name = "gemmshape-bench"
path = "src/bin/gemmshape-bench.rs"

[features]
# scoped experiment: does NOT wire into the live loader — a self-contained import path + probe you can
# compile and run on the M2 to see whether Honeykrisp supports external-memory-host import at all.
zerocopy = ["dep:ash", "wgpu/vulkan"]
# sparse residency: one giant buffer backed by physical blocks via vkQueueBindSparse (the arena's
# architectural replacement). Gated like zerocopy — pure planner is always on; the binder needs this.
sparse = ["dep:ash", "wgpu/vulkan"]
# AArch64 only: compile cpumatvec's int8 dots a second time with `dotprod` enabled and pick that copy
# at runtime when the CPU reports the feature (Apple M1+, Cortex-A76+; NOT the PinePhone's A53 or the
# Pro's A72 — which is why this is runtime dispatch and not `target-cpu`). OPT-IN, and honestly so:
# the sandbox this was written in has no AArch64 std, so this arm has NEVER BEEN COMPILED. Its x86-64
# twin (AVX2, same macro, same shape) is compiled, tested and on by default. If this fails to build
# on your machine, turn it back off and nothing else changes.
arm-dotprod = []

[dev-dependencies]
serde_json = "1"  # independent oracle for jsonmask tests only
