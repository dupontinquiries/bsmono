[package]
name = "beatspace"
version = "0.1.0"
edition = "2021"
description = "Rust port of the kBM3 mel-spectrogram GAN: train on your own audio, then drag through latent space and hear beats morph in realtime."

[[bin]]
name = "beatspace"
path = "src/main.rs"

[dependencies]
# Experimental video upscaling. Path deps, optional, so a default build of
# beatspace neither compiles nor downloads any of it.
d2x-core = { path = "../bscale/crates/d2x-core", optional = true }
d2x-wgpu = { path = "../bscale/crates/d2x-wgpu", optional = true }
# Native folder picker for the training page. xdg-portal so it works under a
# Wayland compositor on mobile Linux without dragging in GTK — this fleet
# targets postmarketOS as well as desktops.
#
# Placed at the TOP of this section deliberately: appended at the bottom it
# landed inside [profile], which is a legal table, so cargo parsed the file
# without complaint and simply did not have the dependency.
# rfd REMOVED. Its xdg-portal backend goes through ashpd -> zbus, and the
# "tokio" feature made zbus demand a tokio reactor that an egui frame does not
# have — pick_folder panicked outright. zbus features are additive, so that
# flag also broke eframe's accesskit thread, which panicked at startup with the
# same message and had nothing to do with file dialogs.
#
# uikit_egui::path_picker replaces it: in-window, no portal, no bus, and it
# works on a phone where a desktop file dialog is somebody else's full-screen
# UI with its own touch targets.

# --- neural net (pure-Rust, CPU by default; see README for GPU) ---
candle-core = "0.11"
candle-nn   = "0.11"

# --- GUI ---
# default-features = false + glow: eframe 0.34's defaults enable wgpu and NOT
# glow, and egui-wgpu's default device request (Limits::default, 8 color
# attachments, unclamped) crashed snapshot-cam at startup on a phone GPU that
# allows 5. glow is what the rest of the fleet ships; eframe_backend_check.py
# enforces it.
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
# 0.34, matching the other thirteen egui apps and uikit-egui. beatspace was the
# only crate on 0.35, which meant the kit's Ui and this app's Ui were different
# types and no shared widget could cross — another manifest in this tree already
# carries the comment "must match uikit-egui, or Color32 and Sense are different
# types", learned the same way.
egui   = { version = "0.34", optional = true }
uikit-egui = { path = "../../shared/uikit/crates/uikit-egui", optional = true }

# --- realtime audio out ---
# Optional, behind the default-on `app` feature. cpal pulls alsa-sys, which
# needs libasound2-dev present at BUILD time — so with cpal unconditional the
# whole crate, including the headless trainer and the smoke test, could not be
# compiled on a machine without ALSA headers. Same shape as blackstar-rs
# gating `audio` and studio-media gating `opus`, and for the same reason.
cpal = { version = "0.18", optional = true }

# --- DSP ---
rustfft = "6.4"
hound   = "3.5"          # wav export of generated beats

# --- audio decoding ---
# symphonia handles wav / flac / mp3 / m4a / ogg-vorbis. It does NOT ship an
# Opus codec, so .opus files go through the ogg + opus crates below.
symphonia = { version = "0.6", default-features = false, features = [
    "wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis",
] }
# Both optional, behind the default-on `opus` feature. The `opus` crate pulls
# audiopus_sys, which BUILDS libopus from C via cmake — so with it
# unconditional, a machine without cmake could not compile the crate at all,
# including the trainer and the smoke test, neither of which decodes anything.
# Same treatment studio-media already gives its own opus support.
ogg  = { version = "0.9", optional = true }   # ogg container demux for .opus
opus = { version = "0.3", optional = true }   # libopus codec (system libopus + pkg-config)
# The FLAC encoder (pure Rust, lifted from studio-media) for project audio
# and exports when the preference says lossless-but-smaller-than-wav.
audio-kit = { path = "../../shared/audio-kit" }
# GPU (or, absent real hardware, software-rasterized via Mesa llvmpipe)
# texture upload/render for decoded video frames. Loaded dynamically
# (libEGL.so.1 at runtime, not linked) so a build without any EGL/GL
# present still compiles and simply reports the capability unavailable —
# same "probe, don't assume" discipline as opus-encode's pkg-config check.
glow = { version = "0.17", optional = true }
khronos-egl = { version = "6", optional = true, features = ["dynamic"] }
libloading = { version = "0.8", optional = true }
# Ogg Opus WRITING, for the same preference set to opus. Its `encode`
# feature is real FFI to libopus (audiopus), so it is behind `opus-encode`
# here: off, an opus preference is refused with a message naming the
# feature, like `opus-decode`.
opus-kit = { path = "../../shared/opus-kit", optional = true }

# --- misc ---
anyhow = "1"
crossbeam-channel = "0.5"
clap   = { version = "4", features = ["derive"] }
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
rand   = "0.8"
rayon  = "1"

# --- optional GPU compute backend (wgpu -> Vulkan/Metal/DX12) ---
# Used by `--features gpu` to run batched generator inference on the GPU.
# wgpu reaches the Apple GPU on Asahi via Vulkan (Mesa), and Metal/DX12/GL
# elsewhere, so it works where candle's CUDA/Metal backends don't.
wgpu     = { version = "27", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"

# Enable one of these to train/generate on a GPU instead of CPU, e.g.
#   cargo run --release --features cuda  -- train ...
#   cargo run --release --features metal -- gui   ...

[features]
default = ["app", "opus-decode"]
# The interactive application: the realtime player (cpal) and the egui GUI.
# Off means a CLI-only build — `train` and `smoke` — which is what CI, a
# sandbox, and a headless phone image actually need, and what lets the smoke
# test hold to its promise of running anywhere.
app = ["dep:cpal", "dep:eframe", "dep:egui", "dep:uikit-egui"]
# .opus decoding. Off means .opus files are refused with a message naming the
# feature, rather than the crate failing to build.
opus-decode = ["dep:ogg", "dep:opus"]
# .opus WRITING (project audio, exports). Needs system libopus like decode.
opus-encode = ["dep:opus-kit", "opus-kit/encode"]
# The GPU texture upload/render path for decoded video frames (see
# arrange::video::gl_playback). Independent of `app`: it needs an EGL
# library at runtime, not an eframe window, and is tested standalone.
gpu-playback = ["dep:glow", "dep:khronos-egl", "dep:libloading"]
cuda  = ["candle-core/cuda",  "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
# Batched generator inference on the GPU via wgpu (Vulkan on Asahi/Linux).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Video super-resolution for rendered output, via apps/bscale's headless
# engine. OFF BY DEFAULT and deliberately so: it is experimental, it pulls
# image+rayon, and the useful photo models are 67 MB downloads the operator
# supplies from ~/models. Off means an upscale request is refused with a
# message naming the feature — the same posture as `opus-decode` above —
# rather than the crate failing to build.
upscale = ["dep:d2x-core"]
# The same, on the GPU. Implies `gpu` because it shares the wgpu stack rather
# than standing up a second one.
upscale-gpu = ["upscale", "gpu", "dep:d2x-wgpu"]

# Compile-speed policy (monorepo-wide, dev only): full DWARF is the single biggest
# artifact + link cost in these workspaces, and the sandbox/CI boxes are disk-starved.
# line-tables-only keeps file:line in backtraces (the part actually read) while
# cutting debuginfo ~10x. Release profiles are untouched. Override locally with
# CARGO_PROFILE_DEV_DEBUG=2 when a debugger session needs full types.
[profile.dev]
debug = "line-tables-only"


[dev-dependencies]
# `wgsl-in` explicitly: naga ships default = [] and puts `front::wgsl`
# behind that feature, so a bare `naga = "29"` compiles the crate fine and
# fails every `cargo test` with "cannot find `wgsl` in `front`". The shader
# validation tests in wgpu_train.rs are the only consumer, and they are the
# reason it is a dev-dependency rather than a real one.
naga = { version = "29", features = ["wgsl-in"] }
