[package]
name = "cad-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The skydribble-derived wgpu renderer inside an egui_wgpu paint callback: meshgen, orbit camera, one lit pass."

[dependencies]
cad-kernel.workspace = true
cad-tex.workspace = true
glam.workspace = true
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
log.workspace = true

[dev-dependencies]
# Offline WGSL validation so shader errors are caught by `cargo test`, not at runtime (skydribble convention).
naga = { version = "29", features = ["wgsl-in"] }
