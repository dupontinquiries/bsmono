# A worked pool manifest: what a game would take from the corpus, and what it will spend.
#
# This is a statement of intent that lives beside the game, so "why does this ship these assets"
# has an answer somebody wrote rather than a command somebody once ran. Planning is always a dry
# run; nothing is copied without an explicit --apply.
name = "cadscope-demo"

# Which corpus kinds to draw from. Omit to take everything.
kinds = ["model", "texture"]

# Names to leave out. `*` matches any run of characters; anything else is literal.
exclude_names = ["prototype_*", "*_wip", "*_scrap"]

# Path fragments to leave out, matched anywhere in the path.
exclude_paths = ["/target/", "/scratch/"]

[budget]
# Accepts the v2 scripts' spelling: 15G, 500M, 1024.
bytes = "64M"
# Advisory only — reported, never silently enforced, because a budget that drops a model the game
# needs is worse than one that warns.
triangles = 4000000
