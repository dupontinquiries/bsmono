# logind reads the power key itself, independently of the compositor, and by
# default powers the phone off on a short press. That is the "shutdown" seen
# on the FP5 with tideshell running. A short press belongs to the shell
# (sleep/wake, via cosmic-comp -> `tideshell ctl power-key`); a LONG press
# still powers off, so a hung shell never leaves the phone unkillable.
#   sudo install -Dm644 50-tideshell-powerkey.conf /etc/systemd/logind.conf.d/50-tideshell-powerkey.conf
#   sudo systemctl kill -s HUP systemd-logind      # reload without ending the session
# (tideshell also holds logind's handle-power-key inhibitor while it runs;
# this file covers the time it does not, e.g. while it restarts.)
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
