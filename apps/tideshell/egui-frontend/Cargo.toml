[package]
name = "tideshell-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "egui surfaces for tideshell (drawer, right bar, switcher, hold arc, trackpad pad, settings sheet, trace overlay) plus the executor layer that turns tideshell-core Actions into effects: hatch-core launches and `hatch-egui --toggle`, rusty-board over D-Bus, prefs persisted as flat shell.* keys. The `tideshell-sim` binary runs the whole shell in a phone-sized window over simulated windows, so the loop can be driven and screenshotted without a compositor."

[lib]
path = "src/lib.rs"

[[bin]]
name = "tideshell"
path = "src/bin/tideshell.rs"
required-features = ["layer", "ei"]

[[bin]]
name = "tideshell-sim"
path = "src/bin/tideshell_sim.rs"
required-features = ["app", "sensors"]

[features]
default = ["app", "wayland", "ei", "layer"]
app = ["dep:eframe"]
# Real windows via systemcompkit (ext-foreign-toplevel-list + zcosmic
# toplevel info/management). Pure-Rust wayland-client: no libwayland link.
wayland = ["dep:systemcompkit"]
# Trackpad output over libei to cosmic-comp (needs cosmic-comp patch 0002).
ei = ["dep:reis", "dep:zbus"]
# Ambient light (iio-sensor-proxy / IIO sysfs) + backlight (logind / sysfs).
sensors = ["dep:zbus", "dep:libc"]
# The real shell: layer-shell edge strips + an egui overlay on EGL (egui_glow).
# Links libwayland-client and libEGL, unlike the pure-Rust `wayland` feature.
layer = ["wayland", "dep:wayland-client", "dep:wayland-protocols-wlr", "dep:wayland-egl", "dep:khronos-egl", "dep:egui_glow", "dep:glow", "dep:rustix", "dep:wayland-protocols", "dep:xkbcommon", "sensors"]

[dependencies]
tideshell-core = { path = "../crates/tideshell-core" }
speaker-pose = { path = "../../../shared/speaker-pose" }
hatch-core = { path = "../../hatch/crates/hatch-core" }
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
# Publishes the living palette to $XDG_RUNTIME_DIR/tideshell.palette so apps
# (vidkit first) can dress to match. Zero dependencies.
ambient-palette = { path = "../../../shared/ambient-palette" }
# Sensor mounting (camera_sensor_rotation) and the upright turn; std-only. The pane used to
# show the room turned 90 degrees clockwise because nothing read it.
capture-kit = { path = "../../../shared/capture-kit" }
settings-kit = { path = "../../../shared/settings-kit" }
systemcompkit = { path = "../../../shared/systemcompkit", features = ["wayland_io"], optional = true }
egui = "0.34"
# Same reis as cosmic-comp epoch-1.8.0's Cargo.lock (protocol parity).
reis = { version = "0.7.1", optional = true }
zbus = { version = "5", optional = true }
wayland-client = { version = "0.31", features = ["system"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
wayland-egl = { version = "0.32", optional = true }
# Keymap + keysym translation for wl_keyboard (links libxkbcommon, which
# cosmic-comp already depends on).
xkbcommon = { version = "0.8", optional = true }
# wp_cursor_shape_v1 (needs both staging and unstable: it references tablet v2).
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
khronos-egl = { version = "6", features = ["static"], optional = true }
egui_glow = { version = "0.34", optional = true }
glow = { version = "0.17", optional = true }
libc = { version = "0.2", optional = true }
rustix = { version = "1", features = ["event", "fs", "time"], optional = true }
# Glow chosen explicitly (eframe_backend_check): wgpu's default device asks for
# more colour attachments than phone GPUs allow. Same reasoning as hatch-egui.
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
mimalloc = { version = "0.1.52", default-features = false }
