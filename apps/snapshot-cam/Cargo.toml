[package]
name = "snapshot-cam"
version = "0.1.0"
edition = "2021"
description = "A local camera: take a photo, keep it on this device, and hand it to photosync or a snapclone contact when you choose to."

[[bin]]
name = "snapshot-cam"
path = "src/main.rs"
required-features = ["app"]

[features]
# Default-on so `cargo build --release` produces the deployable binary, the
# convention the rest of the fleet uses. The LIBRARY is feature-free, so
# `--no-default-features` gives a headless core that tests without a display:
# the roll, the sharing rules, the store, the camera rig (capture-kit is
# std-only), the handoffs — everything but the window.
default = ["app"]
app = ["dep:eframe", "dep:egui", "dep:uikit-egui"]

[dependencies]
# default-features = false + glow, the fleet pattern (see voiceterm-egui's
# manifest for the build-size half of the reason). The runtime half was
# learned HERE: eframe 0.34's default features include wgpu but not glow, so
# Renderer::default() picked wgpu, and egui-wgpu's default device descriptor
# requests wgpu::Limits::default() — max_color_attachments: 8 — without
# clamping to the adapter. On a phone GPU that allows 5, the app died at
# startup with Wgpu(RequestDeviceError(LimitsExceeded)). glow never requests
# device limits; it is also what every other 0.34 app here ships.
# maintenance/tools/eframe_backend_check.py enforces the pattern tree-wide.
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = { version = "0.34", optional = true }
# THE SHARED KIT. Optional and in the same feature as egui, so the headless
# library still tests without a display. Brings the symbol fonts and — the
# reason it is worth the edge on an app this small — the IME request that lets
# an on-screen keyboard reach a text field at all. See shared/uikit's `ime`.
uikit-egui = { path = "../../shared/uikit/crates/uikit-egui", optional = true }
# THE CAMERA. capture-kit runs gst-launch-1.0 as a subprocess and reads raw
# RGBA frames off its stdout; device-kit (through it) decides which camera
# and which pipeline. std-only, so the rig is in the headless library and
# tested there with the kit's test pattern.
capture-kit = { path = "../../shared/capture-kit" }
# JPEG for the roll (encode only — the decoder is for re-reading thumbnails
# after a restart).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# XDG paths, the roll file, snapclone's contact book and photosync's root.
config-kit = { path = "../../shared/config-kit" }
# The file-based handoff to snapclone: the request goes in its outbox, the
# outcome comes back beside it.
snap-handoff = { path = "../../shared/snap-handoff" }

[dev-dependencies]
tempfile = "3.8"
