[workspace]
resolver = "2"
members = ["crates/d2x-core", "crates/d2x-wgpu", "crates/d2x-job", "crates/bscale"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = ""

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
# wgpu 29 matches gpu-gemm and gpu-kit's `wgpu29` feature — the two compute
# users already verified on Honeykrisp. beatspace is on 27 only because eframe
# pins it there; a headless crate has no such constraint.
wgpu = "29"
naga = { version = "29", features = ["wgsl-in"] }
pollster = "0.4"
# Phase correlation (global motion for the plate reference) — the same pair
# fao_codec_lib uses; pure Rust, no system deps.
rustfft = "6.2"
num-complex = "0.4"

# Compile-speed policy (monorepo-wide, dev only): see apps/beatspace/Cargo.toml.
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
