[package]
name = "d2x-job"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dandere2x as a library job: ffmpeg in/out, backend construction, keyframe-aligned segment parallelism, stage/progress events. What the CLI, the egui shell and studio's clip bounce all call."

[dependencies]
d2x-core = { path = "../d2x-core" }
d2x-wgpu = { path = "../d2x-wgpu", optional = true }
anyhow.workspace = true
image.workspace = true
serde_json.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:d2x-wgpu"]
