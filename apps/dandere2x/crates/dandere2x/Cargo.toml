[package]
name = "dandere2x"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dandere2x CLI + egui app: ffmpeg in, block-matched residual super-resolution on wgpu, AV1 out."

[[bin]]
name = "dandere2x"
path = "src/main.rs"

[dependencies]
d2x-core = { path = "../d2x-core" }
# GPU backend behind a default-on feature so a headless box can still build
# the CLI with --no-default-features (cpu / bicubic backends only).
d2x-wgpu = { path = "../d2x-wgpu", optional = true }
anyhow.workspace = true
clap.workspace = true
image.workspace = true
serde_json.workspace = true
# The shell. Glow renderer stated explicitly (see fao-codec-egui); wgpu's
# default limits die on phone GPUs.
egui = { version = "0.34", optional = true }
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow", "wayland", "x11"] }
uikit-egui = { path = "../../../../shared/uikit/crates/uikit-egui", optional = true }
snapclone-theme = { path = "../../../../shared/uikit/crates/snapclone-theme", optional = true }

[features]
default = ["gpu", "app"]
gpu = ["dep:d2x-wgpu"]
app = ["dep:egui", "dep:eframe", "dep:uikit-egui", "dep:snapclone-theme"]
