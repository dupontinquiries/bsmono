# cockpit — the Qt-free library of "fleet cockpit" operations (build, deploy, import,
# place, merge, reclaim, keys, app-catalog, previews). Shared by every frontend so the
# GUI and CLI have identical capabilities over one implementation, per the workspace's
# "pure core + thin wiring" philosophy.
[package]
name = "cockpit"
version = "0.1.0"
edition = "2021"

[lib]
name = "cockpit"
path = "src/lib.rs"

[dependencies]
# depot's shared core: its API types and Alpine index/closure logic, so
# gitmind and depot agree on formats by construction (no socket code in it).
depot-core = { path = "../../../depot/crates/depot-core" }
repo-map = { path = "../../../../shared/repo-map" }
serde_json = "1"
gitmind-core = { path = "../core" }
peek = { path = "../../../../tools/peek" }
net-kit = { path = "../../../../shared/net-kit" }
depot-auth = { path = "../../../../shared/depot-auth" }
# SHA-256 for the join script fingerprint (already in the graph via depot-auth).
sha2 = "0.10"
proc-kit = { path = "../../../../shared/proc-kit" }
