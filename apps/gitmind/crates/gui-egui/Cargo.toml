[package]
name = "gitmind-egui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gitmind-egui"
path = "src/main.rs"
required-features = ["app"]

[lib]
path = "src/lib.rs"
# No doctests here, and the rustdoc target was producing nothing but noise:
# `cargo test` reported E0463 "can't find crate for `uikit_egui`" from the
# --doc target while the lib itself compiled clean. This crate has no runnable
# doctest to lose (it has no fenced doc blocks at all), so the target's entire
# output was a false failure.
#
# This removes a WRONG SIGNAL; it does not explain it. What is known: the
# rustdoc invocation carried a correct `--extern uikit_egui=...rlib` and still
# could not resolve it. What ruled out the obvious theory: ambient-learner
# (49 compiled doc blocks), logscope-egui (18) and snapclone-egui (9) all
# depend on uikit-egui, all have real doctests, and all PASS -- so this is not
# a blanket target-dir or dependency problem, and the cause is still unknown.
# It may well resurface on a crate that does have doctests, where turning them
# off would not be the right answer.
doctest = false

[dependencies]
egui = "0.34"
# Image loading. egui::Image with a file:// URI renders NOTHING without a
# registered loader and reports no error — the tile is simply absent, which is
# indistinguishable from an app that has no screenshot. Needed for the Apps
# page's preview tiles.
egui_extras = { version = "0.34", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow", "wayland", "x11"] }
cockpit = { path = "../cockpit" }
# Letter-tile icons for AppLoad's sidebar, drawn with the same rasterizer the
# tablet uses. Same egui 0.34 as this crate.
eink-kit = { path = "../../../../shared/eink-kit" }
# The peek engine, same as the Qt gui links. PeekViewer's whole job is calling
# peek::view::read_to_string — the spec grammar (5xx, 5k, @symbol, A-B) is
# parsed there, so the port is a viewer over an existing call rather than a
# reimplementation of the grammar.
peek = { path = "../../../../tools/peek" }
gitmind-core = { path = "../core" }
uikit-egui = { path = "../../../../shared/uikit/crates/uikit-egui" }
# Voice intents: the routing brain apps register with. gitmind is two-handed work
# (a phone in one hand, a device in the other), which is what voice is for.
voiced-core = { path = "../../../../shared/voiced-core" }
touchkit = { path = "../../../../shared/touchkit", features = ["egui"] }
settings-kit = { path = "../../../../shared/settings-kit" }
snapclone-theme = { path = "../../../../shared/uikit/crates/snapclone-theme" }
serde_json = "1"

[features]
# the runnable eframe app, DEFAULT-ON per the house convention for every -egui port
# (`cargo build --release` must produce the deployable bin — see manifest/projects.toml).
# Headless lib for CI / sandbox verification: `--no-default-features` (App + pages + tests
# compile without eframe or a display).
default = ["app"]
app = ["dep:eframe"]
