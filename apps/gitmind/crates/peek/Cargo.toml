# peek — fast line-range file viewer (lib + two bins), now part of the
# gitmind toolbox. The library exposes the indexed viewer the GUI uses to
# render file content; the bins (`peek`, `peek2`) ship as standalone tools.
[package]
name = "peek"
version = "0.2.0"
edition = "2021"
description = "Fast line-range file viewer with bucket notation support"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
globwalk = "0.9"
anyhow = "1.0"
thiserror = "2.0"

[lib]
name = "peek"
path = "src/lib.rs"

[[bin]]
name = "peek"
path = "src/bin/peek.rs"

[[bin]]
name = "peek2"
path = "src/bin/peek2.rs"

[dev-dependencies]
tempfile = "3"
