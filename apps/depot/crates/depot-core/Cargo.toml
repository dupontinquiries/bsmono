[package]
name = "depot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless core of the offline mirror: content-addressed object store + catalog, cargo sparse-index derivation from .crate files, dnf repodata from RPM headers (no createrepo_c), Nix binary-cache ingest, Rust toolchain bundles, and signed deduplicated sync packs. No network, no threads — the CLI and the web shell drive it."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
crypto-kit = { path = "../../../../shared/crypto-kit" }
depot-auth = { path = "../../../../shared/depot-auth" }
zeroize = "1"
zstd = { version = "0.13", optional = true }

[features]
default = []
# repodata compressed with zstd (dnf >= 4.4 / dnf5). Off by default because
# zstd-sys is C: fine natively, one more cross toolchain to set up for musl.
zstd = ["dep:zstd"]
