app-id: org.snapclone.SnapClone
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk//6.7
command: snapclone
finish-args:
  # Wayland + X11 display
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Network (P2P connections)
  - --share=network
  # Microphone + camera
  - --device=all
  # User data directory (snaps, DB, identity)
  - --filesystem=xdg-data/snapclone
  # PipeWire for camera-bridge
  - --filesystem=xdg-run/pipewire-0
  # D-Bus for DataBus, GeoClue, PowerDevil
  - --socket=session-bus
  - --talk-name=org.freedesktop.GeoClue2
  - --talk-name=org.freedesktop.portal.PowerManagement
  - --talk-name=org.kde.Solid.PowerManagement
  - --own-name=org.snapclone.DataHub
modules:
  - name: snapclone
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSNAPCLONE_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ..
    post-install:
      - install -Dm644 packaging/org.snapclone.SnapClone.desktop
          /app/share/applications/org.snapclone.SnapClone.desktop
      - install -Dm644 packaging/org.snapclone.SnapClone.metainfo.xml
          /app/share/metainfo/org.snapclone.SnapClone.metainfo.xml
      # Install camera-bridge sidecar binary
      - install -Dm755 target/release/camera-bridge
          /app/lib/snapclone/camera-bridge
      - install -Dm755 target/release/snapclone-bus
          /app/lib/snapclone/snapclone-bus
