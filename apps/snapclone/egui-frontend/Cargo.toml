[package]
name = "snapclone-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "snapclone's UI ported to egui on uikit-egui. The founder app now *consumes* the systems it originated: live backgrounds (uikit-egui::livebg) and page/subpage navigation (uikit-egui::nav), plus adaptive + a11y + gesture + live settings. Camera/peer panes on the carved surface; the snapclone-* engine crates (audio/proto/net-intel, all Qt-free) drive it on-device."

[lib]
path = "src/lib.rs"

[[bin]]
name = "snapclone-egui"
path = "src/bin/snapclone_egui.rs"
required-features = ["app"]

[features]
default = ["app", "opus"]
app = ["dep:eframe"]
# Opus voice (voice_codec). Needs libopus (opus-dev / libopus-dev) at build
# time; without it, `--no-default-features --features app` sends raw S16LE and
# tells the host so.
opus = ["dep:snapclone-audio", "snapclone-audio/opus"]

[dependencies]
# JPEG for the send path. Pure Rust, no native encoder: `default-features =
# false` keeps out the formats this app will never read, and `jpeg` alone is
# what takes a 1080p snap from 6.2 MB on the wire to about 300 KB. See
# src/media_encode.rs for why not AV1 yet.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The AV1 encoder PLAN, shared with the Qt app rather than reimplemented.
# `Av1Policy.hpp` says in its own header that it mirrors this crate's
# `plan_for`; a third copy of those numbers is how three copies disagree.
snapclone-av1policy = { path = "../rust/snapclone-av1policy" }
snapclone-audio = { path = "../rust/snapclone-audio", optional = true, default-features = false }
# The composer tile-strip decision model. A real dependency rather than a
# #[path] include: it is a standalone crate with an rlib target, and its `ffi`
# module uses `crate::` paths that break when a lib.rs is pulled in as a
# submodule. The #[path] trick is for modules living inside an app crate; this
# is not one.
snapclone-composer = { path = "../rust/snapclone-composer" }
# The connection-request approval lifecycle. A dependency for the same reason
# the composer is: it ships an rlib, and its modules use crate:: paths that
# resolve to the wrong crate under a #[path] include.
snapclone-mailbox = { path = "../rust/snapclone-mailbox" }
# The DHT half of discovery. `discovery_enabled().1` has been honest and
# unconsumed since it was added; this is what consumes it.
snapclone-presence = { path = "../rust/snapclone-presence" }
# For `NodeId` in identity::dht_node_id. The engine itself is reached
# through snapclone-presence; this is the type only.
snapcore = { path = "../../../shared/snapcore" }
# STUN codec for the punch socket. Zero deps; see nat_traversal.
nat-kit = { path = "../../../shared/nat-kit" }
# SHA-256 for the DHT endpoint envelope. Already in this crate's lock as a
# transitive dependency, so naming it directly does not move the lockfile —
# and the Qt build's format is defined in terms of SHA-256, so matching it
# byte for byte is not a place to substitute a different primitive.
sha2 = "0.10"
# Location freshness. Its opacity/presentation/last_seen_label are view
# functions with no view; the wayfinder was drawing arrows without asking
# whether the position behind them was worth pointing at.
snapclone-location = { path = "../rust/snapclone-location", default-features = false }
# The camera bridge device-kit was written for — its description names
# snapclone explicitly, and no port had ever depended on it.
# One authenticated session per peer, streams on demand. The roster was a
# hardcoded Vec<Peer> of names with an online bool.
peermux-core = { path = "../../../shared/peermux-core" }
# Gesture recognition EXTRACTED FROM SNAPCLONE — its own description says so —
# while the composer hand-rolled a swipe threshold.
touchkit = { path = "../../../shared/touchkit" }
# XDG paths + a flat [section] key=value store. The settings page has a Save
# button that persisted nothing.
config-kit = { path = "../../../shared/config-kit" }
crypto-kit = { path = "../../../shared/crypto-kit" }
# The shared mailbox: content-addressed postings with a Lifetime/TTL that is
# exactly a disappearing snap, modelled in isolation until now.
share-kit = { path = "../../../shared/share-kit" }
device-kit = { path = "../../../shared/device-kit" }
egui = "0.34"
# `qrbig` for a REAL QR code. The kit's default `qr` is a QR-shaped identicon --
# its own header says "there is no Reed-Solomon encoder ... A real QR reader
# will not decode it" -- so snapclone was showing a code that the scanner it
# ships could not read. voiceterm-egui already turns this on.
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui", features = ["qrbig"] }
uikit-gesture = { path = "../../../shared/uikit/crates/uikit-gesture" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../shared/settings-kit" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }
rqrr = { version = "0.11.0", default-features = false }

[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }

[workspace]
