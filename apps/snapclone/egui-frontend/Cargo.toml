[package]
name = "snapclone-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "snapclone's UI ported to egui on uikit-egui. The founder app now *consumes* the systems it originated: live backgrounds (uikit-egui::livebg) and page/subpage navigation (uikit-egui::nav), plus adaptive + a11y + gesture + live settings. Camera/peer panes on the carved surface; the snapclone-* engine crates (audio/proto/net-intel, all Qt-free) drive it on-device."

[lib]
path = "src/lib.rs"

[[bin]]
name = "snapclone-egui"
path = "src/bin/snapclone_egui.rs"
required-features = ["app"]

[features]
default = ["app"]
app = ["dep:eframe"]

[dependencies]
# The camera bridge device-kit was written for — its description names
# snapclone explicitly, and no port had ever depended on it.
device-kit = { path = "../../../shared/device-kit" }
egui = "0.34"
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
uikit-gesture = { path = "../../../shared/uikit/crates/uikit-gesture" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../shared/settings-kit" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }

[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }

[workspace]
