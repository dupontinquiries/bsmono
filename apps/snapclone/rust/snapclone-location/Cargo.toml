[package]
name        = "snapclone-location"
version     = "0.1.0"
edition     = "2021"
description = "Location fix types, haversine distance, and IP-geolocation client for SnapClone"

[lib]
name       = "snapclone_location"
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow  = "1"
chrono  = { version = "0.4", features = ["serde"] }
serde   = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }
tokio   = { version = "1", features = ["time"], optional = true }
tracing = "0.1"

[features]
default  = []
http     = ["reqwest", "tokio"]  # enable the IP-geo HTTP client
