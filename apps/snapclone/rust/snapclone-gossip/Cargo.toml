[package]
name        = "snapclone-gossip"
version     = "0.1.0"
edition     = "2021"
description = "UDP gossip peer discovery protocol for SnapClone"

[lib]
name       = "snapclone_gossip"
crate-type = ["rlib"]

[dependencies]
snapclone-identity = { path = "../snapclone-identity" }
snapclone-wire     = { path = "../snapclone-wire" }
anyhow  = "1"
bytes   = "1"
chrono  = { version = "0.4", features = ["serde"] }
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
rand    = "0.8"
tracing = "0.1"
tokio   = { version = "1", features = ["net", "time", "rt"] }
