[package]
name        = "snapclone-proto"
version     = "0.1.0"
edition     = "2021"
description = "SnapClone v3 wire protocol — serialisation, chunking, reassembly"

[lib]
name       = "snapclone_proto"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow  = "1"
bytes   = "1"
sha2    = "0.10"
hex     = "0.4"
serde   = { version = "1", features = ["derive"] }
tracing = "0.1"
uuid    = { version = "1", features = ["v4"] }
