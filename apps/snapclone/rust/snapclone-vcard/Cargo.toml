[package]
name        = "snapclone-vcard"
version     = "0.1.0"
edition     = "2021"
description = "vCard 3.0 serialiser and parser for SnapClone contacts — usable in any Rust project"

[lib]
name       = "snapclone_vcard"
crate-type = ["rlib"]

[dependencies]
anyhow  = "1"
chrono  = { version = "0.4", features = ["serde"] }
uuid    = { version = "1", features = ["v4"] }
