[package]
name        = "snapclone-core"
version     = "0.1.0"
edition     = "2021"
description = "Pure business logic for SnapClone — no UI, no network, no runtime assumptions"

[lib]
name       = "snapclone_core"
crate-type = ["rlib"]

[dependencies]
snapclone-identity = { path = "../snapclone-identity" }
snapclone-storage  = { path = "../snapclone-storage"  }
anyhow  = "1"
chrono  = { version = "0.4", features = ["serde"] }
serde   = { version = "1", features = ["derive"] }
uuid    = { version = "1", features = ["v4"] }
