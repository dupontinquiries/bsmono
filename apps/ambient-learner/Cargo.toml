[package]
name = "ambient-learner"
version = "0.1.0"
edition = "2021"

# The egui build's own library. Separate from main.rs, which is
# 7,048 lines of GTK and does not compile without gtk4/adw/glib — building with
# --features egui produced 240 errors, all of them unguarded gtk:: paths there.
# NOTE: `required-features` is IGNORED on [lib]. Cargo honours it for bins,
# examples, tests and benches only — silently, with no warning — so this target
# built unconditionally and its 121 "cannot find crate `egui`" errors were the
# feature being off, not the code being wrong. The gate lives at the top of
# src/egui_lib.rs instead, where it works.
[lib]
name = "ambient_learner_egui"
path = "src/egui_lib.rs"
# The engine's doc snippets were written for the binary, where rustdoc
# never compiled them; see egui-frontend/Cargo.toml.
doctest = false

# The GTK binary. Declared rather than auto-discovered from src/main.rs,
# because an auto-discovered [[bin]] carries no required-features and so builds
# on every invocation — 239 "cannot find crate gtk" errors the moment anyone
# builds --no-default-features, which is how the egui frontend has to be built.
#
# Same shape as the [lib] problem one section down: the manifest could not say
# what it meant, so the error surfaced in the source files instead.
[[bin]]
name = "ambient-learner"
path = "src/main.rs"
required-features = ["gtk"]

# The runnable egui frontend. required-features is honoured on [[bin]] — unlike
# on [lib], where it is silently ignored (see the note above the [lib] section).
[[bin]]
name = "ambient-egui"
path = "src/bin/ambient-egui.rs"
required-features = ["egui-app"]

[features]
default = ["gtk"]
gtk = ["gtk4", "libadwaita", "glib"]
iced = []
egui = ["dep:egui", "dep:uikit-egui", "dep:weather-share"]
# The RUNNABLE egui frontend: the `egui` feature above is the view library only,
# which is why this app reported "no binary" in the parity audit while having
# ported pages. A library nothing launches is not a port anyone can use.
#
# Mutually exclusive with `iced`, per the dependency note below: iced 0.12 caps
# web-sys below what eframe 0.34 needs, so enabling both fails to RESOLVE rather
# than fails to compile — which is a confusing way to discover it.
egui-app = ["egui", "dep:eframe"]
qt = ["qmetaobject", "qttypes"]
dbus = ["zbus"]
# Expose a public D-Bus service + watch the XDG inbox directory.
# Implies `dbus`. Requires `notify` for the filesystem watcher.
service = ["dbus", "notify"]
full = ["gtk", "qt", "dbus", "service"]

[dependencies]
# Real Ed25519 (ed25519-dalek) for device identity and pairing. security.rs
# previously hand-rolled a "keypair" by hashing the private key and signed
# with a symmetric keyed hash, which made pairing verification impossible
# rather than merely weak.
crypto-kit = { path = "../../shared/crypto-kit" }
egui = { version = "0.34", optional = true }
uikit-egui = { path = "../../shared/uikit/crates/uikit-egui", optional = true }
weather-share = { path = "../../shared/weather-share", optional = true }
core-kit = { path = "../../shared/core-kit" }
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
regex = "1.10"
lazy_static = "1.4"
uuid = { version = "1.10", features = ["v4"] }
hex = "0.4"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Compression
flate2 = "1.0"

# Async
async-io = "2.3"
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# GTK dependencies (optional)
# v1_2 needed for MessageDialog, EntryRow; v1_4 for newer features
gtk4 = { version = "0.8", optional = true, features = ["v4_10"] }
libadwaita = { version = "0.6", optional = true, features = ["v1_4"] }
glib = { version = "0.19", optional = true }

# Iced dependencies (optional)
# iced 0.12 caps web-sys at 0.3.67; eframe 0.34 requires >= 0.3.77. The two are
# mutually exclusive in one dependency graph, which is why building --features
# egui-app alongside iced fails to resolve rather than fails to compile.
#
# Both frontends are kept — iced's is 2,031 real lines — but they cannot be
# enabled together, and `full` no longer implies iced. Upgrading iced past 0.12
# would lift the cap and is the proper fix when someone needs both.
# (temporarily removed to test the resolution conflict)

# The window/GL host for the egui frontend. Optional and off by default, so the
# gtk build is unaffected.
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }

# QT dependencies (optional)
# Note: Qt3D support requires system Qt installation with Qt3D module
qmetaobject = { version = "0.2", optional = true }
qttypes = { version = "0.2", optional = true }

# D-Bus (optional, for system integration)
zbus = { version = "4.0", optional = true }

# Filesystem watcher for the XDG inbox (optional, used by `service`)
notify = { version = "6.1", optional = true }

# Optimizations
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bench]]
name = "sensor_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The runnable egui frontend used to be declared here, at
# src/bin/ambient_learner_egui.rs. It moved to the egui-frontend/ crate —
# eframe cannot resolve alongside this crate's optional iced 0.12, which caps
# web-sys below what eframe 0.34 needs — but this declaration stayed behind,
# pointing at a file that no longer exists. `cargo build --features egui-app`
# in this crate therefore failed on a missing source rather than building
# anything. The binary lives in egui-frontend/; there is nothing to declare
# here.
