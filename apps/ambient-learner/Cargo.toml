[package]
name = "ambient-learner"
version = "0.1.0"
edition = "2021"

# The egui build's own library. Separate from main.rs, which is
# 7,048 lines of GTK and does not compile without gtk4/adw/glib — building with
# --features egui produced 240 errors, all of them unguarded gtk:: paths there.
[lib]
name = "ambient_learner_egui"
path = "src/egui_lib.rs"
required-features = ["egui"]

[features]
default = ["gtk"]
gtk = ["gtk4", "libadwaita", "glib"]
iced = ["iced_dep"]
egui = ["dep:egui", "dep:uikit-egui", "dep:weather-share"]
qt = ["qmetaobject", "qttypes"]
dbus = ["zbus"]
# Expose a public D-Bus service + watch the XDG inbox directory.
# Implies `dbus`. Requires `notify` for the filesystem watcher.
service = ["dbus", "notify"]
full = ["gtk", "qt", "dbus", "service"]

[dependencies]
egui = { version = "0.34", optional = true }
uikit-egui = { path = "../../shared/uikit/crates/uikit-egui", optional = true }
weather-share = { path = "../../shared/weather-share", optional = true }
core-kit = { path = "../../shared/core-kit" }
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
regex = "1.10"
lazy_static = "1.4"
uuid = { version = "1.10", features = ["v4"] }
hex = "0.4"

# Database
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# Compression
flate2 = "1.0"

# Async
async-io = "2.3"
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# GTK dependencies (optional)
# v1_2 needed for MessageDialog, EntryRow; v1_4 for newer features
gtk4 = { version = "0.8", optional = true, features = ["v4_10"] }
libadwaita = { version = "0.6", optional = true, features = ["v1_4"] }
glib = { version = "0.19", optional = true }

# Iced dependencies (optional)
# iced 0.12 caps web-sys at 0.3.67; eframe 0.34 requires >= 0.3.77. The two are
# mutually exclusive in one dependency graph, which is why building --features
# egui-app alongside iced fails to resolve rather than fails to compile.
#
# Both frontends are kept — iced's is 2,031 real lines — but they cannot be
# enabled together, and `full` no longer implies iced. Upgrading iced past 0.12
# would lift the cap and is the proper fix when someone needs both.
iced_dep = { package = "iced", version = "0.12", optional = true, features = ["smol"] }

# QT dependencies (optional)
# Note: Qt3D support requires system Qt installation with Qt3D module
qmetaobject = { version = "0.2", optional = true }
qttypes = { version = "0.2", optional = true }

# D-Bus (optional, for system integration)
zbus = { version = "4.0", optional = true }

# Filesystem watcher for the XDG inbox (optional, used by `service`)
notify = { version = "6.1", optional = true }

# Optimizations
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bench]]
name = "sensor_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
