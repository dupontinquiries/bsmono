# A SEPARATE CRATE, deliberately.
#
# The first attempt put an eframe binary in the parent crate and it would not
# resolve: iced 0.12 caps web-sys at 0.3.67 and eframe 0.34 needs >= 0.3.77.
# Cargo resolves optional dependencies whether or not their feature is enabled,
# so `--features egui-app` failed to RESOLVE rather than failing to compile —
# with iced switched off. The two cannot coexist in one manifest at all, which
# is stronger than the parent's comment claimed.
#
# Splitting the frontend out sidesteps that entirely and matches what every
# other port in this fleet does: egui-frontend/ with its own manifest. It also
# gives the parity audit the directory it looks for.
[package]
name = "ambient-learner-egui"
version = "0.1.0"
edition = "2021"

[features]
# The fleet convention: the binary is behind a default-ON `app` feature, so
# `--no-default-features` builds a headless library the pages can be tested
# against without a window system. That matters here more than elsewhere —
# eframe pulls glutin and winit, and this container cannot even LINK them, so
# without this split the pages would be untestable in CI.
#
# `egui` here is NOT optional in the usual sense — it must always be on for
# this crate to contain anything at all. lib.rs mounts the parent's
# src/egui_lib.rs via #[path], and that file's own top line is
# `#![cfg(feature = "egui")]`. Inner cfg attributes are evaluated against the
# CURRENT crate's features, not the parent's, so without an `egui` feature
# declared HERE — enabled unconditionally — that cfg is always false in this
# crate's build, `mod applib` (the #[path] mount) resolves to nothing, and
# `pub use applib::*` in lib.rs fails with "unresolved import `applib`".
# That's not a lint or a warning: `cargo check --bin ambient-learner-egui`
# fails to compile without this. Every text-based audit in this repo
# (parity_audit.py, reachability.py, wiring_check.py) reported this app by
# grepping source that was never actually reachable — none of them run
# cargo, so none of them could see that the crate didn't build at all.
#
# `app` implies `egui` rather than listing both in `default`: the eframe
# binary obviously needs the view code, so there is no state where you'd want
# `app` without it. The headless-testing mode this file's other comment
# documents is `--no-default-features --features egui` (egui without eframe),
# not bare `--no-default-features` — a build with neither feature has no
# window host AND no view code to test, which isn't a real use case, so it's
# left failing rather than papered over with a third, meaningless feature
# combination.
default = ["app"]
app = ["dep:eframe", "egui"]
egui = []
# Declared so the engine's `cfg(feature = "dbus")` / `cfg(feature = "gtk")`
# gates are known names rather than unexpected-cfg warnings. Never enabled
# here: the dbus paths need zbus and the gtk ones need gtk4, neither of
# which this crate links.
dbus = []
gtk = []

[dependencies]
egui = "0.34"
eframe = { version = "0.34", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
weather-share = { path = "../../../shared/weather-share" }

# The engine's dependencies. `src/egui_lib.rs` mounts the parent's engine
# (Model, ThermalPoller, Database, the worker systems) by `mod` path, so this
# crate compiles that code and needs what it needs. Versions match the
# parent's Cargo.toml so a `cargo update` in one does not fork the other.
chrono = "0.4"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
flate2 = "1.0"
parking_lot = "0.12"
core-kit = { path = "../../../shared/core-kit" }

[dev-dependencies]
tempfile = "3.8"

[lib]
# The engine's doc comments carry illustrative snippets (`Phone:
# "Snapdragon…"`, `AsyncDbWriter::new(100)`) written for a binary crate,
# where rustdoc never compiled them. Under a library root they are 17
# failing doctests about code that is not the code. Off, rather than
# rewriting every snippet in a file shared with the GTK build.
doctest = false

[[bin]]
name = "ambient-learner-egui"
path = "src/main.rs"
required-features = ["app"]
