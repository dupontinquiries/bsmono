[package]
name = "bot-arena-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "bot-arena's dashboard, ported from GTK4/libadwaita to egui on uikit-egui. Views (Setup / Arena / Standings / Replays / Logs / Studio) are swipe-paged via the shared gesture layer (uikit-gesture), laid out by the adaptive layer, and voice/a11y-navigable. Drives the real engine: bot-arena (GTK-free with default-features = false) runs on a worker thread and streams EngineMsg back, exactly as under the GTK shell; Corpus Studio (GTK's second binary) is the Studio page."

[lib]
path = "src/lib.rs"
# No doctests here, and the rustdoc target was producing nothing but noise:
# `cargo test` reported E0463 "can't find crate for `uikit_egui`" from the
# --doc target while the lib itself compiled clean. This crate has no runnable
# doctest to lose (its only fenced blocks are ```text), so the target's entire
# output was a false failure.
#
# This removes a WRONG SIGNAL; it does not explain it. What is known: the
# rustdoc invocation carried a correct `--extern uikit_egui=...rlib` and still
# could not resolve it. What ruled out the obvious theory: ambient-learner
# (49 compiled doc blocks), logscope-egui (18) and snapclone-egui (9) all
# depend on uikit-egui, all have real doctests, and all PASS -- so this is not
# a blanket target-dir or dependency problem, and the cause is still unknown.
# It may well resurface on a crate that does have doctests, where turning them
# off would not be the right answer.
doctest = false

[[bin]]
name = "bot-arena-egui"
path = "src/bin/bot_arena_egui.rs"
required-features = ["app"]

[features]
default = ["app"]
app = ["dep:eframe"]

[dependencies]
# The real core: engine / fsm / registry / models, GTK-free.
bot-arena = { path = "..", default-features = false }
async-channel = "2"
egui = "0.34"
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
uikit-gesture = { path = "../../../shared/uikit/crates/uikit-gesture" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../shared/settings-kit" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }

[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }

[workspace]
