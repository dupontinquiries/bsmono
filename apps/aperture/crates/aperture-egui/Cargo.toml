[package]
name = "aperture-egui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "aperture's egui shell on uikit-egui: a virtualized editor view with a critically-smoothed camera (scroll, caret, and font size all animate through one Smooth primitive), ghost-text AI completion with Tab / word-accept, the fuzzy command palette, and the loop pane — the completion engine's requests, latencies and outcomes rendered live with the host/model steerable in place. Palettes via snapclone-theme, easing via uikit-egui motion."

[lib]
path = "src/lib.rs"

[[bin]]
name = "aperture"
path = "src/bin/aperture.rs"
required-features = ["app"]

[features]
# Default-on so `cargo build --release` (what the build orchestrator runs — see
# manifest/projects.toml) produces the deploy binary directly, same convention
# as bo-suite-egui / rusty-board-egui.
default = ["app", "tree-sitter", "engine", "voice"]
# Spoken input in the voice-command mode (uikit's voice popup: microphone
# capture + whisper transcription). A feature so a device without a mic or
# the memory for a speech model builds without it (whisper.cpp is a C++
# build); the mode still works by typing. Default-on for desktops.
voice = ["uikit-egui/voice-popup"]
# The IN-PROCESS wgpu inference engine (aperture-engine + gpu-gemm).
#
# DEFAULT-ON, and that is the requirement rather than a preference: aperture
# has to be able to operate the backend ITSELF, as the only app open — no
# logscope-serve running somewhere, no daemon yet, no second process at all.
# `cargo build --release` (what manifest/projects.toml documents as the way
# to get the bin) uses default features, so an engine left out of `default`
# is an engine the shipped editor does not have.
#
# The cost is real and worth naming: this links wgpu/naga/pollster, so a
# cold build is minutes rather than seconds. The fast edit-test loop is
#   cargo test -p aperture-egui --no-default-features --features tree-sitter
# which is what to use while working on the editor itself. The F2 engine
# panel is present in both builds and says which one you are in, so a
# no-engine build is visible rather than silently inert.
engine = ["aperture-engine/gpu"]
# Grammar highlighting + outline (context filler, symbol popup). Explicitly
# default HERE and not merely inherited via workspace feature unification —
# `cargo test -p aperture-egui` builds without sibling crates' features, and
# a feature that only unification turns on is a feature that's off exactly
# when you test it.
tree-sitter = ["aperture-core/tree-sitter"]
app = ["dep:eframe"]

[dependencies]
aperture-core = { workspace = true }
aperture-complete = { workspace = true }
aperture-lsp = { workspace = true }
aperture-engine = { workspace = true }
egui = { workspace = true }
uikit-egui = { path = "../../../../shared/uikit/crates/uikit-egui" }
# Touch gestures (tap / double-tap / long-press / pan / fling) for the editor
# surface: the fleet's shared recognizer, std-only.
touchkit = { path = "../../../../shared/touchkit" }
# Offer the navigation commands on the on-screen keyboard (rusty-board) while
# focused, instead of a toolbar a desktop would also have to look at.
keyboard-strip = { path = "../../../../shared/keyboard-strip" }
snapclone-theme = { path = "../../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../../shared/settings-kit" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }

[dev-dependencies]
egui_kittest = { version = "0.34", features = ["wgpu", "snapshot"] }

# What gitmind's per-device feature selection needs to know: builds for a
# device without these drop the feature (see cockpit::capabilities).
[package.metadata.gitmind.needs]
voice = ["audio-in", "memory:3000"]
engine = ["gpu"]
