[package]
name = "aperture-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "aperture's LSP client: spawns a language server subprocess, speaks JSON-RPC over its stdio (Content-Length framing, textDocument/didOpen, textDocument/completion), and reports outcomes back through the same worker-thread/inbox/outbox shape as aperture-complete's completion Engine. Unlike aperture-complete, NOT zero-dependency — JSON-RPC without a JSON library is a hand-rolled parser earning its keep nowhere else, so serde/serde_json are a deliberate, scoped exception to that crate's std-only rule, not a drift from it."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
