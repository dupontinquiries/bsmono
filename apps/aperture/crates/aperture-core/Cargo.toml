[package]
name = "aperture-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "aperture's headless editor core: a rope buffer, every edit as a serializable invertible Op (studio's pattern applied to text — undo, macros and future collab are one mechanism), cursor/selection with sticky columns, and the LineLexer syntax seam with an incremental state cache. No egui, no I/O beyond load/save."

# Unconditional deps: ONE, looked at hard (the fan rule): ropey. A rope is what
# makes edits O(log n) in a 100 MB file instead of O(n) — the difference between
# "lightning fast" being a claim and a property. Pure Rust, no transitive deps
# beyond smallvec/str_indices, cross-compiles clean to aarch64/musl.
#
# Behind `tree-sitter` (default in both shells): the parser runtime + the Rust
# grammar + streaming-iterator. C code (cc at build), version-PAIRED — the
# grammar crates bridge through tree-sitter-language, but bump runtime and
# grammar together anyway (DESIGN.md gotcha). The hand lexer stays as the
# no-feature build and the unsupported-language fallback.
[features]
# Incremental tree-sitter highlighting behind the LineLexer seam. Off = the
# dependency-free hand lexer (still the fallback for unsupported languages).
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:streaming-iterator"]

[dependencies]
ropey = "1.6"
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
# tree-sitter 0.25 returns query captures as a StreamingIterator, not Iterator.
streaming-iterator = { version = "0.1", optional = true }
