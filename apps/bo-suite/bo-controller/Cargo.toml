[package]
name = "bo-controller"
version = "0.1.0"
edition = "2021"

[[example]]
name = "api_explorer"
path = "examples/api_explorer.rs"

[dependencies]
bo-core = { path = "../bo-core" }
# rms (podcast_diar.rs) — audio-kit's own doc names this exact function
# (podcast_diar) as one of three byte-identical copies it unifies (with
# voiceterm/separation.rs and snapclone-audio). Zero-dependency itself.
audio-kit = { path = "../../../shared/audio-kit" }
qmetaobject = "0.2"
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
cstr = "0.2"
urlencoding = "2.1"
serde = { version = "1.0", features = ["derive"] }
dbus = "0.9"
# Used by lyrics_transcriber: stable hashing of source path for
# cache filename + XDG data-dir lookup so transcripts live under
# ~/.local/share/bo-controller/lyrics/<hash>.lrc.
sha2 = "0.10"
dirs = "5"

# Added: compile-time-embedded fallback for the qml/ directory so the
# binary runs from any working directory. This is the only new dependency
# versus your original Cargo.toml.
include_dir = "0.7"

# mDNS / DNS-SD discovery of B&O devices on the LAN. Safe Rust, runs its
# own daemon thread (no async-runtime dependency), tested against Avahi.
mdns-sd = "0.11"

# ── Media library ───────────────────────────────────────────────────
# The SQLite catalog, scanner, and tag read/write moved to bo-media (see
# that crate) so bo-suite-egui can use the real library without going
# through this Qt binary. `mod media;` below is now a `use bo_media as
# media;` alias so every existing `media::Foo` call site is unchanged.
bo-media = { path = "../bo-media" }
# dlna_discover / dlna_position / play_uri / track_server moved to bo-cast
# (Qt-free) so bo-suite-egui can cast to a device too, not just this binary.
bo-cast = { path = "../bo-cast" }
# mux_bridge.rs calls bo_mux::control::socket_path() to reach the daemon's
# control socket but the crate was never added as a dependency — pre-existing
# gap, unrelated to the media extraction; fixed here since it's now blocking
# any build of this binary.
bo-mux = { path = "../bo-mux" }
math-kit = { path = "../../../shared/math-kit" }
# audiopus — actively-maintained libopus binding with a cleaner streaming
# API. Used by the new stem_split + podcast_diar paths. The older `opus`
# crate stays for direct use here (track_server.rs's live OggOpus
# encode) and is also what bo-core's looper.rs uses now (moved with
# realtime_mixer) — two independent copies of the same dependency
# version, not a shared build artifact.
audiopus = "0.2"
opus = "0.3"
ogg = "0.9"
hound = "3"
once_cell = "1"          # lazily-compiled regexes (play_uri.rs, main.rs)

# libc — needed for prctl(PR_SET_PDEATHSIG, SIGTERM) on Linux so that
# paplay/ffmpeg children get SIGTERM the moment our process dies, by
# any means (clean exit, SIGKILL, window-manager force-close, crash).
# Without this, the kernel reparents our children to init/systemd and
# they keep playing audio after we're gone — exactly what the user
# complained about. The pre_exec hook on tokio's Command lets us call
# prctl right before exec, in the child process.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Audio analysis (BPM/key) is heavy (pulls ffmpeg/symphonia via bliss) and
# slow to compile, so it's optional. Without it the library does everything
# except compute BPM/key. Enable with:  cargo build --features analysis
bliss-audio = { version = "0.9", optional = true }

[features]
default = []
analysis = ["dep:bliss-audio"]

[dev-dependencies]
# Used in settings_store tests to redirect persistence to a
# per-test temp dir.
tempfile = "3"
# Four test helpers in this crate set XDG_DATA_HOME to their own temp dir and
# cargo runs them in parallel. envlock-kit serialises that and restores on
# Drop; see its module header for the four fleet bugs it was written after.
envlock-kit = { path = "../../../shared/envlock-kit" }

[build-dependencies]
qmetaobject = "0.2"
