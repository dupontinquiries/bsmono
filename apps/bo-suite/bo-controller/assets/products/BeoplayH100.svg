<svg color="#C8A04B" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none"
     stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- BeoplayH100 over-ear headphones. Soft headband arc connecting
       two oval earcups; small slider stems suggesting the
       extension/height adjustment. Centered and balanced inside the
       viewBox with room around the edges so PreserveAspectFit can
       render edge-to-edge without clipping the strokes. -->

  <!-- HEADBAND — an arc spanning across the top, slightly fatter
       than a hairline so it reads on tiny renders. -->
  <path d="M 13 28 Q 32 8 51 28" stroke-width="2.6"/>

  <!-- SLIDER STEMS — short verticals just below the headband, one
       per side, the kind of telescoping detail you see on premium
       cans. -->
  <line x1="13" y1="28" x2="13" y2="34"/>
  <line x1="51" y1="28" x2="51" y2="34"/>

  <!-- EARCUPS — soft rounded rectangles, one per ear. The "oval"
       shape on the H100/HX is roughly 16w × 22h, longer than wide. -->
  <rect x="5"  y="32" width="16" height="22" rx="7" ry="7"/>
  <rect x="43" y="32" width="16" height="22" rx="7" ry="7"/>

  <!-- INNER SPEAKER MEMBRANE — small dot in each cup. -->
  <circle cx="13" cy="43" r="2" fill="currentColor" stroke="none" opacity="0.85"/>
  <circle cx="51" cy="43" r="2" fill="currentColor" stroke="none" opacity="0.85"/>

  <!-- DETAIL — subtle ear-pad ring just inside each cup, hinting at
       the leather/foam pad without crowding the silhouette. -->
  <ellipse cx="13" cy="43" rx="5" ry="8" stroke-width="0.9" opacity="0.5"/>
  <ellipse cx="51" cy="43" rx="5" ry="8" stroke-width="0.9" opacity="0.5"/>
</svg>
