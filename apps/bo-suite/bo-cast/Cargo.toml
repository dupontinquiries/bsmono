[package]
name = "bo-cast"
version = "0.1.0"
edition = "2021"
description = "Casting a track to a networked B&O speaker: SSDP/DLNA discovery, AVTransport position polling, the best-effort ASE/BeoZone play_url_on_device, and the local HTTP server that hands a file (or a mixed-down stream) to a device that can only fetch a URL. Was bo-controller/src/{dlna_discover,dlna_position,play_uri,track_server}.rs — Qt-free already, just previously reachable only from that binary."

[dependencies]
bo-core = { path = "../bo-core" }        # realtime_mixer + looper, for track_server's on-the-fly mixdown
serde_json = "1"
once_cell = "1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
opus = "0.3"
ogg = "0.9"

[dev-dependencies]
tempfile = "3"
hound = "3"
