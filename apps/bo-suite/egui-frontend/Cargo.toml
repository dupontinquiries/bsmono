[package]
name = "bo-suite-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "bo-controller's Qt/QML control panel ported to egui on uikit-egui: device volume/playback controls and scene presets, swipe-paged (Devices / Scenes / Library) via the shared gesture layer, adaptive, a11y-navigable, and live cross-app settings. bo-suite's engine (realtime_mixer / channel_routing / bo-mux) is Qt-free, so on-device this front-end drives it directly."

[lib]
path = "src/lib.rs"

[[bin]]
name = "bo-suite-egui"
path = "src/bin/bo_suite_egui.rs"
required-features = ["app"]

[features]
default = ["app"]
# Default-on so `cargo build --release` (what the build orchestrator runs, no extra flags — see
# manifest/projects.toml) produces the deploy binary directly, same convention as rusty-board-egui /
# voiceterm-egui.
app = ["dep:eframe"]

[dependencies]
# THE ENGINE. Absent until now: this frontend rendered the whole ANC
# application while depending on no part of it, which parity_audit could not
# see because every column it had measured surface reachability rather than
# connection. bo-mux is std-only here (audiomix-kit, mic-kit, serde,
# signal-hook), so linking it costs no audio-hardware dependency and makes
# DroneCanceller's real phase machine available to the UI.
bo-mux = { path = "../bo-mux" }
# bo-core carries pattern_learner, which is the premise the whole project rests
# on: periodic noise can be PREDICTED from the previous cycle, so latency stops
# mattering. It was marked #![allow(dead_code)], vendored from bo-mux (which no
# longer has a copy), and referenced by nothing anywhere in the tree.
bo-core = { path = "../bo-core" }
# bo-controller's Qt-free media library (SQLite catalog, scanner, tag
# read/write, playlists/queue/history) — see real_catalog.rs. Was reachable
# only from the Qt binary; both front-ends now read/write the same database.
bo-media = { path = "../bo-media" }
# Named directly in real_catalog.rs (RealCatalog.conn: rusqlite::Connection) —
# same version bo-media pins, not a second copy: cargo unifies by semver.
rusqlite = { version = "0.31", features = ["bundled"] }
# XDG paths + flat [section] key=value, the fleet's one path rule.
config-kit = { path = "../../../shared/config-kit" }
# bo-mux/protocol.rs is mounted by #[path] and derives Serialize/Deserialize;
# the port needs serde only to satisfy those derives, not to serialise anything.
serde = { version = "1", features = ["derive"] }
egui = "0.34"
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
uikit-gesture = { path = "../../../shared/uikit/crates/uikit-gesture" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../shared/settings-kit" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }

[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }
tempfile = "3"

[workspace]
