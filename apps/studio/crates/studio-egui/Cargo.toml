[package]
name = "studio-egui"
version = "0.1.0"
edition = "2021"
description = "Studio's timeline UI on uikit-egui: tracks, clips, ruler, and the peer-presence overlay that makes collaborative editing legible."

[dependencies]
# For SMPTE ruler labels — see `ruler_label`.
studio-video = { path = "../studio-video", default-features = false }
# The live rack model. A dependency rather than a copy: the grid is a VIEW of
# the pattern, and a second definition of what a step is would drift from the
# one the audio thread reads.
studio-live = { path = "../studio-live" }
# The over-scroll detent model, at its second call site — the extraction
# that moved it to shared/. Decision logic only; the shell owns scrollbars.
gesture-kit = { path = "../../../../shared/gesture-kit" }
# The transcript index and routine repertoire. A dependency rather than a copy:
# the palette is a VIEW of the repertoire, and a second notion of what a routine
# is would drift from the one that actually runs.
studio-voice = { path = "../studio-voice" }
studio-core = { path = "../studio-core" }
studio-collab = { path = "../studio-collab" }
studio-audio = { path = "../studio-audio" }
studio-fx = { path = "../studio-fx" }
egui = "0.34"        # must match uikit-egui, or Color32 and Sense are different types
uikit-egui = { path = "../../../../shared/uikit/crates/uikit-egui" }

[dev-dependencies]
# Only the tests need to BUILD a palette; the widget takes one it is handed.
# uikit-egui's PaletteColors is constructed from a snapclone-theme Palette and
# has no Default, so a test that drives the real widget needs the source type.
snapclone-theme = { path = "../../../../shared/uikit/crates/snapclone-theme" }

[features]
opus = ["studio-video/opus"]
