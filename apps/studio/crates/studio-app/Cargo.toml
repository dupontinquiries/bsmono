[package]
name = "studio-app"
version = "0.1.0"
edition = "2021"
description = "The runnable Studio: an eframe shell that wires the timeline, transport, mastering chain and collaboration into an application you can actually start."

[[bin]]
name = "studio"
path = "src/main.rs"

# A library of FL Studio zipped loop packages -> verified .studio projects
[[bin]]
name = "flp-batch"
path = "src/bin/flp_batch.rs"
# the binary IS the window: a --no-default-features build (the demo-project
# examples, headless tools) skips it instead of failing on it
required-features = ["app"]

[dependencies]
# FL Studio zipped loop packages (flp_batch): deflate only, like tomescope
zip = { version = "2", default-features = false, features = ["deflate"] }
# content-addressed media store (flp_batch --store): as studio-video uses it
sha2 = "0.10"
studio-assemble = { path = "../studio-assemble" }
studio-core = { path = "../studio-core" }
studio-collab = { path = "../studio-collab" }
studio-audio = { path = "../studio-audio" }
studio-egui = { path = "../studio-egui", default-features = false }
studio-live = { path = "../studio-live" }
voice-engine-kit = { path = "../../../../shared/voice-engine-kit", features = ["voice"] }
studio-fx = { path = "../studio-fx" }
studio-voice = { path = "../studio-voice" }
studio-media = { path = "../studio-media", default-features = false }
audio-kit = { path = "../../../../shared/audio-kit" }
studio-video = { path = "../studio-video", default-features = false }
# bscale as a library job (GPU via wgpu 29 behind its default-on `gpu` feature).
d2x-job = { path = "../../../bscale/crates/d2x-job" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-copilot = { path = "../studio-copilot" }
voiceprint-kit = { path = "../../../../shared/voiceprint-kit" }
analog-kit = { path = "../../../../shared/analog-kit" }
egui = "0.34"
uikit-egui = { path = "../../../../shared/uikit/crates/uikit-egui" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }
arc-swap = "1"
# Same major as studio-io's device feature, so the workspace resolves ONE cpal.
cpal = { version = "0.15", optional = true }
# MIDI hardware in. Same shape as the audio feature: ALSA-backed on Linux,
# optional so a build without those headers still produces a working editor.
midir = { version = "0.10", optional = true }

rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[features]
# Default-on so `cargo build --release` produces the deployable binary directly,
# the same convention every other egui frontend in the fleet uses.
default = ["app", "audio", "midi", "picker"]
app = ["dep:eframe"]
# Loop audition through cpal. Off => NullSink: the app still runs, silently,
# with a wall-clock playhead — a build box without ALSA headers must not lose
# the ability to build the editor.
# Sound: cpal output, and Opus decode through the media stack (libopus, C).
# Off, studio builds codec-free with no audio device (a Paper Pro without
# Bluetooth audio running; see [package.metadata.gitmind.needs]).
audio = ["dep:cpal", "studio-media/opus", "studio-video/opus", "studio-egui/opus"]
# The native file dialog (XDG portal on Linux). Off => the export flow falls
# back to ./exports and the status line says so — a headless build must not
# lose the exporter, the audio feature's own reasoning.
picker = ["dep:rfd"]
midi = ["dep:midir"]

[package.metadata.gitmind.needs]
audio = ["audio-out"]
midi = ["audio-out"]
