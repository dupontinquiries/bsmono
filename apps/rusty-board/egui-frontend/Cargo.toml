[package]
name = "rusty-board-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "rusty-board's on-screen keyboard, ported from GTK4 to egui on the shared uikit-egui + adaptive layer. The renderer sizes keys by device class (bigger touch targets on the FP5, tighter on desktop) and themes from snapclone-theme. Keeps a small standalone Layout so the front-end is buildable on its own; on-device it consumes rusty-board's GTK-free `layouts` module and drives keyboard/engine.rs."

[lib]
path = "src/lib.rs"

[[bin]]
name = "rusty-board-egui"
path = "src/bin/rusty_board_egui.rs"
required-features = ["app"]

# The companion: every setting plus the custom layout editor, as an ordinary
# app window (and a CLI with arguments). Writes the files the keyboard reads
# and pokes it over the ctl socket.
[[bin]]
name = "rusty-board-settings"
path = "src/bin/rusty_board_settings.rs"
required-features = ["app"]

[features]
# The default IS the deploy binary: the build orchestrator and anyone typing
# `cargo build --release` get the docked, input-method keyboard. It used to be
# ["app"] alone, which silently produced a window-only binary with no
# layer-shell or input-method code in it (`strings` finds no
# zwlr_layer_shell) — it came up as an app window on the FP5 and typed into
# its own preview. Neither feature needs a compositor at BUILD time
# (wayland-backend is `dlopen`), only libxkbcommon's headers; at RUN time
# with no layer shell the binary falls back to a toplevel window on its own.
# Preview-only desktop build:
#   cargo build --no-default-features --features app
default = ["app", "wayland", "layer"]
# THE REAL KEYBOARD. On device (Plasma Mobile, COSMIC, Fairphone) this is the
# feature that turns taps into input for the FOCUSED window rather than for a
# preview box. Without it the app types into itself.
wayland = ["dep:board-compositor", "board-compositor/wayland"]
# THE DOCKED KEYBOARD. A zwlr_layer_shell_v1 surface driven by sctk + EGL
# (glutin) + egui_glow, no winit: anchored to the bottom edge with an
# exclusive zone, never focused, mapped on Activate / unmapped on
# Deactivate. This is what "tucks away like Maliit" means on Phosh, Sway
# and KWin. Every crate here is already in
# the tree through eframe's Wayland path; `client_system` on
# wayland-backend is what gives EGL a `wl_proxy*` to bind to.
layer = [
  "app",
  "dep:smithay-client-toolkit", "dep:wayland-client", "dep:wayland-backend",
  "dep:glutin", "dep:egui_glow", "dep:glow", "dep:raw-window-handle", "dep:libc",
]
# Dictation. Off by default because whisper-rs pulls a native build and a model
# file; the keyboard is fully usable without it, and a phone build that cannot
# compile is worse than one that cannot dictate.
voice = ["dep:whisper-rs", "dep:cpal", "dep:audio-kit"]
# The runnable eframe app. A lib-only consumer opts out with `default-features = false`.
app = ["dep:eframe"]

[dependencies]
# Only under `wayland`: the zwp_input_method_v2 / zwp_virtual_keyboard_v1
# backend and its detection, GTK-FREE. This used to be `rusty-board` (the
# GTK crate) with its `wayland` feature, which pulls `gdk-integration` +
# `gtk4-layer-shell` — so the egui keyboard's Wayland build needed the
# whole GTK4/libadwaita graph it exists to not need, and could not be
# built on a machine without it. `board-compositor/wayland` is the same
# protocol code with its own connection and a `pump()` the frame loop
# drives (see wayland.rs), so nothing here needs a GLib main context.
board-compositor = { path = "../crates/board-compositor", optional = true, default-features = false }
# Mic-level peak metering used by the MOUNTED voice/recorder.rs — a dep the
# GTK crate declares and this crate must too, or the shared file dangles
# (the c11 mount-path lesson, dependency flavour).
audio-kit = { path = "../../../shared/audio-kit", optional = true }
# Voice: the port mounts rusty-board's own voice stack by #[path] (it is
# GTK-free), so these are the same deps the GTK build uses, at the same versions.
# Pinned to 0.16 -- see apps/rusty-board/Cargo.toml for why.
whisper-rs = { version = "0.16", optional = true }
cpal = { version = "0.15", optional = true }
parking_lot = "0.12"
tracing = "0.1"
anyhow = "1"
directories = "5"
toml = "0.8"
# Only used by the mounted src/steno/mod.rs's `global()` singleton —
# same crate+version the GTK app depends on for the same file.
once_cell = "1.20"
egui = "0.34"
# the shared layout/input model (the gtk app and this frontend read ONE schema)
board-layouts = { path = "../crates/board-layouts" }
# the SHARED swipe recognizer (same code the GTK app uses — see crates/board-gestures)
board-gestures = { path = "../crates/board-gestures" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../shared/settings-kit" }
mic-kit = { path = "../../../shared/mic-kit" }
voice-kit = { path = "../../../shared/voice-kit" }
signal-kit = { path = "../../../shared/signal-kit" }
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"], optional = true }

# Only under `layer` — see the feature's comment.
smithay-client-toolkit = { version = "0.19", default-features = false, optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"], optional = true }
glutin = { version = "0.32", default-features = false, features = ["egl", "wayland"], optional = true }
egui_glow = { version = "0.34", default-features = false, optional = true }
glow = { version = "0.17", optional = true }
raw-window-handle = { version = "0.6", optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }

# This package is NOT a member of ../Cargo.toml's workspace, so it did not inherit the GTK
# app's release profile: `cargo build --release` here ran with cargo's defaults — no LTO,
# 16 codegen units, unstripped, unwinding. Same settings as the GTK app now, for the same
# reasons (a phone binary: smaller, faster, and a panic in a keyboard is a restart anyway).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

# Headless frame-cost benchmark; needs no eframe.
[[example]]
name = "frame_bench"
required-features = []
