[package]
name = "board-layouts"
version = "0.1.0"
edition = "2021"
description = "rusty-board's keyboard-layout layer: the Key/KeyAction model, KeypadState + code-mode, Layout/Row + JSON io, and the layout builders — gtk-free, shared by the GTK app and the egui frontend"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
directories = "5"
