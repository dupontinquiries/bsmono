<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a5fb4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect x="8" y="8" width="112" height="112" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Keyboard body -->
  <g filter="url(#shadow)">
    <rect x="22" y="40" width="84" height="56" rx="8" ry="8" fill="#fafafa"/>
  </g>

  <!-- Top row of keys -->
  <g fill="#3584e4" opacity="0.85">
    <rect x="28" y="48" width="10" height="10" rx="2"/>
    <rect x="42" y="48" width="10" height="10" rx="2"/>
    <rect x="56" y="48" width="10" height="10" rx="2"/>
    <rect x="70" y="48" width="10" height="10" rx="2"/>
    <rect x="84" y="48" width="14" height="10" rx="2"/>
  </g>

  <!-- Middle row -->
  <g fill="#5e9ce8" opacity="0.85">
    <rect x="28" y="62" width="10" height="10" rx="2"/>
    <rect x="42" y="62" width="10" height="10" rx="2"/>
    <rect x="56" y="62" width="10" height="10" rx="2"/>
    <rect x="70" y="62" width="10" height="10" rx="2"/>
    <rect x="84" y="62" width="14" height="10" rx="2"/>
  </g>

  <!-- Spacebar row -->
  <g fill="#3584e4">
    <rect x="28" y="76" width="10" height="10" rx="2" opacity="0.85"/>
    <rect x="42" y="76" width="42" height="10" rx="2" opacity="0.6"/>
    <rect x="88" y="76" width="10" height="10" rx="2" opacity="0.85"/>
  </g>

  <!-- Swipe trail -->
  <path d="M 32 53 Q 50 45, 65 53 T 92 53"
        stroke="#ff7800" stroke-width="2.5" fill="none"
        stroke-linecap="round" opacity="0.9"/>
  <circle cx="32" cy="53" r="2.5" fill="#ff7800"/>
  <circle cx="92" cy="53" r="2.5" fill="#ff7800"/>
</svg>
