<?xml version="1.0" encoding="UTF-8"?>
<!--
  Voice / microphone icon. Grayscale symbolic style — uses
  currentColor so CSS color rules apply. Designed to read
  cleanly at 16-24px sizes on phone displays.

  Composition:
    - Microphone capsule (rounded pill) at top
    - Stand arc (open quarter-circle) below capsule
    - Stand post + base (short vertical + short horizontal)

  Stroke widths chosen so the icon stays legible after 3x
  HiDPI downscaling. All shapes use fill, not stroke, so the
  weight is consistent regardless of how GTK renders it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Mic capsule (the part you speak into). Rounded rect. -->
  <rect x="6"   y="2"  width="4"  height="7"
        rx="2"  ry="2"
        fill="currentColor"/>
  <!-- Stand arc: open at top, runs from upper-left of stand
       down and around to upper-right, framing the capsule.
       Drawn as a stroke since it's a thin curve. -->
  <path d="M 4 7 a 4 4 0 0 0 8 0"
        stroke="currentColor" stroke-width="1.4"
        fill="none" stroke-linecap="round"/>
  <!-- Stand post: vertical line below the capsule down to the base. -->
  <rect x="7.4" y="11" width="1.2" height="2.5"
        fill="currentColor"/>
  <!-- Base: horizontal cap at the very bottom. -->
  <rect x="5.5" y="13" width="5"   height="1.2"
        rx="0.6" ry="0.6"
        fill="currentColor"/>
</svg>
