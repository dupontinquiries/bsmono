[package]
name = "dialer-core"
version = "0.1.0"
edition = "2021"
description = "Headless phone-call engine: the call session model (states, outcomes, history), the Command/Event channel protocol, a mock backend that simulates a modem, and a ModemManager (zbus) backend behind the `mm` feature. No UI types anywhere in this crate."
license = "MIT OR Apache-2.0"

# Why the split:
#   · session.rs is the part with decisions in it (what counts as a missed vs
#     rejected call, when a history entry is born) — pure, unit-tested, no I/O.
#   · link.rs is the protocol: Command in, Event out, over std mpsc. Backends
#     are spawn functions returning a Link; the trait object the protocol
#     replaces would have forced async plumbing into the UI thread.
#   · mock.rs / mm.rs are transports. The mock is not a test double bolted on
#     later — it is the desktop story (no modem on a dev laptop) and the demo
#     story, so it lives in the crate proper.
#
# The `mm` feature exists so the model compiles and tests on old toolchains
# and in sandboxes with no D-Bus; the egui app turns it on by default.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serviceproviders.xml (mobile-broadband-provider-info) parsing; tiny, pure Rust
roxmltree = "0.20"
zbus = { version = "4.4", optional = true }
# matrix HTTP; blocking, fits the visible-loop style. The pure JSON layer of
# matrix.rs compiles and tests without it.
ureq = { version = "2", optional = true }
# IRC as a fourth transport on the same Link. irc-kit is zero-dependency
# (std + two std-only path kits), so the default feature set gains nothing;
# TLS is a separate opt-in because rustls is the only heavy part.
irc-kit = { path = "../../../../shared/irc-kit", optional = true }
# default-features = false is load-bearing: rustls 0.23 defaults to the
# aws-lc-rs provider, which builds AWS-LC from C via cmake. That drags a C
# toolchain into a cross build for aarch64 phones — the exact thing that turns
# `cargo build --target` into an afternoon. ring is pure-Rust-plus-asm and
# cross-compiles clean, which is why it is named explicitly rather than added
# alongside the default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []
mm = ["dep:zbus"]
matrix = ["dep:ureq"]
irc = ["dep:irc-kit"]
# Plaintext IRC needs no crypto; TLS ports (6697) do. Split so a build that
# only ever talks to a local bouncer does not pull rustls.
irc-tls = ["irc", "dep:rustls", "dep:webpki-roots"]
