# Phonetic confusion sets for voice transcription correction.
#
# When whisper transcribes a voice command, common acoustic confusions
# may produce the wrong word: "ls" → "less", "cd" → "see d", "pwd" →
# "pi w d", etc. We use this table to expand each transcribed token
# into a set of likely intended words, then run intent matching on
# all of them.
#
# Each [[group]] is a set of words that sound similar enough to be
# confused. Order within a group doesn't matter — we treat them
# symmetrically (any one heard could be any other intended).
#
# Adding a new group: append a new [[group]] entry. Confusion sets are
# loaded at startup; no rebuild needed.
#
# Tuning advice:
# - Keep groups small (3-5 words). Bigger groups expand the candidate
#   space too aggressively and slow intent matching.
# - Put words ACTUAL whisper output produces, not just dictionary
#   confusions. e.g. "ls" → "less" is real; "ls" → "lass" is unlikely
#   from a US-trained model.
# - Don't include very common words (the, and, is) — they appear in
#   too many non-command contexts.

# Common terminal command confusions
[[group]]
words = ["ls", "less", "list"]

[[group]]
words = ["cd", "seedy", "see d", "city"]

[[group]]
words = ["pwd", "pud", "pee w d"]

[[group]]
