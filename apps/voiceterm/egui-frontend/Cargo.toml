[package]
name = "voiceterm-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "voiceterm ported to egui — starting with the portable terminal core: a screen-grid model + a VT/ANSI parser (printable text, C0 controls, CSI cursor/erase/SGR), both pure and unit-tested. The egui cell renderer, PTY I/O, and voice/mail panes build on top. Ties into the cross-app action protocol: staged commands land on the input line."

[lib]
path = "src/lib.rs"

[[bin]]
name = "voiceterm-egui"
path = "src/bin/voiceterm_egui.rs"
required-features = ["app"]

[[bin]]
name = "terminal-standalone"
path = "src/bin/terminal_standalone.rs"
required-features = ["app"]

[features]
default = ["app"]
# Default-on so `cargo build --release` (what the build orchestrator runs, no extra flags — see
# manifest/projects.toml) produces the deploy binary directly, same convention as rusty-board-egui.
app = ["dep:eframe", "x11", "wayland"]

# Display backends, split so a build can pick one.
#
# Measured: eframe pulls BOTH by default here, and on a clean build
# x11rb-protocol is 10.5s and wayland-protocols 4.9s — 15.4s of a 122s build for
# two backends when a machine runs one. Twenty-four crates in this repo carry
# the same pair.
#
# `app` still enables both, so nothing changes for anyone building the default
# and a deploy binary still runs on either session type. What this adds is the
# ability to say `--no-default-features --features app-wayland` on a machine
# where the other backend is dead weight — which is every phone target this
# repo builds for.
x11 = ["eframe?/x11"]
wayland = ["eframe?/wayland"]
app-x11 = ["dep:eframe", "x11"]
app-wayland = ["dep:eframe", "wayland"]

[dependencies]
# XDG resolution. prefs_path() hand-rolled the same logic, with a comment
# saying "as config-kit uses" — so the fleet had two copies of one rule.
config-kit = { path = "../../../shared/config-kit" }
# The acoustic handshake state machine, shared with voiceterm's core. It was
# in the app crate, which has no [lib] and pulls qmetaobject — so reaching a
# pure state machine would have dragged Qt into this frontend.
peer-handshake = { path = "../../../shared/peer-handshake" }
egui = "0.34"
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui" }
# GestureLayer's adapter needs the model crate behind it. Added so the
# workspace can be swiped between tabs on a phone — the vertical rail keeps
# the screen space, and the gesture is how you move without reaching for it.
uikit-gesture = { path = "../../../shared/uikit/crates/uikit-gesture" }
uikit-term = { path = "../../../shared/uikit/crates/uikit-term" }
uikit-web = { path = "../../../shared/uikit/crates/uikit-web" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../shared/settings-kit" }
nifty-core = { path = "../../../shared/nifty-core" }
eframe = { version = "0.34", default-features = false, features = ["glow"], optional = true }

[workspace]

[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }

# Compile-speed policy (monorepo-wide, dev only): full DWARF is the single biggest
# artifact + link cost in these workspaces, and the sandbox/CI boxes are disk-starved.
# line-tables-only keeps file:line in backtraces (the part actually read) while
# cutting debuginfo ~10x. Release profiles are untouched. Override locally with
# CARGO_PROFILE_DEV_DEBUG=2 when a debugger session needs full types.
[profile.dev]
debug = "line-tables-only"
