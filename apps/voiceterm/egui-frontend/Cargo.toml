[package]
name = "voiceterm-egui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "voiceterm ported to egui — starting with the portable terminal core: a screen-grid model + a VT/ANSI parser (printable text, C0 controls, CSI cursor/erase/SGR), both pure and unit-tested. The egui cell renderer, PTY I/O, and voice/mail panes build on top. Ties into the cross-app action protocol: staged commands land on the input line."

[lib]
path = "src/lib.rs"

[[bin]]
name = "voiceterm-egui"
path = "src/bin/voiceterm_egui.rs"
required-features = ["shell"]

[[bin]]
name = "terminal-standalone"
path = "src/bin/terminal_standalone.rs"
required-features = ["shell"]

[features]
default = ["app"]
# Default-on so `cargo build --release` (what the build orchestrator runs, no extra flags — see
# manifest/projects.toml) produces the deploy binary directly, same convention as rusty-board-egui.
app = ["shell", "x11", "wayland", "voice"]
# `app` without dictation, for targets where whisper-rs cannot build — the
# static-musl case in `voice` below. Same binary, no listening.
app-novoice = ["shell", "x11", "wayland"]
# What the BINARY needs, as opposed to what a full build wants. `required-features`
# is AND-only, so `app` and `app-novoice` cannot both satisfy a gate naming
# either of them — they share this one instead.
shell = ["dep:eframe"]

# Dictation. ON in `app` because it is a voice terminal, and SEPARABLE because
# it is the only thing here that needs whisper-rs — which needs bindgen, which
# needs to dlopen libclang at build time.
#
# That last step is impossible on a static-musl target: reported from
# aarch64-unknown-linux-musl as `Unable to find libclang: ... Dynamic loading
# not supported`. Before this the feature was hardcoded into the uikit-egui
# dependency line, so `--no-default-features` could not turn it off and there
# was NO WAY to build this crate on musl at all.
#
# With it off, `voice_popup` is a stub with the same API and every voice
# control is inert. The terminal still works; it just does not listen.
voice = ["uikit-egui/voice-popup"]

# Display backends, split so a build can pick one.
#
# Measured: eframe pulls BOTH by default here, and on a clean build
# x11rb-protocol is 10.5s and wayland-protocols 4.9s — 15.4s of a 122s build for
# two backends when a machine runs one. Twenty-four crates in this repo carry
# the same pair.
#
# `app` still enables both, so nothing changes for anyone building the default
# and a deploy binary still runs on either session type. What this adds is the
# ability to say `--no-default-features --features app-wayland` on a machine
# where the other backend is dead weight — which is every phone target this
# repo builds for.
x11 = ["eframe?/x11"]
wayland = ["eframe?/wayland"]
app-x11 = ["dep:eframe", "x11"]
app-wayland = ["dep:eframe", "wayland"]

[dependencies]
# The raw sysfs accelerometer reader -- was a local iio_accel.rs, extracted
# to shared/iio-source (maintenance/C18_TODO.md section 2). Re-exported at
# the crate root as `iio_accel` so existing call sites are unchanged.
iio-source = { path = "../../../shared/iio-source" }
# The model-loading/capture/transcription core voice_popup.rs and
# ctrl_p_gesture.rs depend on (maintenance/C18_TODO.md sections 13/18/19)
# -- added here because it was designed and written without a compile
# available at the time (explicit constraint that turn), and this is the
# first real `cargo check`/`cargo test` run against those files since.
# voice-engine-kit no longer a direct dependency -- reached only through
# uikit-egui's voice_popup module (feature "voice-popup" below), which is
# where ctrl_p_gesture.rs/voice_popup.rs moved to. Confirmed nothing else
# in this crate calls voice_engine_kit:: directly before removing this.
# Pulled in by the voice-intent chain (`security`, `token_stats`).
libc = "0.2"
aho-corasick = "1"
flate2 = "1"
# XDG resolution. prefs_path() hand-rolled the same logic, with a comment
# saying "as config-kit uses" — so the fleet had two copies of one rule.
config-kit = { path = "../../../shared/config-kit" }
# The device identity's keypair (`identity.rs`) — the prerequisite
# TODO_multi_device_share.md names for wiring the peer panel.
crypto-kit = { path = "../../../shared/crypto-kit" }
# The acoustic handshake state machine, shared with voiceterm's core. It was
# in the app crate, which has no [lib] and pulls qmetaobject — so reaching a
# pure state machine would have dragged Qt into this frontend.
peer-handshake = { path = "../../../shared/peer-handshake" }
# The tab + pane layout tree. terminal_workspace.rs is #[path]-included
# from the app crate and now sits on top of this, so the dependency has
# to be here too — without it this frontend does not compile, which is
# exactly what happened when the model was lifted.
pane-kit = { path = "../../../shared/pane-kit" }
egui = "0.34"
uikit-egui = { path = "../../../shared/uikit/crates/uikit-egui", features = ["qrbig"] }
# The Bluetooth transfer half of the acoustic handshake: HandshakePayload
# now carries bt_addr once trusted, and this is what actually moves bytes
# once it does. "rfcomm" pulls bluer + tokio — isolated to a single spawned
# thread in bt_send.rs, not made the app's concurrency model; see that
# file's header for why (pty_host.rs already established std::thread as the
# pattern here, and one Bluetooth transfer at a time doesn't need more).
bt-kit = { path = "../../../shared/bt-kit", features = ["rfcomm"] }
# Matches the QML crate's own cpal version exactly (apps/voiceterm/
# Cargo.toml) -- handshake_audio.rs ports that crate's device-negotiation
# logic, and pinning a different cpal version here would risk the two
# builds behaving differently against the same hardware for no reason
# anyone would think to check first.
cpal = "0.15"
# The terminal needs an actual shell: pty_host spawns one. Same crate
# and version the Qt side uses, so behaviour cannot diverge between them.
portable-pty = "0.8"
# GestureLayer's adapter needs the model crate behind it. Added so the
# workspace can be swiped between tabs on a phone — the vertical rail keeps
# the screen space, and the gesture is how you move without reaching for it.
uikit-gesture = { path = "../../../shared/uikit/crates/uikit-gesture" }
uikit-term = { path = "../../../shared/uikit/crates/uikit-term" }
uikit-web = { path = "../../../shared/uikit/crates/uikit-web" }
snapclone-theme = { path = "../../../shared/uikit/crates/snapclone-theme" }
settings-kit = { path = "../../../shared/settings-kit" }
# Where a mail secret should live on THIS desktop, and the security checkup.
secret-kit = { path = "../../../shared/secret-kit" }
# The palace: Vec3 only, from the kit logscope's scenes use.
scene-kit = { path = "../../../shared/scene-kit" }
nifty-core = { path = "../../../shared/nifty-core" }
eframe = { version = "0.34", default-features = false, features = ["glow"], optional = true }

[workspace]

[dev-dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }

# Compile-speed policy (monorepo-wide, dev only): full DWARF is the single biggest
# artifact + link cost in these workspaces, and the sandbox/CI boxes are disk-starved.
# line-tables-only keeps file:line in backtraces (the part actually read) while
# cutting debuginfo ~10x. Release profiles are untouched. Override locally with
# CARGO_PROFILE_DEV_DEBUG=2 when a debugger session needs full types.
[profile.dev]
debug = "line-tables-only"
