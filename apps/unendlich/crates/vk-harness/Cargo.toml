[package]
name = "vk-harness"
version = "0.1.0"
edition = "2021"
description = "Headless CPU-Vulkan (lavapipe) compute harness for unit-testing GPU code paths without a display or real GPU."

[dependencies]
ash = { version = "0.37", features = ["loaded"] }

[dev-dependencies]
# For octree-sample GPU-vs-CPU parity: the ungated OctreeArray + sampler.
# mesh-ref additionally exposes the pure CPU mesher reference + compare_meshes
# (no glfw/ash) for the full GPU-vs-CPU mesh parity test.
unendlich-engine = { path = "../unendlich-engine", default-features = false, features = ["mesh-ref"] }
