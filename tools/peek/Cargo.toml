[package]
name = "peek"
version = "0.1.0"
edition = "2021"
description = "Fast line-range file viewer with bucket notation support"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
globwalk = "0.9"
anyhow = "1.0"
thiserror = "2.0"

[[bin]]
name = "peek"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

[[bin]]
name = "peek2"
path = "src/peek2.rs"
